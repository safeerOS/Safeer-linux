app-id: io.github.memelandfaner.SafeerBrowser
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
# Clang/LLVM 22 za nas WebKitGTK (packaging/webkit/webkitgtk6-safeer.yml): LTO in PGO WebKit podpira samo s Clangom.
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm22
command: safeer
# Safeer Browser na GTK4 (safeer_brskalnik.py) z nasim WebKitGTK 6.0 - isti modul kot Safeer OS (packaging/webkit).
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --share=network
  - --socket=pulseaudio
  # Iste nastavitve, prijave, piskotki in zaznamki kot paket .deb (~/.config/safeer-mint; zaganjalnik in
  # safeer_brskalnik.py v Flatpaku nastavita XDG_* na domaco mapo), prenosi v mapo XDG (»Prejemi«), uvoz zaznamkov
  # iz Firefoxa in Chroma ter Safeer DRM: paket se prenese v ~/.local/share/safeer-drm, seja je v ~/.cache/safeer-drm,
  # program pa tece na gostitelju in obe mapi bere po isti poti. Ozja dovoljenja ne bi nic zaprla, ker
  # org.freedesktop.Flatpak (spodaj) ze dovoli zagon programov na gostitelju.
  - --filesystem=home
  # Povezave mailto:, magnet: ... odpre program racunalnika (core/os_odpri_z.py bere zaganjalnike pod /run/host/usr,
  # Flatpak in Snap programe), rezervni brskalnik z Widevine (core/drm.py) tudi med Flatpak programi.
  - --filesystem=host-os:ro
  - --filesystem=/var/lib/flatpak:ro
  - --filesystem=/var/lib/snapd/desktop:ro
  # flatpak-spawn --host: Safeer DRM (core/safeer_drm.py, Chromium s peskovnikom na gostitelju), program za povezavo
  # (gio open) in ovoji orodij v /app/host-bin.
  - --talk-name=org.freedesktop.Flatpak
  - --env=GTK_USE_PORTAL=1
modules:
  # Nas WebKitGTK s popravki, API 6.0 za GTK4 - ista datoteka modula kot v io.github.memelandfaner.SafeerOS.yml.
  # Prvi modul zaradi predpomnilnika flatpak-builderja (ID programa je v kljucu predpomnilnika, zato ima brskalnik
  # v CI svoj predpomnilnik, glej .github/workflows/linux-packages.yml).
  - packaging/webkit/webkitgtk6-safeer.yml
  - packaging/webkit/webkitgtk6-safeer-typelib.yml
  # libsoup 3.8.0 (varnostni popravki, runtime 50 ima 3.6.6) - za WebKitom, da njegov predpomnilnik ostane.
  - packaging/libsoup/libsoup3-safeer.yml
  - name: safeer-browser
    buildsystem: simple
    build-commands:
      - bash packaging/install_payload.sh /app io.github.memelandfaner.SafeerBrowser
      - bash packaging/flatpak_host_wrappers.sh /app/host-bin
      # Ovoja safeer in safeer-browser sta za Safeer OS (zagon brskalnika na gostitelju); v brskalniku bi ime
      # zaganjalnika zaradi PATH=/app/host-bin pokazalo na gostitelja.
      - rm -f /app/host-bin/safeer /app/host-bin/safeer-browser
    sources:
      - type: dir
        path: .
        skip:
          - .git
          - build
          - dist
          - .flatpak-builder
