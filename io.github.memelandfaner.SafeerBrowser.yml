app-id: io.github.memelandfaner.SafeerBrowser
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
# Clang/LLVM 22 za nas WebKitGTK (packaging/webkit/webkitgtk6-safeer.yml): LTO in PGO WebKit podpira samo s Clangom.
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm22
command: safeer
# Safeer Browser na GTK4 (safeer_brskalnik.py) z nasim WebKitGTK 6.0 - isti modul kot Safeer OS (packaging/webkit).
finish-args:
  # Od 1.0.127 (lastnik, 15. 10. 2026) brez izhoda iz peskovnika: brez org.freedesktop.Flatpak (flatpak-spawn --host),
  # brez celega doma in brez host-os. Datoteke in povezave drugim programom preda portal (Gtk.FileLauncher /
  # Gtk.UriLauncher -> OpenURI), Safeer DRM tece v tem peskovniku prek zypaka (spodaj), privzeti brskalnik se nastavi v
  # nastavitvah namizja (navodila). tests/test_peskovnik_brskalnika.py pade, ce se kaj od tega vrne.
  - --socket=wayland
  # X11 (Cinnamon): tudi za vstavitev okna Safeer DRM v zavihek (XReparentWindow, core/safeer_drm.py).
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --share=network
  - --socket=pulseaudio
  # Prenosi gredo v mapo XDG za prenose (na slovenskem namizju »Prejemi«, core/splet_prenosi.py); drugam (»Shrani
  # kot«) prek portala za izbiro datoteke.
  - --filesystem=xdg-download
  # Iste nastavitve, prijave, piskotki, zaznamki in zgodovina kot paket .deb (core/config.py, SAFEER_MINT_CONFIG_DIR
  # iz safeer_brskalnik.py); zaganjalnik .deb zazene ta Flatpak, ce je namescen. Samo ta mapa v ~/.config.
  - --filesystem=xdg-config/safeer-mint:create
  # Samo branje: ali je Safeer privzeti brskalnik (core/default_browser.privzeti_v_flatpaku).
  - --filesystem=xdg-config/mimeapps.list:ro
  # Brez dostopa do profilov drugih brskalnikov (pregled 18. 10. 2026: stalno branje cele mape profila je dajalo tudi
  # nesifrirane piskotke Firefoxa, cookies.sqlite). »Uvozi« odpre izbirnik mape (portal) v mapi izbranega brskalnika;
  # dostop je samo do mape, ki jo uporabnik potrdi, iz nje pa beremo samo zaznamke in odprte zavihke
  # (core/os_splet._uvozi_prek_portala, core/bookmarks_importer.uvozi_iz_mape).
  - --env=GTK_USE_PORTAL=1
modules:
  # Nas WebKitGTK s popravki, API 6.0 za GTK4 - ista datoteka modula kot v io.github.memelandfaner.SafeerOS.yml.
  # Prvi modul zaradi predpomnilnika flatpak-builderja (ID programa je v kljucu predpomnilnika, zato ima brskalnik
  # v CI svoj predpomnilnik, glej .github/workflows/linux-packages.yml).
  - packaging/webkit/webkitgtk6-safeer.yml
  - packaging/webkit/webkitgtk6-safeer-typelib.yml
  # libsoup 3.8.0 (varnostni popravki, runtime 50 ima 3.6.6) - za WebKitom, da njegov predpomnilnik ostane.
  - packaging/libsoup/libsoup3-safeer.yml
  # zypak (kot org.electronjs.Electron2.BaseApp//25.08, ista oznaka in commit): Safeer DRM (castLabs Electron) tece v
  # tem peskovniku, peskovnik Chromiuma pa prek portala Flatpak (flatpak-spawn --sandbox). Modul namesto osnove
  # BaseApp: osnova bi spremenila kljuc predpomnilnika vseh modulov in WebKit bi se gradil znova (2-3 h).
  - name: zypak
    sources:
      - type: git
        url: https://github.com/refi64/zypak
        tag: v2025.09
        commit: 693a71c5ffa80ec9c9ce2ae03b1ccc493c698e53
      # ZYPAK_EXPOSE_PATHS: mapo zunaj /app izpostavi podpeskovnikom samo za branje. Safeer DRM je od 1.0.127 v /app
      # (podpeskovniki ga vidijo brez tega), popravek ostane za vrnitev v zypak.
      - type: patch
        path: packaging/zypak/zypak-expose-paths.patch
  - name: safeer-browser
    buildsystem: simple
    build-commands:
      - python3 packaging/safeer_drm_paket.py pripravi build/safeer-drm --zip SafeerDRM-0.2.0-linux-x64.zip
      - SAFEER_DRM_TOVOR=build/safeer-drm bash packaging/install_payload.sh /app io.github.memelandfaner.SafeerBrowser
    sources:
      - type: dir
        path: .
        skip:
          - .git
          - build
          - dist
          - .flatpak-builder
          - safeer-drm
      # Safeer DRM v paketu (lastnik, 18. 10. 2026; packaging/safeer-drm.json): pripet castLabs ECS, flatpak-builder ga
      # prenese in preveri SHA-256 pred gradnjo. Widevine CDM ni v paketu: ECS ga ob prvi zasciteni vsebini sam namesti
      # z Googlovih streznikov v ~/.var/app/<ID>/config/Safeer DRM/WidevineCdm (Safeer OS: na gostitelju).
      - type: file
        url: https://github.com/safeerOS/Safeer-linux/releases/download/safeer-drm-v0.2.0/SafeerDRM-0.2.0-linux-x64.zip
        sha256: 018cdfc0d1b4061fa9b7972ce5588be39d70d42ea47a2494a698f6b601737396
        dest-filename: SafeerDRM-0.2.0-linux-x64.zip
