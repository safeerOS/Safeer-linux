# WebKitGTK 2.54.2 (API 4.1, GTK 3).
# Brez lastnih popravkov izvora (25. 10. 2026): oba nasa popravka sta v 2.54.2 gorvodno, zato ju ne uporabimo vec
# (datoteki ostaneta v mapi za zgodovino in meritve; patch -p1 --forward na 2.54.2 ju zavrne kot ze uporabljena):
#  - skia-backdrop-2n.patch (plasti backdrop-filter v kompozitorju Skia: izhodno obmocje filtra pred izrisom podrevesa,
#    filtrirano ozadje se v okvirju ponovno uporabi) je v 2.54.2 vrstica za vrstico enak (patch -R --dry-run na izvoru
#    2.54.2 uspe, zamik -1 vrstica; NEWS 2.54.2: "Fix performance when compositing layers with backdrop filters"),
#  - gst-mse-suspend.patch (cevovod MediaSource ne gre v PAUSED pred nastavitvijo vira; RTV 365 je obvisel v
#    "buffering") ima v 2.54.2 enak pogoj actualState <= targetState v MediaPlayerPrivateGStreamer::managePlayerSuspend.
# Modul ostane: Safeer vedno uporablja svoj WebKit (lastnik, 21. 10. 2026) z utrjeno gradnjo.
# Knjiznica nadomesti tisto iz runtime-a: /app/lib je v iskalni poti pred /usr/lib, WebKitWebProcess se zazene
# iz /app/libexec. Modul je prvi v manifestu, da ga flatpak-builder vzame iz predpomnilnika, ko se spremeni le koda Safeerja.
name: webkit2gtk-safeer
buildsystem: cmake-ninja
builddir: true
# Brez razhroscevalnih podatkov: GCC iz org.gnome.Sdk//50 z -g pri ScrollAnimationMomentum.cpp pade z notranjo napako
# (internal compiler error: in expand_debug_locations, CI 13. 10. 2026, oba teka). Lastna gradnja brez -g na testnem PC
# je uspela. Pospesi tudi gradnjo in izlocanje debuginfo (WebKit je velik).
no-debuginfo: true
build-options:
  # Utrjena gradnja (lastnik, 21. 10. 2026; AGENTS.md): cflags-override odstrani tudi zascite SDK, zato jih navedemo
  # sami - vsaj kot paket distribucije (izmerjeno: Ubuntujev libwebkitgtk ima BIND_NOW, _FORTIFY, CET; nas jih ni imel).
  cflags: -O2 -fstack-protector-strong -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=3 -fstack-clash-protection -fcf-protection=full
  cflags-override: true
  cxxflags: -O2 -fstack-protector-strong -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=3 -fstack-clash-protection -fcf-protection=full
  cxxflags-override: true
  ldflags: -Wl,-z,relro,-z,now
config-opts:
  - -DPORT=GTK
  - -DCMAKE_BUILD_TYPE=Release
  - -DCMAKE_INSTALL_LIBDIR=lib
  - -DUSE_GTK4=OFF
  - -DENABLE_SPEECH_SYNTHESIS=OFF
  - -DENABLE_WEBDRIVER=ON
  - -DUSE_LIBBACKTRACE=OFF
  - -DUSE_SYSTEM_UNIFDEF=OFF
  - -DENABLE_DOCUMENTATION=OFF
  - -DENABLE_MINIBROWSER=OFF
  - -DENABLE_API_TESTS=OFF
  - -DENABLE_LAYOUT_TESTS=OFF
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/gir-1.0
sources:
  - type: archive
    url: https://webkitgtk.org/releases/webkitgtk-2.54.2.tar.xz
    sha256: a76345b391bef6211fb5ab6cfab2e86b285d18cda17cbb9ade595f1252b86065
