# WebKitGTK 2.54.1 (API 6.0, GTK 4) - za prehod Safeer OS na GTK4 (lastnik, 14. 10. 2026: en proces, GTK4 na X11
# prikaze stran z EGL brez kopije okvirja prek procesorja in Xorg). Isti popravki kot webkit2gtk-safeer.yml (GTK3).
# z nasima popravkoma za plasti backdrop-filter v kompozitorju Skia:
#  1) izhodno obmocje filtra se izracuna pred izrisom podrevesa (brez 2^n izrisov za locene plasti),
#  2) filtrirano ozadje plasti se v okvirju shrani in ponovno uporabi (prekrite plasti), piksli enaki kot brez tega.
# in s popravkom predvajanja (gst-mse-suspend.patch): utisan video, ki se nalaga izven vidnega polja, ne sme dvigniti
# cevovoda MediaSource v PAUSED pred nastavitvijo vira (RTV 365 je obvisel v "buffering" ze v nespremenjenem 2.54.1).
# Gorvodno: WebKit bugzilla (glej skia-backdrop-2n.patch). Ko bo popravek v izdaji WebKitGTK v runtime-u
# org.gnome.Platform, ta modul odstranimo.
# Knjiznica nadomesti tisto iz runtime-a: /app/lib je v iskalni poti pred /usr/lib, WebKitWebProcess se zazene
# iz /app/libexec. Modul je prvi v manifestu, da ga flatpak-builder vzame iz predpomnilnika, ko se spremeni le koda Safeerja.
name: webkitgtk6-safeer
buildsystem: cmake-ninja
builddir: true
# Brez razhroscevalnih podatkov: GCC iz org.gnome.Sdk//50 z -g pri ScrollAnimationMomentum.cpp pade z notranjo napako
# (internal compiler error: in expand_debug_locations, CI 13. 10. 2026, oba teka). Lastna gradnja brez -g na testnem PC
# je uspela. Pospesi tudi gradnjo in izlocanje debuginfo (WebKit je velik).
no-debuginfo: true
# Clang 22 iz razsiritve org.freedesktop.Sdk.Extension.llvm22 (veja 25.08 = osnova org.gnome.Sdk//50) namesto GCC:
# WebKitGTK od 2.53.1 podpira LTO in PGO samo s Clangom. Izmerjeno na testnem PC (i5-4590, 15. 10. 2026): Speedometer 3.1
# Safeer (GCC -O2) 8.2, Firefox 12.8. Razsiritev mora biti v sdk-extensions obeh manifestov (Safeer OS in brskalnik).
build-options:
  append-path: /usr/lib/sdk/llvm22/bin
  prepend-ld-library-path: /usr/lib/sdk/llvm22/lib
  # Utrjena gradnja (lastnik, 21. 10. 2026; AGENTS.md): cflags-override odstrani tudi zascite SDK, zato jih navedemo
  # sami - vsaj kot paket distribucije (izmerjeno: Ubuntujev libwebkitgtk ima BIND_NOW, _FORTIFY, CET; nas jih ni imel).
  cflags: -O2 -fstack-protector-strong -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=3 -fstack-clash-protection -fcf-protection=full
  cflags-override: true
  cxxflags: -O2 -fstack-protector-strong -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=3 -fstack-clash-protection -fcf-protection=full
  cxxflags-override: true
  ldflags: -Wl,-z,relro,-z,now
  env:
    CC: clang
    CXX: clang++
    # ThinLTO povezuje libjavascriptcoregtk in libwebkitgtk z vsemi jedri (lld --thinlto-jobs); dve hkratni povezavi
    # na runnerju (4 jedra, 16 GB) bi tekmovali za pomnilnik. WebKit privzeto dovoli 4 (Release).
    WEBKIT_NINJA_LINK_MAX: '1'
config-opts:
  - -DPORT=GTK
  - -DCMAKE_BUILD_TYPE=Release
  - -DCMAKE_INSTALL_LIBDIR=lib
  - -DUSE_GTK4=ON
  - -DENABLE_SPEECH_SYNTHESIS=OFF
  - -DENABLE_WEBDRIVER=OFF
  - -DUSE_LIBBACKTRACE=OFF
  - -DUSE_SYSTEM_UNIFDEF=OFF
  - -DENABLE_DOCUMENTATION=OFF
  - -DENABLE_MINIBROWSER=OFF
  - -DENABLE_API_TESTS=OFF
  - -DENABLE_LAYOUT_TESTS=OFF
  # ThinLTO (WebKitCompilerFlags.cmake: -flto=thin za prevod in povezavo, OptionsCommon.cmake: ld.lld). Arhivi z bitno
  # kodo LLVM potrebujejo llvm-ar/llvm-ranlib (GNU ar iz SDK nima vticnika LLVM za kazalo simbolov).
  - -DLTO_MODE=thin
  - -DCMAKE_AR=/usr/lib/sdk/llvm22/bin/llvm-ar
  - -DCMAKE_RANLIB=/usr/lib/sdk/llvm22/bin/llvm-ranlib
  - -DCMAKE_NM=/usr/lib/sdk/llvm22/bin/llvm-nm
# Zapis gradnje (prevajalnik, LTO, PGO) za preverbo v CI in na testnem PC: flatpak-builder knjiznicam odstrani .comment
# (strip --remove-section=.comment), zato prevajalnika iz knjiznice ni mogoce prebrati (CI 38677265636).
# Tece v mapi gradnje (_flatpak_build) s CMakeCache.txt in build.ninja.
post-install:
  - |
    d=/app/share/webkitgtk-safeer
    mkdir -p "$d"
    {
      clang --version | head -n 1
      grep -E '^(CMAKE_BUILD_TYPE|CMAKE_CXX_COMPILER|LTO_MODE|ENABLE_LLVM_PROFILE_GENERATION|USE_PGO_PROFILE):' CMakeCache.txt
      for z in -fuse-ld=lld -flto=thin -fprofile-generate -fprofile-use; do echo "build.ninja $z: $(grep -c -e "$z" build.ninja)"; done
    } > "$d/gradnja.txt"
    cat "$d/gradnja.txt"
cleanup:
  - /bin
  - /include
  - /lib/pkgconfig
  - /share/gir-1.0
sources:
  - type: archive
    url: https://webkitgtk.org/releases/webkitgtk-2.54.1.tar.xz
    sha256: ea0bbb02dbdbc596874a4e7ad35b66645b3e0a232bd0e4081de5ed92eb0a397d
  - type: patch
    path: skia-backdrop-2n.patch
  - type: patch
    path: gst-mse-suspend.patch
