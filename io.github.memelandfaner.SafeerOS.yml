app-id: io.github.memelandfaner.SafeerOS
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
# Clang/LLVM 22 za nas WebKitGTK (packaging/webkit/webkitgtk6-safeer.yml): LTO in PGO WebKit podpira samo s Clangom.
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm22
command: safeer-os
# Safeer OS is a shell over the desktop: it needs the session bus (Safeer Control's D-Bus name is
# used by the browser and by Safeer OS), the network (Safeer Link at home), sound, the home folder
# (Files) and the host's system tools through flatpak-spawn (see packaging/flatpak_host_wrappers.sh).
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --share=network
  - --socket=pulseaudio
  - --socket=session-bus
  - --filesystem=home
  # Programi, ikone in zaganjalniki racunalnika (Flatpak je glavna pot distribucije; core/gostitelj.py):
  # /usr racunalnika pod /run/host/usr (samo branje) ter Flatpak in Snap programi, namesceni za vse uporabnike.
  - --filesystem=host-os:ro
  - --filesystem=/var/lib/flatpak:ro
  - --filesystem=/var/lib/snapd/desktop:ro
  # Datoteke: USB kljuci in diski (Mint jih priklopi v /media/<uporabnik>), kot v upravitelju datotek.
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=/mnt
  - --filesystem=xdg-run/pipewire-0
  - --talk-name=org.freedesktop.Flatpak
  - --own-name=io.github.memelandfaner.SafeerControl
  - --own-name=io.github.memelandfaner.SafeerOS
  - --env=GTK_USE_PORTAL=1
modules:
  # Nas WebKitGTK s popravki (packaging/webkit), API 6.0 za GTK4; prvi modul zaradi predpomnilnika flatpak-builderja.
  - packaging/webkit/webkitgtk6-safeer.yml
  # Typelib WebKita na pot, kjer ga Flatpak isce (skupen modul s Safeer Browserjem).
  - packaging/webkit/webkitgtk6-safeer-typelib.yml
  # libsoup 3.8.0 (varnostni popravki, runtime 50 ima 3.6.6) - za WebKitom, da njegov predpomnilnik ostane.
  - packaging/libsoup/libsoup3-safeer.yml
  - name: python3-pyside6
    # Lupina Safeer OS v Qt Quick (QML) kot na Windows - ena koda namizja za obe platformi (lastnik, 14. 10. 2026).
    # Qt na Linuxu vrti zanko GLib, zato GTK4 okna (Splet, vsebine na WebKitGTK) tecejo v istem procesu (PoC na testnem
    # PC 14. 10.). Kolesi abi3 (PySide6 Essentials: QtCore, QtGui, QtQml, QtQuick ...), brez dodatkov.
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-deps --prefix=/app shiboken6-6.11.2-cp310-abi3-manylinux_2_34_x86_64.whl
      - pip3 install --no-index --no-deps --prefix=/app pyside6_essentials-6.11.2-cp310-abi3-manylinux_2_34_x86_64.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/a5/9a/f41bea4316d0c1bec4800842dcb4bd8fd3e29d6a79c496bc32e1aec42583/shiboken6-6.11.2-cp310-abi3-manylinux_2_34_x86_64.whl
        sha256: 7a7a0a72a9ed26c9bf77d42246b1c736486befb8f31aa2fb29957ea4cdd1c1c2
      - type: file
        url: https://files.pythonhosted.org/packages/0e/1a/84a84bbc75835ee88abdcb66eb875b8e1a21834af9b833bc1893f2c1bfaf/pyside6_essentials-6.11.2-cp310-abi3-manylinux_2_34_x86_64.whl
        sha256: aaf9f25f0f324874085fa5b26a610318db8a8e243cf85bb3e5400595191c7778
  - name: python3-qrcode
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-deps --prefix=/app qrcode-8.2-py3-none-any.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/dd/b8/d2d6d731733f51684bbf76bf34dab3b70a9148e8f2cef2bb544fccec681a/qrcode-8.2-py3-none-any.whl
        sha256: 16e64e0716c14960108e85d853062c9e8bba5ca8252c0b4d0231b9df4060ff4f
  - name: python3-zeroconf
    # Safeer Link najde naprave prek mDNS (brez tega ni QR kode in ne 6-mestne kode za prijavo). Kolo za Python 3.12 ali 3.13.
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-deps --prefix=/app ifaddr-0.2.0-py3-none-any.whl
      - pip3 install --no-index --no-deps --find-links . --prefix=/app zeroconf
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/9c/1f/19ebc343cc71a7ffa78f17018535adc5cbdd87afb31d7c34874680148b32/ifaddr-0.2.0-py3-none-any.whl
        sha256: 085e0305cfe6f16ab12d72e2024030f5d52674afad6911bb1eee207177b8a748
      - type: file
        url: https://files.pythonhosted.org/packages/59/ff/c7372507c7e25ad3499fe08d4678deb1ed41c57f78ff5df43bd2d4d98cfc/zeroconf-0.148.0-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl
        sha256: cc88fd01b5552ffb4d5bc551d027ac28a1852c03ceab754d02bd0d5f04c54e85
      - type: file
        url: https://files.pythonhosted.org/packages/e1/16/7f7c5cee5279afe2a6a8b9657de9a587ccb34168d7c99acc6d2b40b9d87e/zeroconf-0.148.0-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl
        sha256: dde01541e6a45c4d1b6e6d97b532ea241abc32c183745a74021b134d867388d8
  - name: python3-cryptography
    # Safeer Link: sifriranje sporocil in prenosov (ECDH, AES-GCM), potrdila TLS in podpisi virov groženj. Brez nje je
    # Flatpak deloval brez E2E (izmerjeno na testnem PC, 13. 10. 2026). Kolesa: cryptography abi3, cffi za 3.12/3.13.
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-deps --prefix=/app pycparser-3.0-py3-none-any.whl
      - pip3 install --no-index --no-deps --find-links . --prefix=/app cffi
      - pip3 install --no-index --no-deps --find-links . --prefix=/app cryptography
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/0c/c3/44f3fbbfa403ea2a7c779186dc20772604442dde72947e7d01069cbe98e3/pycparser-3.0-py3-none-any.whl
        sha256: b727414169a36b7d524c1c3e31839a521725078d7b2ff038656844266160a992
      - type: file
        url: https://files.pythonhosted.org/packages/95/95/86342356ff5953b3fb06f7ef7c5bee212d45e770abc7218d451b9148313c/cffi-2.1.1-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.whl
        sha256: a931079504ecc49efed7744c476a5c343a92fabf66dec2db95edb1b2fdc770e2
      - type: file
        url: https://files.pythonhosted.org/packages/b1/db/dceb9dd5b231e1da801793f8acc9f3c52a7e1afe40bb1aae37e02b0faad5/cffi-2.1.1-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.whl
        sha256: c1453022f490d2459a11819d83ad1d586e9ff65a12ac3e705ffebd46d3685dcf
      - type: file
        url: https://files.pythonhosted.org/packages/1a/f1/b474e930c4d910328780e3940da76f5aa5cbc48ce1fc14e44d239d9ea9db/cryptography-50.0.2-cp311-abi3-manylinux_2_28_x86_64.whl
        sha256: 4061c0079120205fb760c58acab6443e217307dcf05e3702cf970e0689972856
  - name: python3-pillow
    # Vrtenje slik brez oznake EXIF (PNG, WebP); JPEG z EXIF-om Control zavrti brez Pillow. Kolo za Python 3.12 ali 3.13 runtime-a.
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-deps --find-links . --prefix=/app pillow
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/f7/62/de5bdd77d935331f4f802edc11e4d82950f642caad6cb2f949837b8560e2/pillow-12.3.0-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
        sha256: 0847a763afefb695bc912d7c131e7e0632d4edc1d8698f58ddabec8e46b8b6d3
      - type: file
        url: https://files.pythonhosted.org/packages/84/21/a35af28dcc61f37ed850a2d64c65c701321dfbf25085e469d5559360cbbf/pillow-12.3.0-cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
        sha256: 78cb2c6865a35ab8ff8b75fd122f6033b92a62c82801110e48ddd6c936a45d91
  - name: poppler-pdftoppm
    # pdftoppm: slika prve strani PDF (slicica priponke v Sporocilih kot v Gmailu, predogled v Datotekah). Runtime GNOME
    # 50 nima popplerja (preverjeno v namescenem Flatpaku 0.4.84: brez pdftoppm in libpoppler). PDF se nikoli ne
    # razclenjuje v procesu Safeer OS - pdftoppm tece loceno s casovno mejo (core/os_datoteke.slika_prve_strani).
    # Brez ovojev (glib, cpp, Qt), omreznih in kriptografskih zaledij; v paketu ostane samo pdftoppm.
    # Staticna libpoppler v pdftoppm: z deljeno je bila knjiznica v paketu, a je nalagalnik ni nasel (CI 15. 10. 2026:
    # »libpoppler.so.165 => not found«, izhod 127; verjetno lib64 iz GNUInstallDirs). Zdaj en sam program brez nje.
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_SHARED_LIBS=OFF
      - -DENABLE_BOOST=OFF
      - -DENABLE_CPP=OFF
      - -DENABLE_GLIB=OFF
      - -DENABLE_GOBJECT_INTROSPECTION=OFF
      - -DENABLE_QT5=OFF
      - -DENABLE_QT6=OFF
      - -DENABLE_LIBCURL=OFF
      - -DENABLE_NSS3=OFF
      - -DENABLE_GPGME=OFF
      - -DENABLE_LIBTIFF=OFF
      - -DENABLE_HARFBUZZ=OFF
      - -DBUILD_MANUAL_TESTS=OFF
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/cmake
      - /lib/libpoppler.a
      - /share/man
      - /bin/pdfattach
      - /bin/pdfdetach
      - /bin/pdffonts
      - /bin/pdfimages
      - /bin/pdfinfo
      - /bin/pdfseparate
      - /bin/pdfsig
      - /bin/pdftocairo
      - /bin/pdftohtml
      - /bin/pdftops
      - /bin/pdftotext
      - /bin/pdfunite
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-26.10.0.tar.xz
        sha256: 6792cb7c69205007ad87d2e936cecc5b3a31fac29ab54ffc3175fdb6b2a6ce35
  # libwnck in XApp (oboje samo GTK3) nista vec potrebna: seznam oken je EWMH (core/os_okna.py, core/x11.py), ikoni
  # v pultu sta StatusNotifierItem (core/pladenj_sni.py) in QSystemTrayIcon (core/os_lupina.py) - prehod na GTK4.
  - name: safeer-os
    buildsystem: simple
    build-commands:
      - python3 packaging/safeer_drm_paket.py pripravi build/safeer-drm --zip SafeerDRM-0.2.0-linux-x64.zip
      - bash packaging/install_control_payload.sh /app
      - SAFEER_DRM_TOVOR=build/safeer-drm bash packaging/install_os_payload.sh /app io.github.memelandfaner.SafeerOS
      # Nas rqbit (packaging/rqbit, posel CI rqbit-deb) v /app/lib/safeer-os/rqbit: preverjen zapis gradnje (pripet vir in
      # popravek), SHA-256, staticnost in razlicica. Artefakt CI pravic ne ohrani, zato chmod pred preverbo.
      - chmod 755 rqbit-tovor/rqbit
      - python3 packaging/rqbit/rqbit_paket.py namesti rqbit-tovor /app safeer-os
      - bash packaging/flatpak_host_wrappers.sh /app/host-bin
      - rm -f /app/share/applications/safeer-control.desktop
    sources:
      - type: dir
        path: .
        skip:
          - .git
          - build
          - dist
          - .flatpak-builder
          - safeer-drm
      # Nas rqbit (motor torrentov) iz posla CI rqbit-deb ali lokalno `python3 packaging/rqbit/rqbit_paket.py zgradi
      # build/rqbit`: uradni rqbit se na jedru brez IPv6 ne zazene (lastnik, 18. 10. 2026: nas popravek v vse pakete).
      - type: dir
        path: build/rqbit
        dest: rqbit-tovor
      # Safeer DRM v paketu (lastnik, 18. 10. 2026; packaging/safeer-drm.json): pripet castLabs ECS, flatpak-builder ga
      # prenese in preveri SHA-256 pred gradnjo. Widevine CDM ni v paketu: ECS ga ob prvi zasciteni vsebini sam namesti
      # z Googlovih streznikov v ~/.var/app/<ID>/config/Safeer DRM/WidevineCdm (Safeer OS: na gostitelju).
      - type: file
        url: https://github.com/safeerOS/Safeer-linux/releases/download/safeer-drm-v0.2.0/SafeerDRM-0.2.0-linux-x64.zip
        sha256: 018cdfc0d1b4061fa9b7972ce5588be39d70d42ea47a2494a698f6b601737396
        dest-filename: SafeerDRM-0.2.0-linux-x64.zip
