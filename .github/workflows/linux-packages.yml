            PAKET="$(ls "$PWD"/dist/Safeer-OS-*.flatpak)" bash tools/scit_lab/lab.sh preizkus
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: dist/*.flatpak
