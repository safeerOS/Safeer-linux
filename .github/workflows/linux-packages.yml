        # Kot pri AppImage: paket se ne sme samo zgraditi, v njem morata res teci Safeer OS in Control
        # (Safeer OS brez Controla nima Safeer Linka). Namestimo prav datoteko, ki gre v izdajo.
        run: |
          # Ob napaki ukaz in zadnji izpis kot opozorilo posla (dnevniki posla v API niso vedno dosegljivi).
          exec > >(tee "$RUNNER_TEMP/smoke.log") 2>&1
          trap 'sleep 1; python3 -c "import sys; t = open(sys.argv[1], errors=\"replace\").read()[-6000:]; print(\"::error::\" + (sys.argv[2] + \"\\n\" + t).replace(\"%\", \"%25\").replace(\"\\r\", \"\").replace(\"\\n\", \"%0A\"))" "$RUNNER_TEMP/smoke.log" "$BASH_COMMAND"' ERR
