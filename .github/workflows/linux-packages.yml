name: Linux packages
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  # No `release: published` trigger. Publishing a draft used to start this workflow again: it rebuilt
  # every package and replaced the files of the release that had just been published. Builds are not
  # bit-for-bit reproducible, so users got files other than the ones that were tested, and the checksums
  # in the update manifest on safeer.si no longer matched the AppImages (found 4 Oct 2026, v1.0.90).
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deb-appimage:
    # Release AppImages must be built against glibc 2.35 (Ubuntu 22.04) so they still run on
    # Linux Mint 21 / Ubuntu 22.04. GitHub retires the ubuntu-22.04 runner image (deprecation
    # from 2026-09-17, removal 2027-04-17), so the job runs on a current runner inside an
    # Ubuntu 22.04 container instead. The container is privileged so WebKit's bubblewrap
    # sandbox can start (the launch smoke tests verify that the sandbox stays enabled).
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:22.04
      options: --privileged
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: UTC
    steps:
      - name: Install build and test dependencies
        run: |
          apt-get update
          apt-get install -y ca-certificates curl git sudo python3-cryptography python3-qrcode python3-zeroconf python3-ifaddr python3-pytest python3-gi python3-gi-cairo python3-pil gir1.2-gtk-3.0 gir1.2-webkit2-4.1 gir1.2-soup-3.0 desktop-file-utils appstream dpkg-dev libgstreamer1.0-0 gstreamer1.0-plugins-good gstreamer1.0-plugins-bad glib-networking xvfb bubblewrap file libglib2.0-bin libglib2.0-dev-bin binutils patchelf
          [ "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.35' ]
      - uses: actions/checkout@v5
      # The YouTube tests run the page script under Node; the plain ubuntu:22.04 image ships none.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify version consistency
        run: python3 packaging/check_version.py
      - name: Unit tests
        run: xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Stability regression
        run: xvfb-run -a /usr/bin/python3 tests/stability_runtime.py
      - name: Debian package and launch smoke
        run: |
          bash build_deb.sh
          xvfb-run -a /usr/bin/python3 packaging/smoke.py build/stage/usr/lib/safeer-browser
      - name: Install, launch and remove the Debian package
        run: |
          sudo apt-get install -y "./safeer-browser_$(cat packaging/VERSION)_all.deb"
          xvfb-run -a safeer --version | tee /dev/stderr | grep -Fx "Safeer Browser $(cat packaging/VERSION)"
          desktop-file-validate /usr/share/applications/safeer-browser.desktop
          sudo apt-get remove -y safeer-browser
      - name: Safeer OS package (one package - Safeer OS, Safeer Control and Safeer Cinnamon)
        # Od 12. 10. 2026 je za Linux en sam paket .deb: ena namestitev (tudi z dvoklikom v GDebi), ena posodobitev.
        # mint-themes je le priporocilo, zato se paket tu namesti tudi na Ubuntu 22.04 brez priporocenih paketov.
        run: |
          bash build_os_deb.sh
          OS="./safeer-os_$(cat packaging/VERSION_OS)_all.deb"
          dpkg-deb -f "$OS" Package Version Depends Recommends Provides Replaces
          dpkg-deb -f "$OS" Provides | grep -F "safeer-control (= $(cat packaging/VERSION_CONTROL))"
          dpkg-deb -f "$OS" Provides | grep -F "safeer-cinnamon (= $(cat packaging/VERSION_CINNAMON))"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "$OS"
          xvfb-run -a safeer-os --version | tee /dev/stderr | grep -Fx "Safeer OS $(cat packaging/VERSION_OS)"
          xvfb-run -a safeer-control --version | tee /dev/stderr | grep -Fx "Safeer Control $(cat packaging/VERSION_CONTROL)"
          # Safeer Link najde naprave prek mDNS: brez zeroconf ni prijave (ne QR ne 6-mestne kode).
          /usr/bin/python3 -c "import zeroconf"
          # safeerctl (Safeer Link from the command line) ships in the same package.
          safeerctl --version | tee /dev/stderr | grep -Fx "safeerctl $(cat packaging/VERSION_CONTROL)"
          bash -n /usr/bin/safeer-cinnamon
          # Okno z izbiro postavitve (GTK 3) se prevede.
          python3 -m py_compile /usr/lib/safeer-cinnamon/izbira
          test -f /usr/share/themes/Safeer-Cinnamon/cinnamon/cinnamon.css
          test -f /usr/share/themes/Safeer-Cinnamon-Kontrast/gtk-3.0/gtk.css
          test -f /usr/share/doc/safeer-cinnamon/copyright
          for d in safeer-os safeer-os.Magnet safeer-os.Stremio safeer-os.Player safeer-control safeer-cinnamon \
                   safeer-cinnamon-izklopi safeer-cinnamon-od-vklopa safeer-cinnamon-od-vklopa-izklopi; do
            desktop-file-validate "/usr/share/applications/$d.desktop"
          done
          test -f /usr/share/icons/hicolor/scalable/apps/safeer-os.Player.svg
          sudo apt-get remove -y safeer-os
          for ostanek in /usr/lib/safeer-os /usr/lib/safeer-control /usr/lib/safeer-cinnamon /usr/bin/safeer-control /usr/bin/safeer-cinnamon; do
            [ ! -e "$ostanek" ] || { echo "po odstranitvi je ostalo $ostanek"; exit 1; }
          done
      - name: AppImage
        run: |
          bash packaging/fetch_linuxdeploy.sh
          LINUXDEPLOY="$PWD/build/tools/linuxdeploy.AppImage" bash packaging/build_appimage.sh
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a python3 packaging/test_appimage.py dist/Safeer-Browser-*.AppImage
      - name: Safeer OS AppImage (Safeer OS + Safeer Control)
        run: |
          LINUXDEPLOY="$PWD/build/tools/linuxdeploy.AppImage" bash packaging/build_os_appimage.sh
          chmod +x dist/Safeer-OS-*.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a dist/Safeer-OS-*.AppImage --version | tee /dev/stderr | grep -Fx "Safeer OS $(cat packaging/VERSION_OS)"
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a dist/Safeer-OS-*.AppImage --control --version | tee /dev/stderr | grep -Fx "Safeer Control $(cat packaging/VERSION_CONTROL)"
          APPIMAGE_EXTRACT_AND_RUN=1 dist/Safeer-OS-*.AppImage --ctl --version | tee /dev/stderr | grep -Fx "safeerctl $(cat packaging/VERSION_CONTROL)"
          rm -rf build/os-appimage-x && mkdir -p build/os-appimage-x && (cd build/os-appimage-x && ../../dist/Safeer-OS-*.AppImage --appimage-extract >/dev/null)
          for modul in qrcode zeroconf ifaddr; do test -d "build/os-appimage-x/squashfs-root/usr/lib/python3/dist-packages/$modul"; done
      - uses: actions/upload-artifact@v7
        with:
          name: deb-appimage
          path: |
            *.deb
            dist/*.AppImage
  mint:
    # The packages are installed, started and removed on real Linux Mint - the way a user does it. The build job
    # installs them on Ubuntu 22.04, where the two look packages cannot be installed at all (mint-themes exists
    # only in Linux Mint) and dependencies are resolved by another repository than the user's. This job takes the
    # very files that go into the release (tools/mint_namestitev).
    needs: deb-appimage
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mint: ['22', '22.3']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: deb-appimage
          path: paketi
      - name: Unprivileged user namespaces as on Linux Mint
        # Linux Mint turns Ubuntu's restriction off (/etc/sysctl.d/20-apparmor-mint.conf). The container shares the
        # kernel of the runner, where the restriction may be on; the WebKit sandbox of a normal user needs them.
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Packages of the last published release (for the upgrade test)
        # An upgrade is the path of every existing user: Safeer OS installs it by itself. On a tag build the new
        # release is not published yet, so "latest" is the release that users have now.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prejsnji
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir prejsnji \
            || echo "No published release found: only a fresh installation is tested."
          ls -l prejsnji
      - name: Install, upgrade, start and remove all packages on Linux Mint ${{ matrix.mint }}
        run: bash tools/mint_namestitev/preizkus.sh "linuxmintd/mint${{ matrix.mint }}-amd64" paketi prejsnji
  flatpak:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space for the WebKitGTK build
        # Nas WebKitGTK (packaging/webkit) potrebuje okoli 10 GB za gradnjo; runner jih brez tega nima dovolj.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /
      - name: Restore flatpak-builder cache (WebKitGTK module)
        id: webkit-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .flatpak-builder/cache
            .flatpak-builder/downloads
          key: flatpak-os-webkit-${{ hashFiles('packaging/webkit/**', 'io.github.memelandfaner.SafeerOS.yml') }}
          restore-keys: |
            flatpak-os-webkit-
      - name: Install Flatpak toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream-compose desktop-file-utils
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.gnome.Platform//50 org.gnome.Sdk//50
      - run: python3 packaging/check_version.py
      - run: bash packaging/build_flatpak.sh
      - name: Safeer OS Flatpak (Safeer OS + Safeer Control)
        run: bash packaging/build_os_flatpak.sh
      - name: Save flatpak-builder cache (WebKitGTK module)
        # Takoj po gradnji (tudi ce kasnejsi preizkus pade), da se WebKitGTK ne gradi znova ob vsakem pushu.
        if: always() && steps.webkit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .flatpak-builder/cache
            .flatpak-builder/downloads
          key: flatpak-os-webkit-${{ hashFiles('packaging/webkit/**', 'io.github.memelandfaner.SafeerOS.yml') }}
      - name: Safeer OS Flatpak runs, with Safeer Control inside
        # Kot pri AppImage: paket se ne sme samo zgraditi, v njem morata res teci Safeer OS in Control
        # (Safeer OS brez Controla nima Safeer Linka). Namestimo prav datoteko, ki gre v izdajo.
        run: |
          sudo apt-get install -y xvfb dbus
          flatpak install --user --noninteractive --bundle dist/Safeer-OS-*.flatpak
          dbus-run-session -- xvfb-run -a flatpak run io.github.memelandfaner.SafeerOS --version | tee /dev/stderr | grep -Fx "Safeer OS $(cat packaging/VERSION_OS)"
          dbus-run-session -- xvfb-run -a flatpak run --command=safeer-control io.github.memelandfaner.SafeerOS --version | tee /dev/stderr | grep -Fx "Safeer Control $(cat packaging/VERSION_CONTROL)"
          dbus-run-session -- flatpak run --command=safeerctl io.github.memelandfaner.SafeerOS --version | tee /dev/stderr | grep -Fx "safeerctl $(cat packaging/VERSION_CONTROL)"
          # Safeer Link najde naprave prek mDNS: zeroconf (in qrcode za QR prijavo) morata biti v paketu.
          # Splet mora teci na nasem WebKitGTK (packaging/webkit), ne na tistem iz runtime-a.
          flatpak run --command=python3 io.github.memelandfaner.SafeerOS -c "import gi, os, glob; gi.require_version('WebKit2', '4.1'); from gi.repository import WebKit2; m = open('/proc/self/maps').read(); print('GI_TYPELIB_PATH=', os.environ.get('GI_TYPELIB_PATH'), 'typelib v /app:', glob.glob('/app/lib/girepository-1.0/WebKit2*')); print(sorted({l.split()[-1] for l in m.splitlines() if 'webkit2gtk' in l or 'javascriptcore' in l})); assert '/app/lib/libwebkit2gtk-4.1.so' in m and '/usr/lib/x86_64-linux-gnu/libwebkit2gtk-4.1.so' not in m, 'WebKitGTK ni iz /app'; print('WebKitGTK iz /app', WebKit2.get_major_version(), WebKit2.get_minor_version(), WebKit2.get_micro_version())"
          flatpak run --command=sh io.github.memelandfaner.SafeerOS -c "test -x /app/libexec/webkit2gtk-4.1/WebKitWebProcess"
          flatpak run --command=python3 io.github.memelandfaner.SafeerOS -c "import zeroconf, qrcode, cryptography; from cryptography.hazmat.primitives.ciphers.aead import AESGCM; AESGCM(AESGCM.generate_key(bit_length=256)); import gi; gi.require_version('Wnck', '3.0'); from gi.repository import Wnck; gi.require_version('XApp', '1.0'); from gi.repository import XApp; XApp.StatusIcon"
      - name: Shield inside the sandbox of the package that was just built
        # Scit v peskovniku Flatpak, s kodo samega paketa, na pravem systemd-resolved + NetworkManager (tools/scit_lab).
        run: |
          bash tools/scit_lab/lab.sh zgradi
          NACIN=flatpak FLATPAK_GOSTITELJA="$HOME/.local/share/flatpak" KODA_V_PESKOVNIKU=/app/lib/safeer-os \
            PAKET="$(ls "$PWD"/dist/Safeer-OS-*.flatpak)" bash tools/scit_lab/lab.sh preizkus
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: dist/*.flatpak
  scit-lab:
    # Scit spreminja sistemsko nastavitev DNS. Enotni testi ne vidijo, kako se systemd-resolved in NetworkManager
    # obnasata v resnici - in prav tam so bile napake do Safeer OS 0.4.42 (izklop je pustil racunalnik brez DNS).
    # Ta posel zato Scit pozene na pravih: dva vsebnika, »usmerjevalnik« in »racunalnik« (tools/scit_lab).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build the lab images
        run: bash tools/scit_lab/lab.sh zgradi
      - name: Shield against a real systemd-resolved and NetworkManager
        run: bash tools/scit_lab/lab.sh preizkus
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb-appimage, flatpak, scit-lab, mint]
    runs-on: ubuntu-24.04
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.flatpak' \) -exec mv -t release {} +
          (cd release && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          # A tag push gets a draft with the packages attached. A published release is final: its files
          # are the ones that were tested and whose checksums are in the update manifest, so a re-run of
          # this job (or any other trigger) must never replace them.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "Safeer Browser $TAG" --notes 'Linux packages. Complete the desktop acceptance checklist before publishing.'
          fi
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "Release $TAG is already published; its packages are not replaced."
            exit 0
          fi
          gh release upload "$TAG" release/* --clobber
