name: Linux packages
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  # No `release: published` trigger. Publishing a draft used to start this workflow again: it rebuilt
  # every package and replaced the files of the release that had just been published. Builds are not
  # bit-for-bit reproducible, so users got files other than the ones that were tested, and the checksums
  # in the update manifest on safeer.si no longer matched the AppImages (found 4 Oct 2026, v1.0.90).
  workflow_dispatch:
    inputs:
      pgo:
        # Flatpaka sta vedno z WebKitGTK s PGO (posli webkit-pgo-*); ucni tek tece sam, ko se kljuc profila spremeni.
        # Ta vhod ga sprozi tudi, ce profil za trenutni kljuc ze obstaja (npr. sum na slab profil).
        description: 'Nov ucni tek PGO, tudi ce profil s tem kljucem ze obstaja'
        type: boolean
        default: false
      pgo_profraw_run:
        # Profil iz dolocenega teka CI (artefakt webkit-pgo-profraw-<kljuc>, isti kljuc) namesto zadnjega s tem kljucem.
        # (prazno = zadnji veljaven profil s trenutnim kljucem ali nov ucni tek, ce ga ni)
        description: 'Id teka z artefaktom profila PGO (prazno = samodejno po kljucu)'
        type: string
        default: ''
permissions:
  contents: read
jobs:
  # ---- Nas WebKitGTK za pakete .deb (PGO je privzet, lastnik 15. 10. 2026) ---------------------------------------------
  # En paket safeer-webkit (/usr/lib/safeer-webkit) za safeer-os in safeer-browser (lastnik, 19. 10. 2026): prej je imel
  # vsak paket svojo kopijo in CI je WebKit s PGO in BOLT gradil dvakrat (matrika, ~2,5 h vsaka gradnja).
  # Loceni posli (webkit-deb-profil, webkit-deb), da se ne prepletajo s posli Flatpak. Profil Flatpaka tu ni uporaben:
  # LLVM zahteva profil iz istega izvora - gradnja noble ima druge sistemske glave (GTK 4.14, GLib 2.80, GStreamer 1.24
  # namesto GNOME 50) in druge poti izvora (imena staticnih funkcij v profilu vsebujejo pot datoteke). Zato lasten ucni tek
  # z isto pripeto kopijo Speedometra 3.1 in packaging/webkit/pgo_trening.py.
  webkit-deb-profil:
    # PGO 1/2: instrumentiran WebKitGTK (-DENABLE_LLVM_PROFILE_GENERATION=ON) za predpono /usr/lib/safeer-webkit, ucni
    # tek pod Xvfb, .profraw v predpomnilnik s kljucem iz datotek gradnje (ista predpona in mapa izvora kot gradnja s
    # profilom, build/webkit-deb/izvor). ~2,5 h ob spremembi.
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    container:
      image: ubuntu:24.04
      options: --privileged
      # Mape gostitelja, ki jih gradnja ne potrebuje: WebKit z ThinLTO potrebuje ~10 GB prostora.
      volumes:
        - /usr/share/dotnet:/gostitelj/dotnet
        - /usr/local/lib/android:/gostitelj/android
        - /opt/ghc:/gostitelj/ghc
        - /opt/hostedtoolcache/CodeQL:/gostitelj/codeql
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: UTC
    steps:
      - name: Free disk space and tools for the cache
        run: |
          rm -rf /gostitelj/dotnet/* /gostitelj/android/* /gostitelj/ghc/* /gostitelj/codeql/*
          df -h /
          apt-get update -q
          apt-get install -y -q --no-install-recommends ca-certificates zstd git
      - uses: actions/checkout@v5
      - name: Restore the PGO profile (recorded earlier from the same files)
        id: profil
        uses: actions/cache/restore@v4
        with:
          path: build/pgo/profraw
          key: webkit-deb-profil-${{ hashFiles('packaging/webkit/webkitgtk6-safeer.yml', 'packaging/webkit/*.patch', 'packaging/libsoup/**', 'packaging/webkit-deb/odvisnosti.sh', 'packaging/webkit-deb/zgradi.sh', 'packaging/webkit-deb/modul.py', 'packaging/webkit-deb/typelibi.py', 'packaging/webkit/pgo_trening.py', 'packaging/webkit-deb/ucni_tek.sh') }}
      - name: Build dependencies and the training run tools
        if: steps.profil.outputs.cache-hit != 'true'
        run: |
          bash packaging/webkit-deb/odvisnosti.sh
          apt-get install -y -q --no-install-recommends python3-gi gir1.2-gtk-4.0 xvfb xauth dbus procps
      - name: Instrumented WebKitGTK (Clang 22, ThinLTO, -fprofile-generate)
        if: steps.profil.outputs.cache-hit != 'true'
        run: SAFEER_WEBKIT_PGO=ucenje bash packaging/webkit-deb/zgradi.sh /usr/lib/safeer-webkit
      - name: Training run (Speedometer 3.1, pinned offline copy)
        if: steps.profil.outputs.cache-hit != 'true'
        run: bash packaging/webkit-deb/ucni_tek.sh /usr/lib/safeer-webkit build/pgo/profraw
      - name: Save the PGO profile
        if: steps.profil.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/pgo/profraw
          key: webkit-deb-profil-${{ hashFiles('packaging/webkit/webkitgtk6-safeer.yml', 'packaging/webkit/*.patch', 'packaging/libsoup/**', 'packaging/webkit-deb/odvisnosti.sh', 'packaging/webkit-deb/zgradi.sh', 'packaging/webkit-deb/modul.py', 'packaging/webkit-deb/typelibi.py', 'packaging/webkit/pgo_trening.py', 'packaging/webkit-deb/ucni_tek.sh') }}
      - name: Profile summary
        run: |
          ls -l build/pgo/profraw
          echo "::notice::profil .deb: $(ls build/pgo/profraw/*.profraw | wc -l) .profraw, $(du -sh build/pgo/profraw | cut -f1)"
      - uses: actions/upload-artifact@v7
        with:
          name: webkit-deb-profraw
          path: build/pgo/profraw/*.profraw
          retention-days: 14
  webkit-deb:
    # PGO 2/2: nas WebKitGTK 6.0 in libsoup 3.8 za pakete .deb (lastnik, 15. 10. 2026: .deb dobi vse izboljsave
    # Flatpaka): isti izvor, popravki in moznosti kot modula Flatpak (packaging/webkit-deb/modul.py), Clang 22 iz
    # apt.llvm.org, ThinLTO, lld, profil iz posla webkit-deb-profil in BOLT, na Ubuntu 24.04 (osnova Linux Mint 22).
    # ENA gradnja za predpono /usr/lib/safeer-webkit (~2,5 h; prej matrika safeer-browser/safeer-os, dvakrat) in iz nje
    # paket safeer-webkit (packaging/webkit-deb/paket.sh, z dekoderjem AV1 iz dav1d-deb), ki ga zahtevata safeer-os in
    # safeer-browser. Gotov arhiv je v predpomnilniku s kljucem iz datotek gradnje: ob spremembi samo kode Safeerja
    # posel traja nekaj minut (pakiranje).
    needs: [webkit-deb-profil, dav1d-deb]
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    container:
      image: ubuntu:24.04
      # Ucni tek BOLT pod Xvfb tece v enakem vsebniku kot ucni tek PGO (webkit-deb-profil).
      options: --privileged
      volumes:
        - /usr/share/dotnet:/gostitelj/dotnet
        - /usr/local/lib/android:/gostitelj/android
        - /opt/ghc:/gostitelj/ghc
        - /opt/hostedtoolcache/CodeQL:/gostitelj/codeql
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: UTC
    steps:
      - name: Free disk space and tools for the cache
        run: |
          rm -rf /gostitelj/dotnet/* /gostitelj/android/* /gostitelj/ghc/* /gostitelj/codeql/*
          df -h /
          apt-get update -q
          apt-get install -y -q --no-install-recommends ca-certificates zstd
      - uses: actions/checkout@v5
      - name: Restore our WebKitGTK (built earlier from the same files and profile)
        id: wk
        uses: actions/cache/restore@v4
        with:
          path: build/safeer-webkit.tar.zst
          key: webkit-deb-pgo-bolt-safeer-webkit-${{ hashFiles('packaging/webkit/webkitgtk6-safeer.yml', 'packaging/webkit/*.patch', 'packaging/libsoup/**', 'packaging/webkit-deb/odvisnosti.sh', 'packaging/webkit-deb/zgradi.sh', 'packaging/webkit-deb/modul.py', 'packaging/webkit-deb/typelibi.py', 'packaging/webkit/pgo_trening.py', 'packaging/webkit-deb/ucni_tek.sh', 'packaging/webkit-deb/bolt.sh', 'packaging/webkit-deb/bolt_trening.py', 'packaging/webkit-deb/nadaljuj.sh') }}
      - name: Restore our WebKitGTK before BOLT (resume after a failed BOLT, without the 2.5 h build)
        # Lastnik, 19. 10. 2026: gradnja nadaljuje tam, kjer je padla. bolt.sh shrani stanje pred BOLT (namescena
        # predpona s simboli in relokacijami); kljuc iz istih datotek kot profil PGO (brez datotek BOLT), zato popravek
        # BOLT (bolt.sh, bolt_trening.py) pomeni samo nadaljuj.sh, ne novega prevajanja.
        id: predbolt
        if: steps.wk.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: build/webkit-predbolt.tar.zst
          key: webkit-deb-predbolt-safeer-webkit-${{ hashFiles('packaging/webkit/webkitgtk6-safeer.yml', 'packaging/webkit/*.patch', 'packaging/libsoup/**', 'packaging/webkit-deb/odvisnosti.sh', 'packaging/webkit-deb/zgradi.sh', 'packaging/webkit-deb/modul.py', 'packaging/webkit-deb/typelibi.py', 'packaging/webkit/pgo_trening.py', 'packaging/webkit-deb/ucni_tek.sh') }}
      - uses: actions/download-artifact@v8
        if: steps.wk.outputs.cache-hit != 'true' && steps.predbolt.outputs.cache-hit != 'true'
        with:
          name: webkit-deb-profraw
          path: build/pgo/profraw
      - name: Build dependencies (Clang 22 and BOLT 22 from apt.llvm.org, noble libraries, BOLT training run tools)
        if: steps.wk.outputs.cache-hit != 'true'
        run: |
          bash packaging/webkit-deb/odvisnosti.sh
          apt-get install -y -q --no-install-recommends python3-gi gir1.2-gtk-4.0 xvfb xauth dbus procps git gdb
      - name: WebKitGTK and libsoup for /usr/lib/safeer-webkit (Clang 22, ThinLTO, PGO, BOLT)
        # BOLT (lastnik 18. 10. 2026: v izdaji): packaging/webkit-deb/bolt.sh po namestitvi; ce noben poskus ne uspe,
        # pade gradnja. Stanje pred BOLT je v build/webkit-predbolt.tar.zst (naslednji korak ga shrani tudi ob padcu);
        # ce je iz predpomnilnika, nadaljuj.sh naredi samo BOLT, zapis gradnje, strip in arhiv.
        if: steps.wk.outputs.cache-hit != 'true'
        run: |
          export SAFEER_BOLT_PREDBOLT="$PWD/build/webkit-predbolt.tar.zst"
          if [ -f "$SAFEER_BOLT_PREDBOLT" ]; then
            bash packaging/webkit-deb/nadaljuj.sh /usr/lib/safeer-webkit build/safeer-webkit.tar.zst
          else
            SAFEER_WEBKIT_PGO=uporaba SAFEER_WEBKIT_PROFRAW=build/pgo/profraw SAFEER_WEBKIT_BOLT=1 \
              bash packaging/webkit-deb/zgradi.sh /usr/lib/safeer-webkit build/safeer-webkit.tar.zst
          fi
      - name: Save the pre-BOLT state of our WebKitGTK (also when BOLT failed)
        if: always() && steps.wk.outputs.cache-hit != 'true' && steps.predbolt.outputs.cache-hit != 'true' && hashFiles('build/webkit-predbolt.tar.zst') != ''
        uses: actions/cache/save@v4
        with:
          path: build/webkit-predbolt.tar.zst
          key: webkit-deb-predbolt-safeer-webkit-${{ hashFiles('packaging/webkit/webkitgtk6-safeer.yml', 'packaging/webkit/*.patch', 'packaging/libsoup/**', 'packaging/webkit-deb/odvisnosti.sh', 'packaging/webkit-deb/zgradi.sh', 'packaging/webkit-deb/modul.py', 'packaging/webkit-deb/typelibi.py', 'packaging/webkit/pgo_trening.py', 'packaging/webkit-deb/ucni_tek.sh') }}
      - name: Archive is complete (zstd -t)
        # Tudi arhiv iz predpomnilnika; prirezan arhiv (poln disk, preklic) ne gre v predpomnilnik ne v paket.
        run: zstd -q -t build/safeer-webkit.tar.zst
      - name: Save our WebKitGTK
        # Samo po uspesni gradnji in preverbi arhiva (prej always(): prirezan arhiv bi ostal pod koncnim kljucem za vedno).
        if: success() && steps.wk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/safeer-webkit.tar.zst
          key: webkit-deb-pgo-bolt-safeer-webkit-${{ hashFiles('packaging/webkit/webkitgtk6-safeer.yml', 'packaging/webkit/*.patch', 'packaging/libsoup/**', 'packaging/webkit-deb/odvisnosti.sh', 'packaging/webkit-deb/zgradi.sh', 'packaging/webkit-deb/modul.py', 'packaging/webkit-deb/typelibi.py', 'packaging/webkit/pgo_trening.py', 'packaging/webkit-deb/ucni_tek.sh', 'packaging/webkit-deb/bolt.sh', 'packaging/webkit-deb/bolt_trening.py', 'packaging/webkit-deb/nadaljuj.sh') }}
      - name: Build record (Clang 22, ThinLTO, lld, PGO, BOLT)
        run: |
          tar -I zstd -xOf build/safeer-webkit.tar.zst usr/lib/safeer-webkit/share/webkitgtk-safeer/gradnja.txt | tee gradnja.txt
          echo "::notice::safeer-webkit: $(stat -c %s build/safeer-webkit.tar.zst) B | $(paste -sd '|' gradnja.txt)"
          grep -q 'clang version 22\.' gradnja.txt
          grep -q '^LTO_MODE:.*=thin$' gradnja.txt
          grep -q '^build.ninja -fuse-ld=lld: [1-9]' gradnja.txt
          grep -q '^USE_PGO_PROFILE:BOOL=ON$' gradnja.txt
          grep -q '^build.ninja -fprofile-use: [1-9]' gradnja.txt
          grep -q '^build.ninja --emit-relocs: [1-9]' gradnja.txt
          grep -q '^bolt: da (llvm-bolt 22\.' gradnja.txt
          grep -qx 'predpona: /usr/lib/safeer-webkit' gradnja.txt
      - uses: actions/download-artifact@v8
        with:
          name: dav1d-deb
          path: build/dav1d
      - name: Libraries of our WebKitGTK (dpkg-shlibdeps)
        run: bash packaging/webkit-deb/knjiznice.sh
      - name: Package safeer-webkit (shared by safeer-os and safeer-browser)
        run: |
          DEB="$(SAFEER_DAV1D=build/dav1d bash packaging/webkit-deb/paket.sh build/safeer-webkit.tar.zst .)"
          test "$DEB" = "./safeer-webkit_$(cat packaging/VERSION)_amd64.deb"
          dpkg-deb -f "$DEB" Package Version Architecture Depends Installed-Size
          dpkg-deb -f "$DEB" Version | grep -Fx "$(bash packaging/deb_razlicica.sh "$(cat packaging/VERSION)")"
          # Sistemskega WebKitGTK/libsoup paket ne zahteva; peskovnik potrebuje bwrap in xdg-dbus-proxy, libsoup TLS.
          if dpkg-deb -f "$DEB" Depends | grep -E 'gir1\.2-webkit-6\.0|gir1\.2-soup-3\.0|libwebkitgtk|libsoup-3\.0'; then echo "::error::paket zahteva sistemski WebKitGTK/libsoup"; exit 1; fi
          # Vsak pogoj v svoji vrstici: bash -e ne ustavi koraka ob napaki ukaza pred zadnjim && (pregled 18. 10. 2026).
          dpkg-deb -f "$DEB" Depends | grep -F 'bubblewrap'
          dpkg-deb -f "$DEB" Depends | grep -F 'xdg-dbus-proxy'
          dpkg-deb -f "$DEB" Depends | grep -F 'glib-networking'
          dpkg-deb -c "$DEB" | grep -F './usr/lib/safeer-webkit/libexec/webkitgtk-6.0/WebKitWebProcess'
          dpkg-deb -c "$DEB" | grep -F './usr/lib/safeer-webkit/lib/girepository-1.0/WebKit-6.0.typelib'
          dpkg-deb -c "$DEB" | grep -F './usr/share/doc/safeer-webkit/copyright'
          # Dekoder AV1 dav1ddec v predponi nasega WebKita, libdav1d7 iz noble.
          dpkg-deb -c "$DEB" | grep -F './usr/lib/safeer-webkit/lib/gstreamer-1.0/libgstdav1d.so'
          dpkg-deb -f "$DEB" Depends | grep -E '(^|, )libdav1d7( |,|$)'
          # Prenosnost (21. 10. 2026: .deb se ni namestil na Linux Mint 23 / Ubuntu 26.04 / Debian 13): knjiznice z
          # razlicnim soname po sistemih so v paketu (vgradi.sh), Depends jih ne sme zahtevati.
          if dpkg-deb -f "$DEB" Depends | grep -E '(^|, )(libicu[0-9]+|libjxl0\.[0-9]+|libhwy[0-9a-z]*|libjpeg8|libxml2|libxslt1\.1)( |,|$)'; then echo "::error::Depends zahteva knjiznico, ki mora biti v paketu"; exit 1; fi
          for so in libicuuc.so.74 libicudata.so.74 libjxl.so.0.7 libjpeg.so.8 libxml2.so.2 libxslt.so.1; do dpkg-deb -c "$DEB" | grep -F "./usr/lib/safeer-webkit/lib/$so"; done
          # Samo /usr/lib/safeer-webkit in doc: nic v sistemskih mapah knjiznic in brez skript vzdrzevalca.
          if dpkg-deb -c "$DEB" | awk '{print $6}' | grep -vE '^\./($|usr/$|usr/lib/$|usr/lib/safeer-webkit/|usr/share/$|usr/share/doc/$|usr/share/doc/safeer-webkit/)'; then echo "::error::datoteke izven /usr/lib/safeer-webkit"; exit 1; fi
          if dpkg-deb --ctrl-tarfile "$DEB" | tar -t | grep -E 'postinst|prerm|postrm|preinst'; then echo "::error::skripte vzdrzevalca"; exit 1; fi
          echo "::notice::$(stat -c '%n %s B' "$DEB") | namesceno $(dpkg-deb -f "$DEB" Installed-Size) KiB"
      - uses: actions/upload-artifact@v7
        with:
          name: safeer-webkit
          path: safeer-webkit_*_amd64.deb
          retention-days: 14
  dav1d-deb:
    # Dekoder AV1 dav1ddec (gst-plugins-rs, packaging/webkit-deb/dav1d.sh) v paket safeer-webkit, zraven nasega WebKitGTK:
    # noble ima libdav1d7, nima pa vticnika GStreamer zanj (ostane le pocasni libaom av1dec). Lastnik, 18. 10. 2026:
    # YouTube AV1 720p z dav1ddec 0 izpuscenih slicic, ~12 % manj CPU. Gradnja na runnerju ubuntu-24.04 (noble, isti
    # GStreamer 1.24 kot Linux Mint 22) z rustup runnerja (cargo iz apt noble je prestar); ~1 min, nato iz predpomnilnika.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Restore dav1ddec (built earlier from the same script)
        id: dav1d
        uses: actions/cache/restore@v4
        with:
          path: build/dav1d
          key: dav1d-deb-${{ hashFiles('packaging/webkit-deb/dav1d.sh') }}
      - name: Build gst-plugin-dav1d against the noble GStreamer
        if: steps.dav1d.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libdav1d-dev pkg-config
          bash packaging/webkit-deb/dav1d.sh build/dav1d
      - name: Save dav1ddec
        if: steps.dav1d.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/dav1d
          key: dav1d-deb-${{ hashFiles('packaging/webkit-deb/dav1d.sh') }}
      - name: Build record
        run: |
          ls -l build/dav1d
          cat build/dav1d/gradnja.txt
          echo "::notice::dav1ddec: $(paste -sd '|' build/dav1d/gradnja.txt)"
          grep -q '^gst-plugin-dav1d 0\.14\.5 ' build/dav1d/gradnja.txt
      - uses: actions/upload-artifact@v7
        with:
          name: dav1d-deb
          path: build/dav1d/
          retention-days: 14
  rqbit-deb:
    # Nas rqbit (motor torrentov, core/os_torrent.py) za paket .deb Safeer OS: uradni vir v9.0.1, pripet z commitom in
    # SHA-256 drevesa (packaging/rqbit/rqbit.json), z nasim popravkom packaging/rqbit/*.patch. Uradni program se na jedru
    # brez IPv6 (ipv6.disable=1) ne zazene: odjemalec sledilnikov UDP veze [::]:0 tudi z --ipv4-only (lastnik, 18. 10.
    # 2026: popravek takoj v nas paket in predlog gorvodno). Staticno (musl) kot uradne izdaje; gradnja samo ob novem
    # viru ali popravku (kljuc), preizkus brez IPv6 ob vsakem teku.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Tools (musl for the build, seccomp for the test without IPv6)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends musl-tools python3-seccomp
      - name: Restore rqbit (built earlier from the same source and patches)
        id: rqbit
        uses: actions/cache/restore@v4
        with:
          path: build/rqbit
          key: rqbit-deb-${{ hashFiles('packaging/rqbit/**') }}
      - name: Build rqbit from the pinned source with our patches
        if: steps.rqbit.outputs.cache-hit != 'true'
        run: python3 packaging/rqbit/rqbit_paket.py zgradi build/rqbit
      - name: Save rqbit
        if: success() && steps.rqbit.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/rqbit
          key: rqbit-deb-${{ hashFiles('packaging/rqbit/**') }}
      - name: Check the build and download a torrent without IPv6
        # Runner ima IPv6: seccomp (--brez-ipv6) da socket(AF_INET6) napako EAFNOSUPPORT kot jedro z ipv6.disable=1.
        # Lokalni sledilnik UDP, seme in prenos z motorjem Safeer (core/os_torrent.py), tok z Range - brez interneta.
        run: |
          /usr/bin/python3 packaging/rqbit/rqbit_paket.py preveri build/rqbit
          /usr/bin/python3 packaging/rqbit/rqbit_paket.py dim build/rqbit/rqbit --brez-ipv6 > "$RUNNER_TEMP/dim.json"
          cat "$RUNNER_TEMP/dim.json"
          echo "::notice::rqbit brez IPv6: $(python3 -c 'import json, sys; d = json.load(open(sys.argv[1])); print("zagon %ss, prenos %s B v %ss, najave %s" % (d["zagon_s"], d["bajtov"], d["prenos_s"], len(d["najave"])))' "$RUNNER_TEMP/dim.json")"
      - uses: actions/upload-artifact@v7
        with:
          name: rqbit-deb
          path: build/rqbit/
          retention-days: 14
  brskalnik:
    # Safeer Browser na GTK4 (safeer_brskalnik.py) in WebKitGTK 6.0: .deb in AppImage za Linux Mint 22 / Ubuntu 24.04
    # naprej (kot Safeer OS). Paket .deb (amd64) tece na nasem WebKitGTK in libsoup iz paketa safeer-webkit (posel
    # webkit-deb, /usr/lib/safeer-webkit); AppImage se nosi WebKitGTK sistema gradnje (Ubuntu).
    needs: webkit-deb
    # Preizkus brskalnika (packaging/smoke_brskalnik.py): stran, prenos, nastavitve in vstavitev Safeer DRM v okno.
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
      options: --privileged
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: UTC
    steps:
      - name: Install build and test dependencies
        run: |
          apt-get update
          apt-get install -y ca-certificates curl git sudo dbus python3-cryptography python3-pytest python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-webkit-6.0 gir1.2-soup-3.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-gl desktop-file-utils appstream dpkg-dev glib-networking xvfb x11-utils bubblewrap file libglib2.0-bin libglib2.0-dev-bin binutils patchelf libx11-6 zstd
          [ "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.39' ]
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: safeer-webkit
          path: build/safeer-webkit
      - name: Verify version consistency
        run: python3 packaging/check_version.py
      - name: Safeer DRM for the packages (pinned castLabs ECS, SHA-256)
        # Lastnik, 18. 10. 2026: Safeer DRM je del paketa kot vse drugo in se med delovanjem ne prenasa (pin v
        # packaging/safeer-drm.json). Widevine CDM ni v paketu: ECS ga ob prvi zasciteni vsebini sam namesti z Googla.
        run: python3 packaging/safeer_drm_paket.py pripravi build/safeer-drm
      - name: Debian package with our WebKitGTK built in (one file), and launch smoke of the payload
        run: |
          WEBKIT="build/safeer-webkit/safeer-webkit_$(cat packaging/VERSION)_amd64.deb"
          SAFEER_DRM_TOVOR="$PWD/build/safeer-drm" SAFEER_WEBKIT_DEB="$WEBKIT" bash build_deb.sh
          DEB="safeer-browser_$(cat packaging/VERSION)_amd64.deb"
          dpkg-deb -f "$DEB" Package Version Architecture Depends Recommends
          # Nas WebKit je vgrajen (lastnik, 20. 10. 2026: ena datoteka): sistemskega WebKitGTK/libsoup in paketa safeer-webkit
          # paket ne zahteva, zahteva pa odvisnosti WebKita (peskovnik, TLS).
          if dpkg-deb -f "$DEB" Depends | grep -E 'gir1\.2-webkit-6\.0|gir1\.2-soup-3\.0|libwebkitgtk|libsoup-3\.0'; then echo "::error::paket zahteva sistemski WebKitGTK/libsoup"; exit 1; fi
          if dpkg-deb -f "$DEB" Depends | grep -E '(^|, )safeer-webkit\b'; then echo "::error::paket zahteva loceni safeer-webkit"; exit 1; fi
          # Vsak pogoj v svoji vrstici: bash -e ne ustavi koraka ob napaki ukaza pred zadnjim && (pregled 18. 10. 2026).
          dpkg-deb -f "$DEB" Depends | grep -F 'bubblewrap'
          dpkg-deb -f "$DEB" Provides | grep -F "safeer-webkit (= $(dpkg-deb -f "$WEBKIT" Version)+vgrajen)"
          dpkg-deb -f "$DEB" Conflicts | grep -F 'safeer-webkit (<< 1.0.128+vgrajen~)'
          dpkg-deb -c "$DEB" | grep -F './usr/lib/safeer-browser/webkit-vgrajen/libexec/webkitgtk-6.0/WebKitWebProcess'
          dpkg-deb -c "$DEB" | grep -F './usr/lib/safeer-browser/webkit-vgrajen/share/webkitgtk-safeer/odtis'
          # Knjiznice WebKita samo v viru (webkit-vgrajen), ne kot stara lastna kopija (/usr/lib/safeer-browser/webkit).
          if dpkg-deb -c "$DEB" | grep -E '\./usr/lib/safeer-browser/webkit/|\./usr/lib/safeer-webkit/' ; then echo "::error::WebKit izven vira webkit-vgrajen"; exit 1; fi
          if dpkg-deb -c "$DEB" | grep -E '/lib(webkitgtk|javascriptcoregtk|soup)-[0-9.]+\.so' | grep -v '/webkit-vgrajen/'; then echo "::error::knjiznica WebKita izven vira"; exit 1; fi
          # Safeer DRM je v paketu (ne prenasa se med delovanjem), z obvestili o licencah; Widevine CDM ni v paketu.
          dpkg-deb -c "$DEB" | grep -E '\./usr/lib/safeer-browser/safeer-drm/safeer-drm$'
          dpkg-deb -c "$DEB" | grep -F './usr/share/doc/safeer-browser/safeer-drm/OBVESTILO.txt'
          if dpkg-deb -c "$DEB" | grep -E 'WidevineCdm|libwidevinecdm'; then echo "::error::Widevine CDM je v paketu"; exit 1; fi
          dpkg-deb -f "$DEB" Depends | grep -F 'libgtk-3-0t64'
          echo "::notice::$(stat -c '%n %s B' "$DEB") | namesceno $(dpkg-deb -f "$DEB" Installed-Size) KiB"
          xvfb-run -a dbus-run-session -- /usr/bin/python3 packaging/smoke_brskalnik.py build/stage/usr/lib/safeer-browser
      - name: Install, launch and remove the Debian package (system WebKitGTK 6.0 installed too)
        # gir1.2-webkit-6.0 in gir1.2-soup-3.0 sistema sta namescena (prvi korak): paket mora kljub temu teci na nasih.
        # En paket (vgrajen WebKit), kot ga uporabnik namesti z dvoklikom in kot pise na safeer.si.
        run: |
          sudo apt-get install -y --no-install-recommends "./safeer-browser_$(cat packaging/VERSION)_amd64.deb" 2>&1 | tee namestitev.log
          grep -F 'Safeer WebKit' namestitev.log
          test -x /usr/lib/safeer-webkit/libexec/webkitgtk-6.0/WebKitWebProcess
          # Ena kopija na disku: skupna mapa in vir paketa sta ista datoteka (trda povezava).
          [ "$(stat -L -c %i /usr/lib/safeer-webkit/lib/libwebkitgtk-6.0.so.4)" = "$(stat -L -c %i /usr/lib/safeer-browser/webkit-vgrajen/lib/libwebkitgtk-6.0.so.4)" ]
          xvfb-run -a safeer --version | tee /dev/stderr | grep -Fx "Safeer Browser $(cat packaging/VERSION)"
          desktop-file-validate /usr/share/applications/safeer-browser.desktop
          grep -Fx 'StartupWMClass=io.github.memelandfaner.SafeerBrowser' /usr/share/applications/safeer-browser.desktop
          test -f /usr/lib/safeer-browser/safeer_brskalnik.py
          test ! -e /usr/lib/safeer-browser/safeer_mint.py
          # Safeer DRM iz paketa: pripeti odtisi, brez setuid; Splet ga najde v /usr/lib/safeer-browser/safeer-drm.
          python3 packaging/safeer_drm_paket.py preveri /usr/lib/safeer-browser/safeer-drm
          /usr/bin/python3 -c "import sys; sys.path.insert(0, '/usr/lib/safeer-browser'); from core import safeer_drm as d; e = d.izvrsljiva(); print('Safeer DRM:', e); assert str(e) == '/usr/lib/safeer-browser/safeer-drm/safeer-drm', e"
          dpkg -s libwebkitgtk-6.0-4 | grep -E '^(Status|Version)'
          xvfb-run -a dbus-run-session -- /usr/bin/python3 packaging/smoke_webkit_deb.py /usr/lib/safeer-browser
          xvfb-run -a dbus-run-session -- /usr/bin/python3 packaging/smoke_brskalnik.py /usr/lib/safeer-browser
          sudo apt-get remove -y safeer-browser
          [ ! -e /usr/lib/safeer-browser ] || { echo "po odstranitvi je ostalo /usr/lib/safeer-browser"; find /usr/lib/safeer-browser | head; exit 1; }
          [ ! -e /usr/lib/safeer-webkit ] || { echo "po odstranitvi je ostalo /usr/lib/safeer-webkit"; find /usr/lib/safeer-webkit | head; exit 1; }
          # Sistemski WebKitGTK ostane nedotaknjen.
          dpkg -s libwebkitgtk-6.0-4 | grep -Fx 'Status: install ok installed'
      - name: AppImage
        run: |
          bash packaging/fetch_linuxdeploy.sh
          SAFEER_DRM_TOVOR="$PWD/build/safeer-drm" LINUXDEPLOY="$PWD/build/tools/linuxdeploy.AppImage" bash packaging/build_appimage.sh
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a dbus-run-session -- python3 packaging/test_appimage.py dist/Safeer-Browser-*.AppImage
      - uses: actions/upload-artifact@v7
        with:
          name: brskalnik
          path: |
            *.deb
            dist/*.AppImage
  safeer-os:
    # Safeer OS na GTK4 + WebKitGTK 6.0 z lupino v Qt Quick (en proces). Ubuntu 24.04 je osnova Linux Mint 22 - prve
    # razlicice Minta z WebKitGTK 6.0 (Mint 21 ga nima; lastnik 14. 10. 2026: .deb za Mint 22+, PySide6 v paketu).
    # Paket .deb (amd64) tece na nasem WebKitGTK in libsoup iz paketa safeer-webkit (posel webkit-deb, z dav1ddec), nas
    # rqbit iz rqbit-deb je v /usr/lib/safeer-os/rqbit.
    needs: [webkit-deb, rqbit-deb]
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
      options: --privileged
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: UTC
    steps:
      - name: Install build and test dependencies
        run: |
          apt-get update
          apt-get install -y ca-certificates curl git sudo python3-cryptography python3-qrcode python3-zeroconf python3-ifaddr python3-pytest python3-gi python3-gi-cairo python3-pil python3-numpy gir1.2-gtk-4.0 gir1.2-webkit-6.0 gir1.2-soup-3.0 gir1.2-secret-1 gir1.2-atspi-2.0 gir1.2-gstreamer-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-gl desktop-file-utils appstream dpkg-dev glib-networking xvfb xdotool bubblewrap file libglib2.0-bin libglib2.0-dev-bin binutils patchelf libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libegl1 libfontconfig1 libdbus-1-3 zstd dbus gcc gobject-introspection
          [ "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.39' ]
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: safeer-webkit
          path: build/safeer-webkit
      - uses: actions/download-artifact@v8
        with:
          name: rqbit-deb
          path: build/rqbit
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: PySide6 (QML shell) - the same wheels as the package and the Flatpak
        run: python3 packaging/pyside6_vendor.py build/vendor
      - name: Unit tests (all - Safeer is GTK 4 and WebKitGTK 6.0 only since 18 Oct 2026)
        # En proces za vse preizkuse: GTK3 je umaknjen, zato delitve na skupine (razdeli_teste.py) ni vec.
        shell: bash -e {0}
        run: |
          set -euo pipefail
          PYTHONPATH="tests:build/vendor" QT_QUICK_BACKEND=software xvfb-run -a /usr/bin/python3 -m pytest -q -p no:cacheprovider tests/
      - name: Safeer DRM for the packages (pinned castLabs ECS, SHA-256)
        # Kot v poslu brskalnik: Safeer DRM je del paketa (packaging/safeer-drm.json); Widevine CDM namesti ECS sam.
        run: python3 packaging/safeer_drm_paket.py pripravi build/safeer-drm
      - name: Safeer OS packages (desktop environment safeer-os and app safeer-os-app, WebKit and Safeer Control built in)
        # Od 20. 10. 2026 (lastnik) sta za Linux dva paketa .deb, vsak ena datoteka (tudi z dvoklikom v GDebi): namizno
        # okolje (Safeer OS, Safeer Control, Safeer Cinnamon) in aplikacija v oknu (brez Cinnamona); se zamenjata.
        # mint-themes je le priporocilo, zato se paket tu namesti tudi na Ubuntu 24.04 brez priporocenih paketov.
        run: |
          # Artefakt ne ohrani pravic datotek: program rqbit spet izvrsljiv (namesti ga preveri pred vgradnjo).
          chmod 755 build/rqbit/rqbit
          WEBKIT="./build/safeer-webkit/safeer-webkit_$(cat packaging/VERSION)_amd64.deb"
          SAFEER_OS_PAKET=safeer-os-app SAFEER_RQBIT_TOVOR="$PWD/build/rqbit" SAFEER_DRM_TOVOR="$PWD/build/safeer-drm" SAFEER_WEBKIT_DEB="$WEBKIT" bash build_os_deb.sh
          APP="./safeer-os-app_$(cat packaging/VERSION_OS)_amd64.deb"
          SAFEER_RQBIT_TOVOR="$PWD/build/rqbit" SAFEER_DRM_TOVOR="$PWD/build/safeer-drm" SAFEER_WEBKIT_DEB="$WEBKIT" bash build_os_deb.sh
          OS="./safeer-os_$(cat packaging/VERSION_OS)_amd64.deb"
          dpkg-deb -f "$APP" Package Version Architecture Depends Provides Conflicts Replaces
          dpkg-deb -f "$APP" Conflicts | grep -E '(^|, )safeer-os(,|$)'
          dpkg-deb -f "$OS" Conflicts | grep -E '(^|, )safeer-os-app(,|$)'
          if dpkg-deb -c "$APP" | grep -F 'safeer-cinnamon'; then echo "::error::aplikacija ima Safeer Cinnamon"; exit 1; fi
          echo "::notice::$(stat -c '%n %s B' "$APP") | namesceno $(dpkg-deb -f "$APP" Installed-Size) KiB"
          dpkg-deb -f "$OS" Package Version Architecture Depends Recommends Provides Replaces
          DEB="$OS"
          if dpkg-deb -f "$DEB" Depends | grep -E 'gir1\.2-webkit-6\.0|gir1\.2-soup-3\.0|libwebkitgtk|libsoup-3\.0'; then echo "::error::paket zahteva sistemski WebKitGTK/libsoup"; exit 1; fi
          # Nas WebKit (z dav1ddec, peskovnikom in TLS) je vgrajen iz safeer-webkit istega teka (v viru webkit-vgrajen).
          for P in "$OS" "$APP"; do
            if dpkg-deb -f "$P" Depends | grep -E '(^|, )safeer-webkit\b'; then echo "::error::$P zahteva loceni safeer-webkit"; exit 1; fi
            dpkg-deb -f "$P" Depends | grep -F 'bubblewrap'
            dpkg-deb -f "$P" Provides | grep -F "safeer-webkit (= $(dpkg-deb -f "$WEBKIT" Version)+vgrajen)"
            dpkg-deb -c "$P" | grep -E '\./usr/lib/safeer-os(-app)?/webkit-vgrajen/libexec/webkitgtk-6\.0/WebKitWebProcess$'
            if dpkg-deb -c "$P" | grep -E '\./usr/lib/safeer-(os|control)/webkit/|\./usr/lib/safeer-webkit/'; then echo "::error::WebKit izven vira"; exit 1; fi
            if dpkg-deb -c "$P" | grep -E '/lib(webkitgtk|javascriptcoregtk|soup)-[0-9.]+\.so' | grep -v '/webkit-vgrajen/'; then echo "::error::knjiznica WebKita izven vira"; exit 1; fi
          done
          # Safeer DRM je v paketu (ne prenasa se med delovanjem), z obvestili o licencah; Widevine CDM ni v paketu.
          dpkg-deb -c "$OS" | grep -E '\./usr/lib/safeer-os/safeer-drm/safeer-drm$'
          dpkg-deb -c "$OS" | grep -F './usr/share/doc/safeer-os/safeer-drm/OBVESTILO.txt'
          if dpkg-deb -c "$OS" | grep -E 'WidevineCdm|libwidevinecdm'; then echo "::error::Widevine CDM je v paketu"; exit 1; fi
          dpkg-deb -f "$OS" Depends | grep -F 'libnss3'
          # Nas rqbit (posel rqbit-deb) z licenco, obvestilom in popravkom; v PATH ga ni.
          dpkg-deb -c "$OS" | grep -E '^-rwxr-xr-x .* \./usr/lib/safeer-os/rqbit/rqbit$'
          dpkg-deb -c "$OS" | grep -F './usr/share/doc/safeer-os/rqbit/LICENSE'
          dpkg-deb -c "$OS" | grep -F './usr/share/doc/safeer-os/rqbit/LICENSES-THIRD-PARTY.txt'
          dpkg-deb -c "$OS" | grep -F './usr/share/doc/safeer-os/rqbit/ipv4-fallback-without-ipv6.patch'
          if dpkg-deb -c "$OS" | grep -E '\./usr/(local/)?s?bin/rqbit$'; then echo "::error::rqbit v PATH"; exit 1; fi
          echo "::notice::$(stat -c '%n %s B' "$OS") | namesceno $(dpkg-deb -f "$OS" Installed-Size) KiB"
          # Polja paketa so v obliki dpkg (beta 2.1.83-beta.1 -> 2.1.83~beta.1, packaging/deb_razlicica.sh; stabilna enaka).
          dpkg-deb -f "$OS" Version | grep -Fx "$(bash packaging/deb_razlicica.sh "$(cat packaging/VERSION_OS)")"
          dpkg-deb -f "$OS" Provides | grep -F "safeer-control (= $(bash packaging/deb_razlicica.sh "$(cat packaging/VERSION_CONTROL)"))"
          dpkg-deb -f "$OS" Provides | grep -F "safeer-cinnamon (= $(bash packaging/deb_razlicica.sh "$(cat packaging/VERSION_CINNAMON)"))"
          # Node.js ni v paketu (lastnik, 19. 10. 2026: v 1.0.127 ga nic ne uporablja, +29 MB prenosa).
          if dpkg-deb -c "$OS" | grep -E '\./usr/lib/safeer-os/node/|\./usr/(local/)?s?bin/(node|nodejs|npm|npx)$'; then echo "::error::Node.js v paketu"; exit 1; fi
          # Profila AppArmor (Ubuntu 24.04+: peskovnik WebKita) kot conffile.
          dpkg-deb --ctrl-tarfile "$OS" | tar -xO ./conffiles | tee /dev/stderr | grep -Fx /etc/apparmor.d/safeer-os
          dpkg-deb --ctrl-tarfile "$OS" | tar -xO ./conffiles | grep -Fx /etc/apparmor.d/safeer-control
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "$OS"
          # Namesceni rqbit je program iz posla rqbit-deb (SHA-256 iz zapisa gradnje); Safeer OS in Safeer Control ga
          # uporabita namesto prenosa z GitHuba.
          RQBIT_SHA="$(python3 -c 'import json; print(json.load(open("build/rqbit/gradnja.json"))["program_sha256"])')"
          echo "$RQBIT_SHA  /usr/lib/safeer-os/rqbit/rqbit" | sha256sum -c -
          /usr/lib/safeer-os/rqbit/rqbit --version | tee /dev/stderr | grep -Fx "rqbit $(python3 -c 'import json; print(json.load(open("packaging/rqbit/rqbit.json"))["razlicica"])')"
          for koren in /usr/lib/safeer-os /usr/lib/safeer-control; do
            /usr/bin/python3 -c "import sys; sys.path.insert(0, '$koren'); from core import os_torrent as t; p = t.pot_programa(); assert p == '/usr/lib/safeer-os/rqbit/rqbit', p; assert t.program_na_voljo()"
          done
          xvfb-run -a safeer-os --version | tee /dev/stderr | grep -Fx "Safeer OS $(cat packaging/VERSION_OS)"
          python3 packaging/safeer_drm_paket.py preveri /usr/lib/safeer-os/safeer-drm
          /usr/bin/python3 -c "import sys; sys.path.insert(0, '/usr/lib/safeer-os'); from core import safeer_drm as d; e = d.izvrsljiva(); print('Safeer DRM:', e); assert str(e) == '/usr/lib/safeer-os/safeer-drm/safeer-drm', e"
          xvfb-run -a safeer-control --version | tee /dev/stderr | grep -Fx "Safeer Control $(cat packaging/VERSION_CONTROL)"
          # Safeer Link najde naprave prek mDNS: brez zeroconf ni prijave (ne QR ne 6-mestne kode).
          /usr/bin/python3 -c "import zeroconf"
          # safeerctl (Safeer Link from the command line) ships in the same package.
          safeerctl --version | tee /dev/stderr | grep -Fx "safeerctl $(cat packaging/VERSION_CONTROL)"
          # Lupina QML: PySide6 iz paketa (Mint 22 ga nima) se nalozi in pozene Qt Quick brez zaslona.
          QT_QPA_PLATFORM=offscreen /usr/bin/python3 -c "import sys; sys.path.insert(0, '/usr/lib/safeer-os/vendor'); from PySide6.QtGui import QGuiApplication; from PySide6.QtQuick import QQuickView; a = QGuiApplication([]); v = QQuickView(); print('PySide6 OK')"
          bash packaging/preveri_qxcb.sh /usr/lib/safeer-os/vendor
          # Splet v Safeer OS in Safeer Control tece na nasem WebKitGTK in libsoup (sistemski WebKitGTK 6.0 je namescen),
          # stran se nalozi v peskovniku bubblewrap.
          xvfb-run -a dbus-run-session -- /usr/bin/python3 packaging/smoke_webkit_deb.py /usr/lib/safeer-os
          xvfb-run -a dbus-run-session -- /usr/bin/python3 packaging/smoke_webkit_deb.py /usr/lib/safeer-control
          bash -n /usr/bin/safeer-cinnamon
          # Okno z izbiro postavitve (GTK 4) se prevede.
          python3 -m py_compile /usr/lib/safeer-cinnamon/izbira
          test -f /usr/share/themes/Safeer-Cinnamon/cinnamon/cinnamon.css
          test -f /usr/share/themes/Safeer-Cinnamon-Kontrast/gtk-3.0/gtk.css
          test -f /usr/share/doc/safeer-cinnamon/copyright
          for d in safeer-os safeer-os.Magnet safeer-os.Stremio safeer-os.Player safeer-os.splet safeer-os.sporocila \
                   safeer-os.zapiski safeer-os.nastavitve safeer-control safeer-cinnamon \
                   safeer-cinnamon-izklopi safeer-cinnamon-od-vklopa safeer-cinnamon-od-vklopa-izklopi; do
            desktop-file-validate "/usr/share/applications/$d.desktop"
          done
          test -f /usr/share/icons/hicolor/scalable/apps/safeer-os.Player.svg
          for i in safeer-os.splet safeer-os.sporocila safeer-os.zapiski safeer-os.nastavitve safeer-control; do
            test -f /usr/share/icons/hicolor/scalable/apps/$i.svg
          done
          # Namizno okolje ne kaze aplikacije v oknu v meniju (lastnik, 20. 10. 2026: namizje nudi vse, kar aplikacija).
          grep -Fx 'NoDisplay=true' /usr/share/applications/safeer-os.desktop
          # Aplikacija zamenja namizno okolje (Conflicts + Replaces): Cinnamon gre, WebKit ostane, Safeer OS in Control tecejo.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "$APP" 2>&1 | tee aplikacija.log
          # apt najprej odstrani namizno okolje (Conflicts), sele nato razpakira aplikacijo: brez drugega programa Safeer
          # gre WebKit z namizjem in ga aplikacija namesti znova (CI 20. 10. 2026). Na koncu mora biti na mestu.
          grep -F 'Safeer WebKit' aplikacija.log
          test -x /usr/lib/safeer-webkit/libexec/webkitgtk-6.0/WebKitWebProcess
          dpkg-query -W -f '${db:Status-Abbrev}' safeer-os-app | grep -q '^ii'
          if dpkg-query -W -f '${db:Status-Abbrev}' safeer-os 2>/dev/null | grep -q '^ii'; then echo "namizno okolje je ostalo ob aplikaciji"; exit 1; fi
          [ ! -e /usr/lib/safeer-cinnamon ]
          if grep -Fx 'NoDisplay=true' /usr/share/applications/safeer-os.desktop; then echo "aplikacija v meniju ni vidna"; exit 1; fi
          xvfb-run -a safeer-os --version | tee /dev/stderr | grep -Fx "Safeer OS $(cat packaging/VERSION_OS)"
          xvfb-run -a safeer-control --version | grep -Fx "Safeer Control $(cat packaging/VERSION_CONTROL)"
          xvfb-run -a dbus-run-session -- /usr/bin/python3 packaging/smoke_webkit_deb.py /usr/lib/safeer-os
          sudo apt-get remove -y safeer-os-app
          dpkg -s libwebkitgtk-6.0-4 | grep -Fx 'Status: install ok installed'
          for ostanek in /usr/lib/safeer-os /usr/lib/safeer-control /usr/lib/safeer-cinnamon /usr/lib/safeer-webkit /usr/bin/safeer-control /usr/bin/safeer-cinnamon; do
            [ ! -e "$ostanek" ] || { echo "po odstranitvi je ostalo $ostanek"; exit 1; }
          done
      - name: Fetch linuxdeploy
        run: bash packaging/fetch_linuxdeploy.sh
      - name: Safeer OS AppImage (Safeer OS + Safeer Control)
        run: |
          SAFEER_RQBIT_TOVOR="$PWD/build/rqbit" SAFEER_DRM_TOVOR="$PWD/build/safeer-drm" LINUXDEPLOY="$PWD/build/tools/linuxdeploy.AppImage" bash packaging/build_os_appimage.sh
          chmod +x dist/Safeer-OS-*.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a dist/Safeer-OS-*.AppImage --version | tee /dev/stderr | grep -Fx "Safeer OS $(cat packaging/VERSION_OS)"
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a dist/Safeer-OS-*.AppImage --control --version | tee /dev/stderr | grep -Fx "Safeer Control $(cat packaging/VERSION_CONTROL)"
          APPIMAGE_EXTRACT_AND_RUN=1 dist/Safeer-OS-*.AppImage --ctl --version | tee /dev/stderr | grep -Fx "safeerctl $(cat packaging/VERSION_CONTROL)"
          rm -rf build/os-appimage-x
          mkdir -p build/os-appimage-x
          (cd build/os-appimage-x && ../../dist/Safeer-OS-*.AppImage --appimage-extract >/dev/null)
          for modul in qrcode zeroconf ifaddr; do test -d "build/os-appimage-x/squashfs-root/usr/lib/python3/dist-packages/$modul"; done
          # Safeer DRM izven usr/ (linuxdeploy ga ne spreminja), s pripetimi odtisi; AppRun-os poda SAFEER_DRM_MAPA.
          python3 packaging/safeer_drm_paket.py preveri build/os-appimage-x/squashfs-root/opt/safeer-drm
          grep -F 'export SAFEER_DRM_MAPA="$APPDIR/opt/safeer-drm"' build/os-appimage-x/squashfs-root/AppRun
          # Nas rqbit izven usr/ (linuxdeploy ga ne spreminja): isti program kot v paketu .deb, AppRun-os poda SAFEER_RQBIT
          # in core/os_torrent.py ga uporabi namesto prenosa z GitHuba.
          RQ=build/os-appimage-x/squashfs-root/opt/rqbit/rqbit
          echo "$(python3 -c 'import json; print(json.load(open("build/rqbit/gradnja.json"))["program_sha256"])')  $RQ" | sha256sum -c -
          "$RQ" --version | grep -Fx "rqbit $(python3 -c 'import json; print(json.load(open("packaging/rqbit/rqbit.json"))["razlicica"])')"
          test -f build/os-appimage-x/squashfs-root/usr/share/doc/safeer-os/rqbit/LICENSES-THIRD-PARTY.txt
          grep -F 'export SAFEER_RQBIT="$APPDIR/opt/rqbit/rqbit"' build/os-appimage-x/squashfs-root/AppRun
          SAFEER_RQBIT="$PWD/$RQ" /usr/bin/python3 -c "import os, sys; sys.path.insert(0, 'build/os-appimage-x/squashfs-root/usr/lib/safeer-os'); from core import os_torrent as t; p = t.pot_programa(); assert p == os.environ['SAFEER_RQBIT'] and t.program_na_voljo(), p"
      - uses: actions/upload-artifact@v7
        with:
          name: safeer-os
          path: |
            safeer-os_*.deb
            safeer-os-app_*.deb
            dist/Safeer-OS-*.AppImage
  qt-xcb:
    # Vticnik Qt xcb lupine QML (PySide6 iz paketa) nalozi libxcb-* neposredno. Posel safeer-os pred tem namesti cel
    # seznam razvojnih knjiznic, zato tam manjkajoca odvisnost paketa ne bi padla. Tu: cist vsebnik ubuntu:24.04 (osnova
    # Linux Mint 22), paket z apt --no-install-recommends (kot GDebi) in ldd vticnika brez »not found«.
    needs: [webkit-deb, safeer-os]
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: UTC
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: safeer-os
          path: paketi
      - name: Safeer OS package in a minimal Ubuntu 24.04 (no recommended packages)
        # Z vgrajenim WebKitom: paket zahteva njegove knjiznice, ki jih noble namesti brez priporocenih paketov.
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends ./paketi/safeer-os_*_amd64.deb
      - name: PySide6 xcb plugin finds every library (ldd, no "not found")
        run: bash packaging/preveri_qxcb.sh /usr/lib/safeer-os/vendor
  mint:
    # The packages are installed, started and removed on real Linux Mint - the way a user does it. The build job
    # installs them on Ubuntu 22.04, where the two look packages cannot be installed at all (mint-themes exists
    # only in Linux Mint) and dependencies are resolved by another repository than the user's. This job takes the
    # very files that go into the release (tools/mint_namestitev).
    needs: [brskalnik, safeer-os]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mint: ['22', '22.3', '23']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: brskalnik
          path: paketi
      - uses: actions/download-artifact@v8
        with:
          name: safeer-os
          path: paketi
      - name: Unprivileged user namespaces as on Linux Mint
        # Linux Mint turns Ubuntu's restriction off (/etc/sysctl.d/20-apparmor-mint.conf). The container shares the
        # kernel of the runner, where the restriction may be on; the WebKit sandbox of a normal user needs them.
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Packages of the last published release (for the upgrade test)
        # An upgrade is the path of every existing user: Safeer OS installs it by itself. On a tag build the new
        # release is not published yet, so "latest" is the release that users have now.
        # Preizkus nadgradnje odpade samo, ce objavljene izdaje se ni; napaka API ali prenosa ustavi korak (pregled
        # 18. 10. 2026: "|| echo" je skril tudi napake omrezja/API in gradnja oznake je nadgradnjo tiho preskocila).
        env:
          GH_TOKEN: ${{ github.token }}
          IZDAJA: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          mkdir -p prejsnji
          N="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select((.draft or .prerelease) | not)] | length')"
          if [ "$N" = 0 ]; then
            if [ "$IZDAJA" = true ]; then
              echo "::warning::No published release yet: this release build tests only a fresh installation."
            else
              echo "::notice::No published release yet: only a fresh installation is tested."
            fi
            exit 0
          fi
          ZADNJA="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          test -n "$ZADNJA"
          gh release download "$ZADNJA" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir prejsnji
          ls -l prejsnji
          ls prejsnji/*.deb >/dev/null || { echo "::error::release $ZADNJA has no .deb packages for the upgrade test"; exit 1; }
          echo "::notice::Upgrade test from $ZADNJA"
      - name: Install, upgrade, start and remove all packages on Linux Mint ${{ matrix.mint }}
        run: bash tools/mint_namestitev/preizkus.sh "linuxmintd/mint${{ matrix.mint }}-amd64" paketi prejsnji
  webkit-pgo-profil:
    # PGO 1/3 (vsak tek): Flatpaka obeh programov imata WebKitGTK, preveden s profilom (PGO; lastnik 15. 10. 2026: "DA",
    # Speedometer 3.1 na testnem PC 10.7 namesto 9.2 brez PGO). Kljuc profila (packaging/webkit/pgo.py kljuc) zajame vse,
    # od cesar je profil odvisen: izvor in popravke WebKita, ucni tek in razlicico Clang/LLVM. Profil s tem kljucem
    # iscemo med artefakti repozitorija (webkit-pgo-profraw-<kljuc>, 90 dni): vidijo jih vse veje in oznake v*, actions/cache
    # pa bi oznaka izdaje videla samo z glavne veje. Ucni tek (posel webkit-pgo-ucenje) tece samo, ce profila ni.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      kljuc: ${{ steps.kljuc.outputs.kljuc }}
      run_id: ${{ steps.profil.outputs.run_id }}
      osvezi: ${{ steps.profil.outputs.osvezi }}
    steps:
      - uses: actions/checkout@v5
      - name: Clang/LLVM 22 (the Flatpak SDK extension that builds our WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.freedesktop.Sdk.Extension.llvm22//25.08
      - name: Profile key
        id: kljuc
        run: |
          K="$(python3 packaging/webkit/pgo.py kljuc)"
          echo "kljuc=$K" >> "$GITHUB_OUTPUT"
          echo "::notice::PGO kljuc $K"
      - name: Profile with this key (artifact of an earlier trusted run)
        # Profil gre v WebKit izdaje, zato samo artefakt teka tega repozitorija (pregled 18. 10. 2026: artefakt lahko
        # nalozi tudi tek pull_request iz forka): head_repository = ta repozitorij, dogodek push ali workflow_dispatch
        # (oba zahtevata pravico pisanja), pri gradnji oznake v* pa se veja main / gtk4-deb-webkit ali oznaka v*.
        # Nezaupanja vrednega profila ne vzamemo nikoli: brez zaupanja vrednega posel webkit-pgo-ucenje profil nauci v tem
        # teku (tudi tek oznake je zaupanja vreden vir); izrecno izbran tek (pgo_profraw_run), ki ni zaupanja vreden, ustavi tek.
        id: profil
        env:
          GH_TOKEN: ${{ github.token }}
          KLJUC: ${{ steps.kljuc.outputs.kljuc }}
          NOV: ${{ inputs.pgo }}
          TEK: ${{ inputs.pgo_profraw_run }}
          REPO_ID: ${{ github.repository_id }}
          IZDAJA: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          IME="webkit-pgo-profraw-$KLJUC"
          if [ "$NOV" = true ]; then echo "::notice::PGO: nov ucni tek (rocno), $IME"; exit 0; fi
          [[ "$TEK" =~ ^[0-9]*$ ]] || { echo "::error::pgo_profraw_run ni id teka: $TEK"; exit 1; }
          [[ "$REPO_ID" =~ ^[0-9]+$ ]] || { echo "::error::ni id repozitorija"; exit 1; }
          zaupanja_vreden() {
            local tek="$1" dogodek repo veja
            read -r dogodek repo veja <<< "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$tek" \
              --jq '"\(.event) \(.head_repository.id) \(.head_branch)"')" || return 1
            [ "$repo" = "$REPO_ID" ] || return 1
            case "$dogodek" in push|workflow_dispatch) ;; *) return 1 ;; esac
            [ "$IZDAJA" = true ] || return 0
            case "$veja" in main|gtk4-deb-webkit|v*) return 0 ;; *) return 1 ;; esac
          }
          SEZNAM="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$IME&per_page=100" \
            --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | reverse | .[] | "\(.workflow_run.id) \(.created_at)"')"
          RUN=""; USTVARJEN=""
          while read -r R C; do
            [ -n "$R" ] || continue
            [ -z "$TEK" ] || [ "$R" = "$TEK" ] || continue
            if zaupanja_vreden "$R"; then RUN="$R"; USTVARJEN="$C"; break; fi
            echo "::warning::PGO: $IME iz teka $R ni iz zaupanja vrednega teka (repozitorij, dogodek, veja) - ga ne uporabimo"
          done <<< "$SEZNAM"
          if [ -z "$RUN" ]; then
            [ -z "$TEK" ] || { echo "::error::tek $TEK nima zaupanja vrednega artefakta $IME"; exit 1; }
            echo "::notice::PGO: zaupanja vrednega profila $IME ni, ucni tek v tem teku (webkit-pgo-ucenje)"
            exit 0
          fi
          echo "run_id=$RUN" >> "$GITHUB_OUTPUT"
          # Artefakt potece po 90 dneh; starejsega od 60 dni ta tek nalozi znova (posel flatpak-brskalnik), da se WebKit, ki
          # se dolgo ne spremeni, ne uci znova.
          if [ $(( $(date +%s) - $(date -d "$USTVARJEN" +%s) )) -gt $(( 60 * 86400 )) ]; then echo "osvezi=true" >> "$GITHUB_OUTPUT"; fi
          echo "::notice::PGO: profil $IME iz teka $RUN ($USTVARJEN)"
  webkit-pgo-ucenje:
    # PGO 2/3 (samo ko profila s kljucem ni, ali rocno z vhodom pgo): instrumentiran WebKitGTK
    # (-DENABLE_LLVM_PROFILE_GENERATION=ON) v Flatpaku brskalnika, ucni tek Speedometer 3.1 (pripeta lokalna kopija, brez
    # omrezja) pod Xvfb, .profraw v artefakt webkit-pgo-profraw-<kljuc>. ~1,5-2,5 h; isti tek nato zgradi oba Flatpaka s
    # profilom (flatpak, flatpak-brskalnik caka nanj).
    needs: webkit-pgo-profil
    if: needs.webkit-pgo-profil.outputs.run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space for the WebKitGTK build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /
      - name: Install Flatpak toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream-compose desktop-file-utils xvfb dbus
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.gnome.Platform//50 org.gnome.Sdk//50 org.freedesktop.Sdk.Extension.llvm22//25.08
      - name: Same profile key with the installed Clang
        id: kljuc
        run: |
          K="$(python3 packaging/webkit/pgo.py kljuc)"
          [ "$K" = "${{ needs.webkit-pgo-profil.outputs.kljuc }}" ] || { echo "::error::kljuc PGO $K ni kljuc posla webkit-pgo-profil"; exit 1; }
          echo "predpomnilnik=flatpak-pgo-ucenje-$K-$(python3 packaging/webkit/pgo.py okolje)" >> "$GITHUB_OUTPUT"
      - name: Restore flatpak-builder cache (instrumented WebKitGTK)
        # Ob ponovnem ucnem teku (padec po gradnji) instrumentirano gradnjo vzamemo iz predpomnilnika te veje.
        id: pgo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .flatpak-builder/cache
            .flatpak-builder/downloads
          key: ${{ steps.kljuc.outputs.predpomnilnik }}
      - name: Instrumented WebKitGTK (Safeer Browser Flatpak)
        run: |
          M="$(python3 packaging/webkit/pgo.py ucenje)"
          flatpak-builder --user --install --force-clean build/pgo/app "$M"
          echo "::notice::predpomnilnik flatpak-builder: $(du -sh .flatpak-builder/cache .flatpak-builder/downloads | cut -f1 | paste -sd ' ')"
      - name: Save flatpak-builder cache (instrumented WebKitGTK)
        if: always() && steps.pgo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .flatpak-builder/cache
            .flatpak-builder/downloads
          key: ${{ steps.kljuc.outputs.predpomnilnik }}
      - name: Speedometer 3.1 (pinned, offline copy)
        run: python3 packaging/webkit/pgo.py speedometer build/pgo/speedometer
      - name: Training run
        # Spletni proces brez peskovnika samo v tem ucnem teku (lokalna vsebina): podeduje LLVM_PROFILE_FILE in zapise
        # profil v mapo posla. %m loci knjiznici (libwebkitgtk, libjavascriptcoregtk) v istem procesu.
        run: |
          # Ob napaki ukaz in zadnji izpis kot opozorilo posla (dnevniki posla v API niso vedno dosegljivi).
          exec > >(tee "$RUNNER_TEMP/trening.log") 2>&1
          trap 'sleep 1; python3 -c "import sys; t = open(sys.argv[1], errors=\"replace\").read()[-6000:]; print(\"::error::\" + (sys.argv[2] + \"\\n\" + t).replace(\"%\", \"%25\").replace(\"\\r\", \"\").replace(\"\\n\", \"%0A\"))" "$RUNNER_TEMP/trening.log" "$BASH_COMMAND"' ERR
          P="$PWD/build/pgo/profraw"
          mkdir -p "$P"
          read -r URL MINUT <<< "$(python3 packaging/webkit/pgo.py trening 8123)"
          python3 -m http.server 8123 --bind 127.0.0.1 --directory build/pgo/speedometer >/dev/null 2>&1 & SRV=$!
          sleep 2
          # Brskalnik od 1.0.127 nima dostopa do doma (delovna mapa je pod njim): ucni program samo za branje, kot pri
          # smoke_brskalnik.py (CI 38787148915: "can't open file .../pgo_trening.py").
          xvfb-run -a -s "-screen 0 1920x1080x24" dbus-run-session -- flatpak run --filesystem="$P" --filesystem="$PWD/packaging:ro" \
            --env=LLVM_PROFILE_FILE="$P/%p-%m.profraw" --env=WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 \
            --command=python3 io.github.memelandfaner.SafeerBrowser "$PWD/packaging/webkit/pgo_trening.py" "$URL" "$MINUT"
          for i in $(seq 60); do pgrep -f 'WebKit(Network|Web)Process' >/dev/null || break; sleep 1; done
          kill "$SRV" || true
          ls -l "$P"
          echo "::notice::$(grep '^pgo_trening:' "$RUNNER_TEMP/trening.log" | paste -sd '|') | $(ls "$P" | wc -l) .profraw, $(du -sh "$P" | cut -f1)"
          test "$(find "$P" -name '*.profraw' -size +1k | wc -l)" -ge 2
      - uses: actions/upload-artifact@v7
        with:
          name: webkit-pgo-profraw-${{ needs.webkit-pgo-profil.outputs.kljuc }}
          path: build/pgo/profraw/*.profraw
          if-no-files-found: error
          retention-days: 90
  flatpak:
    # Safeer OS Flatpak (Safeer OS + Safeer Control) z WebKitGTK s PGO - paket izdaje. Brez veljavnega profila posel ne
    # tece (ne gradi tiho brez PGO): ce ucni tek pade, ga ni in izdaja (needs) se ne ustvari, tek pa je rdec.
    # Nas rqbit iz posla rqbit-deb (isti program kot v paketu .deb in AppImage) gre v /app/lib/safeer-os/rqbit.
    needs: [webkit-pgo-profil, webkit-pgo-ucenje, rqbit-deb]
    if: ${{ !cancelled() && needs.rqbit-deb.result == 'success' && needs.webkit-pgo-profil.result == 'success' && (needs.webkit-pgo-ucenje.result == 'success' || (needs.webkit-pgo-ucenje.result == 'skipped' && needs.webkit-pgo-profil.outputs.run_id != '')) }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space for the WebKitGTK build
        # Nas WebKitGTK (packaging/webkit) potrebuje okoli 10 GB za gradnjo; runner jih brez tega nima dovolj.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /
      - name: Install Flatpak toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream-compose desktop-file-utils
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          # Clang/LLVM 22 za WebKitGTK (ThinLTO, packaging/webkit/webkitgtk6-safeer.yml); veja 25.08 = osnova GNOME 50.
          flatpak install --user --noninteractive flathub org.gnome.Platform//50 org.gnome.Sdk//50 org.freedesktop.Sdk.Extension.llvm22//25.08
      - name: PGO profile (training run of this run or the artifact of an earlier one)
        uses: actions/download-artifact@v8
        with:
          name: webkit-pgo-profraw-${{ needs.webkit-pgo-profil.outputs.kljuc }}
          path: build/pgo/profraw
          run-id: ${{ needs.webkit-pgo-profil.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: rqbit-deb
          path: build/rqbit
      - name: Our rqbit for the Flatpak (artifact of job rqbit-deb)
        # Artefakt ne ohrani pravic; manifest ga namesti s packaging/rqbit/rqbit_paket.py namesti (preverba pred tem).
        run: |
          chmod 755 build/rqbit/rqbit
          python3 packaging/rqbit/rqbit_paket.py preveri build/rqbit
      - name: PGO manifest and cache key
        # Kljuc predpomnilnika: profil (kljuc in vsebina .profraw), commita SDK in llvm22 (oba sta v kljucu flatpak-builderja)
        # in datoteke modulov pred kodo Safeerja. Sprememba samo kode Safeerja ga ne spremeni: WebKit iz predpomnilnika.
        id: pgo
        run: |
          K="$(python3 packaging/webkit/pgo.py kljuc)"
          [ "$K" = "${{ needs.webkit-pgo-profil.outputs.kljuc }}" ] || { echo "::error::kljuc PGO $K ni kljuc profila ${{ needs.webkit-pgo-profil.outputs.kljuc }}"; exit 1; }
          test "$(find build/pgo/profraw -name '*.profraw' -size +1k | wc -l)" -ge 2 || { echo "::error::profil PGO ni popoln"; exit 1; }
          PROFIL="$(cat build/pgo/profraw/*.profraw | sha256sum | cut -c1-12)"
          echo "manifest=$(python3 packaging/webkit/pgo.py uporaba build/pgo/profraw io.github.memelandfaner.SafeerOS.yml)" >> "$GITHUB_OUTPUT"
          echo "zacetek=flatpak-os-pgo-$K-" >> "$GITHUB_OUTPUT"
          echo "predpomnilnik=flatpak-os-pgo-$K-$PROFIL-$(python3 packaging/webkit/pgo.py okolje)-${{ hashFiles('io.github.memelandfaner.SafeerOS.yml', 'packaging/webkit/*.yml', 'packaging/webkit/pgo.py', 'packaging/libsoup/**', 'packaging/zypak/**') }}" >> "$GITHUB_OUTPUT"
      - name: Restore flatpak-builder cache (WebKitGTK with PGO)
        id: webkit-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .flatpak-builder/cache
            .flatpak-builder/downloads
          key: ${{ steps.pgo.outputs.predpomnilnik }}
          restore-keys: |
            ${{ steps.pgo.outputs.zacetek }}
      - run: python3 packaging/check_version.py
      # Flatpak brskalnika gradi posel flatpak-brskalnik: ID programa je v kljucu predpomnilnika flatpak-builderja,
      # zato bi tu WebKit gradili se enkrat (2-3 h) in presegli cas posla.
      - name: Safeer OS Flatpak (Safeer OS + Safeer Control) with PGO WebKitGTK
        env:
          SAFEER_FLATPAK_MANIFEST: ${{ steps.pgo.outputs.manifest }}
        run: |
          set -o pipefail
          bash packaging/build_os_flatpak.sh 2>&1 | tee "$RUNNER_TEMP/gradnja.log"
          # Kateri moduli so prisli iz predpomnilnika in koliko ga je (omejitev GitHub: 10 GB na repozitorij).
          echo "::notice::flatpak-builder: $(grep -iE 'cache (hit|miss)' "$RUNNER_TEMP/gradnja.log" | paste -sd '|') | predpomnilnik $(du -sh .flatpak-builder/cache .flatpak-builder/downloads | cut -f1 | paste -sd ' ')"
      - name: Save flatpak-builder cache (WebKitGTK with PGO)
        # Takoj po gradnji (tudi ce kasnejsi preizkus pade), da se WebKitGTK ne gradi znova ob vsakem pushu.
        if: always() && steps.webkit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .flatpak-builder/cache
            .flatpak-builder/downloads
          key: ${{ steps.pgo.outputs.predpomnilnik }}
      - name: Safeer OS Flatpak runs, with Safeer Control inside
        # Kot pri AppImage: paket se ne sme samo zgraditi, v njem morata res teci Safeer OS in Control
        # (Safeer OS brez Controla nima Safeer Linka). Namestimo prav datoteko, ki gre v izdajo.
        run: |
          # Ob napaki ukaz in zadnji izpis kot opozorilo posla (dnevniki posla v API niso vedno dosegljivi).
          exec > >(tee "$RUNNER_TEMP/smoke.log") 2>&1
          trap 'sleep 1; python3 -c "import sys; t = open(sys.argv[1], errors=\"replace\").read()[-6000:]; print(\"::error::\" + (sys.argv[2] + \"\\n\" + t).replace(\"%\", \"%25\").replace(\"\\r\", \"\").replace(\"\\n\", \"%0A\"))" "$RUNNER_TEMP/smoke.log" "$BASH_COMMAND"' ERR
          sudo apt-get install -y xvfb dbus
          flatpak install --user --noninteractive --bundle dist/Safeer-OS-*.flatpak
          dbus-run-session -- xvfb-run -a flatpak run io.github.memelandfaner.SafeerOS --version | tee /dev/stderr | grep -Fx "Safeer OS $(cat packaging/VERSION_OS)"
          dbus-run-session -- xvfb-run -a flatpak run --command=safeer-control io.github.memelandfaner.SafeerOS --version | tee /dev/stderr | grep -Fx "Safeer Control $(cat packaging/VERSION_CONTROL)"
          dbus-run-session -- flatpak run --command=safeerctl io.github.memelandfaner.SafeerOS --version | tee /dev/stderr | grep -Fx "safeerctl $(cat packaging/VERSION_CONTROL)"
          # Safeer Link najde naprave prek mDNS: zeroconf (in qrcode za QR prijavo) morata biti v paketu.
          # Splet mora teci na nasem WebKitGTK 6.0 (packaging/webkit), ne na tistem iz runtime-a; lupina QML (PySide6).
          flatpak run --command=python3 io.github.memelandfaner.SafeerOS -c "import gi; gi.require_version('WebKit', '6.0'); from gi.repository import WebKit; v = (WebKit.get_major_version(), WebKit.get_minor_version(), WebKit.get_micro_version()); m = open('/proc/self/maps').read(); knj = sorted({l.split()[-1] for l in m.splitlines() if 'libwebkitgtk-6.0' in l}); print('GTK4 knjiznice:', knj, v); assert knj and all(k.startswith('/app/') for k in knj), 'WebKitGTK 6.0 ni iz /app'; print('WebKitGTK 6.0 iz /app', *v)"
          # libsoup 3.8.0 iz /app (packaging/libsoup): runtime 50 ima 3.6.6 z znanimi ranljivostmi.
          flatpak run --command=python3 io.github.memelandfaner.SafeerOS -c "import gi; gi.require_version('Soup', '3.0'); gi.require_version('WebKit', '6.0'); from gi.repository import Soup, WebKit; v = (Soup.get_major_version(), Soup.get_minor_version(), Soup.get_micro_version()); m = open('/proc/self/maps').read(); knj = sorted({l.split()[-1] for l in m.splitlines() if 'libsoup-3.0' in l}); print('libsoup:', knj, v); assert knj and all(k.startswith('/app/') for k in knj) and v >= (3, 8, 0), 'libsoup ni 3.8 iz /app'"
          # WebKit je preveden s Clangom 22, ThinLTO in povezan z lld (zapis gradnje iz modula, .comment flatpak-builder
          # odstrani); velikost knjiznic za primerjavo z gradnjo GCC.
          WK="$(flatpak info --show-location io.github.memelandfaner.SafeerOS)/files/lib"
          ls -l "$WK"/libwebkitgtk-6.0.so.* "$WK"/libjavascriptcoregtk-6.0.so.*
          echo "::notice::$(stat -L -c '%n %s' "$WK"/libwebkitgtk-6.0.so.4 "$WK"/libjavascriptcoregtk-6.0.so.1 | paste -sd ' ')"
          G="$WK/../share/webkitgtk-safeer/gradnja.txt"
          cat "$G"; echo "::notice::$(paste -sd '|' "$G")"
          grep -q 'clang version 22\.' "$G"
          grep -q '^LTO_MODE:.*=thin$' "$G"
          grep -q '^build.ninja -fuse-ld=lld: [1-9]' "$G"
          # WebKit s profilom (PGO): moznost CMake, -fprofile-use v gradnji in profil s potmi iste gradnje (pgo.py MODUL_IME).
          grep -q '^USE_PGO_PROFILE:BOOL=ON$' "$G" || { echo "::error::Safeer OS: WebKit ni preveden s PGO"; exit 1; }
          grep -q '^build.ninja -fprofile-use: [1-9]' "$G" || { echo "::error::Safeer OS: v gradnji WebKita ni -fprofile-use"; exit 1; }
          P="$WK/../share/webkitgtk-safeer/profil.txt"
          cat "$P"; echo "::notice::$(paste -sd '|' "$P")"
          grep -Eq '^ *[0-9]+ /run/build/webkitgtk6-safeer-pgo$' "$P" && ! grep '/run/build/' "$P" | grep -v '/run/build/webkitgtk6-safeer-pgo$' \
            || { echo "::error::Safeer OS: poti lokalnih funkcij v profilu niso poti gradnje WebKita"; exit 1; }
          flatpak run --command=sh io.github.memelandfaner.SafeerOS -c "test -x /app/libexec/webkitgtk-6.0/WebKitWebProcess"
          # Nas rqbit v /app (isti SHA-256 kot artefakt posla rqbit-deb); Safeer OS in Safeer Control ga uporabita namesto
          # prenosa uradnega programa z GitHuba.
          RQ="$(flatpak info --show-location io.github.memelandfaner.SafeerOS)/files/lib/safeer-os/rqbit/rqbit"
          echo "$(python3 -c 'import json; print(json.load(open("build/rqbit/gradnja.json"))["program_sha256"])')  $RQ" | sha256sum -c -
          flatpak run --command=sh io.github.memelandfaner.SafeerOS -c "/app/lib/safeer-os/rqbit/rqbit --version" | grep -Fx "rqbit $(python3 -c 'import json; print(json.load(open("packaging/rqbit/rqbit.json"))["razlicica"])')"
          flatpak run --command=sh io.github.memelandfaner.SafeerOS -c "test -f /app/share/doc/safeer-os/rqbit/LICENSES-THIRD-PARTY.txt"
          for koren in /app/lib/safeer-os /app/lib/safeer-control; do
            flatpak run --command=python3 io.github.memelandfaner.SafeerOS -c "import sys; sys.path.insert(0, '$koren'); from core import os_torrent as t; p = t.pot_programa(); assert p == '/app/lib/safeer-os/rqbit/rqbit' and t.program_na_voljo(), p"
          done
          # Safeer DRM v paketu (/app, pripet odtis, brez CDM) in na gostitelju po poti iz /.flatpak-info (app-path): ukaz zagona
          # kaze na isto datoteko, kot jo vidi gostitelj (flatpak info --show-location).
          flatpak run --filesystem="$PWD/packaging:ro" --command=python3 io.github.memelandfaner.SafeerOS "$PWD/packaging/safeer_drm_paket.py" preveri /app/lib/safeer-os/safeer-drm
          GOST="$(flatpak run --command=python3 io.github.memelandfaner.SafeerOS -c "import sys; sys.path.insert(0, '/app/lib/safeer-os'); from core import safeer_drm as d; u = d.ukaz_zagona([str(d.izvrsljiva())], peskovnik=False, gostitelj=True); assert u[:3] == ['flatpak-spawn', '--host', '--watch-bus'], u; print(u[-1])")"
          echo "Safeer DRM na gostitelju: $GOST"
          [ "$(readlink -f "$GOST")" = "$(readlink -f "$(flatpak info --show-location io.github.memelandfaner.SafeerOS)/files/lib/safeer-os/safeer-drm/safeer-drm")" ]
          test -x "$GOST"
          # Slicica prve strani PDF (priponke v Sporocilih, Datoteke): pdftoppm v paketu res naredi sliko strani.
          # Kaj je v paketu (opozorilo posla, ker je konec dnevnika v opozorilu ob napaki prirezan).
          flatpak run --command=sh io.github.memelandfaner.SafeerOS -c 'echo "::notice::pdftoppm: $(command -v pdftoppm) | poppler v /app: $(ls /app/lib /app/lib64 2>/dev/null | grep -i poppler | tr "\n" " ") | manjka: $(ldd /app/bin/pdftoppm 2>&1 | grep -i "not found" | tr "\n" " ")"'
          flatpak run --command=sh io.github.memelandfaner.SafeerOS -c "pdftoppm -v"
          flatpak run --command=python3 io.github.memelandfaner.SafeerOS - <<'PY'
          import os, shutil, subprocess, sys, tempfile
          sys.path.insert(0, '/app/lib/safeer-os')
          from core import os_datoteke
          d = tempfile.mkdtemp()
          deli = [b'1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n', b'2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj\n',
                  b'3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 200 300]>>endobj\n']
          t, odmiki = b'%PDF-1.4\n', []
          for x in deli:
              odmiki.append(len(t))
              t += x
          xref = len(t)
          t += b'xref\n0 4\n0000000000 65535 f \n' + b''.join(b'%010d 00000 n \n' % o for o in odmiki)
          t += b'trailer<</Size 4/Root 1 0 R>>\nstartxref\n%d\n%%%%EOF\n' % xref
          pdf, png = os.path.join(d, 'a.pdf'), os.path.join(d, 'a.png')
          open(pdf, 'wb').write(t)
          if not os_datoteke.slika_prve_strani(pdf, png, 160):
              # Kratko sporocilo napake na svoji vrstici (konec dnevnika v opozorilu posla je prirezan).
              r = subprocess.run([shutil.which('pdftoppm') or 'pdftoppm', '-f', '1', '-l', '1', '-singlefile', '-png',
                                  '-scale-to', '160', '--', pdf, os.path.join(d, 'b')], capture_output=True, text=True)
              print('::error::pdftoppm v Flatpaku: koda %s, %s' % (r.returncode, (r.stderr or r.stdout)[-400:].replace('\n', ' | ')))
              sys.exit(1)
          assert open(png, 'rb').read(8) == b'\x89PNG\r\n\x1a\n'
          print('pdftoppm:', shutil.which('pdftoppm'), os.path.getsize(png), 'B')
          PY
          flatpak run --command=python3 io.github.memelandfaner.SafeerOS -c "import zeroconf, qrcode, cryptography; from cryptography.hazmat.primitives.ciphers.aead import AESGCM; AESGCM(AESGCM.generate_key(bit_length=256)); from PySide6.QtWidgets import QApplication, QSystemTrayIcon; from PySide6.QtQuick import QQuickView; import gi; gi.require_version('Gtk', '4.0'); from gi.repository import Gtk"
          # Zagon iz seje Cinnamon (XDG_CURRENT_DESKTOP): Qt ne sme naloziti teme GTK3 v proces z GTK4 - lupina se
          # sicer ne izrise (testni PC 15. 10. 2026, »cannot register existing type 'GtkWidget'«).
          XDG_CURRENT_DESKTOP=X-Cinnamon DESKTOP_SESSION=cinnamon dbus-run-session -- xvfb-run -a flatpak run --env=XDG_CURRENT_DESKTOP=X-Cinnamon --env=DESKTOP_SESSION=cinnamon --command=python3 io.github.memelandfaner.SafeerOS -c "import sys; sys.path.insert(0, '/app/lib/safeer-os'); import gi; gi.require_version('Gtk', '4.0'); from gi.repository import Gtk; from core import os_lupina; assert os_lupina.pripravi(['t']), 'Qt lupina se ni pripravila'; import os; m = {l.split()[-1].rsplit('/', 1)[-1] for l in open('/proc/self/maps')}; g = sorted(x for x in m if x.startswith(('libgtk-3', 'libqgtk3'))); print('GTK3 v procesu:', g, 'XDG_CURRENT_DESKTOP', os.environ.get('XDG_CURRENT_DESKTOP')); assert not g, g; assert os.environ.get('XDG_CURRENT_DESKTOP') == 'X-Cinnamon'"
      - name: AV1 decoder dav1ddec in the GNOME 50 runtime (report only)
        # Paketa .deb nosita dav1ddec sama (posel dav1d-deb); tu le porocilo, ali ga runtime Flatpaka ze ima.
        continue-on-error: true
        run: |
          APP=io.github.memelandfaner.SafeerOS
          flatpak run --command=gst-inspect-1.0 $APP dav1ddec > dav1d.txt 2>&1 && I=da || I="ne ($(tail -1 dav1d.txt))"
          head -20 dav1d.txt
          R="$(flatpak run --command=python3 $APP -c "import gi; gi.require_version('Gst', '1.0'); from gi.repository import Gst; Gst.init(None); n = [(x, Gst.ElementFactory.find(x)) for x in ('dav1ddec', 'av1dec', 'avdec_av1')]; print(' '.join('%s=%s' % (x, '%s(rang %d)' % (f.get_plugin().get_filename(), f.get_rank()) if f else 'NI') for x, f in n))" 2>&1 | tail -1)"
          echo "::notice::Flatpak $APP: gst-inspect-1.0 dav1ddec: $I | $R"
      - name: Shield inside the sandbox of the package that was just built
        # Scit v peskovniku Flatpak, s kodo samega paketa, na pravem systemd-resolved + NetworkManager (tools/scit_lab).
        run: |
          bash tools/scit_lab/lab.sh zgradi
          NACIN=flatpak FLATPAK_GOSTITELJA="$HOME/.local/share/flatpak" KODA_V_PESKOVNIKU=/app/lib/safeer-os \
            PAKET="$(ls "$PWD"/dist/Safeer-OS-*.flatpak)" bash tools/scit_lab/lab.sh preizkus
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: dist/*.flatpak
  flatpak-brskalnik:
    # Safeer Browser (GTK4) z nasim WebKitGTK 6.0 s PGO - isti modul in profil kot Safeer OS (packaging/webkit). flatpak-builder
    # ima ID programa v kljucu predpomnilnika, zato brskalnik WebKit gradi in hrani posebej (vzporedno s poslom flatpak).
    # Kot flatpak: brez veljavnega profila ne tece.
    needs: [webkit-pgo-profil, webkit-pgo-ucenje]
    if: ${{ !cancelled() && needs.webkit-pgo-profil.result == 'success' && (needs.webkit-pgo-ucenje.result == 'success' || (needs.webkit-pgo-ucenje.result == 'skipped' && needs.webkit-pgo-profil.outputs.run_id != '')) }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space for the WebKitGTK build
        # Nas WebKitGTK (packaging/webkit) potrebuje okoli 10 GB za gradnjo; runner jih brez tega nima dovolj.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /
      - name: Install Flatpak toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream-compose desktop-file-utils
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          # Clang/LLVM 22 za WebKitGTK (ThinLTO, packaging/webkit/webkitgtk6-safeer.yml); veja 25.08 = osnova GNOME 50.
          flatpak install --user --noninteractive flathub org.gnome.Platform//50 org.gnome.Sdk//50 org.freedesktop.Sdk.Extension.llvm22//25.08
      - name: PGO profile (training run of this run or the artifact of an earlier one)
        uses: actions/download-artifact@v8
        with:
          name: webkit-pgo-profraw-${{ needs.webkit-pgo-profil.outputs.kljuc }}
          path: build/pgo/profraw
          run-id: ${{ needs.webkit-pgo-profil.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: PGO manifest and cache key
        # Kljuc predpomnilnika: profil (kljuc in vsebina .profraw), commita SDK in llvm22 (oba sta v kljucu flatpak-builderja)
        # in datoteke modulov pred kodo Safeerja. Sprememba samo kode Safeerja ga ne spremeni: WebKit iz predpomnilnika.
        id: pgo
        run: |
          K="$(python3 packaging/webkit/pgo.py kljuc)"
          [ "$K" = "${{ needs.webkit-pgo-profil.outputs.kljuc }}" ] || { echo "::error::kljuc PGO $K ni kljuc profila ${{ needs.webkit-pgo-profil.outputs.kljuc }}"; exit 1; }
          test "$(find build/pgo/profraw -name '*.profraw' -size +1k | wc -l)" -ge 2 || { echo "::error::profil PGO ni popoln"; exit 1; }
          PROFIL="$(cat build/pgo/profraw/*.profraw | sha256sum | cut -c1-12)"
          echo "manifest=$(python3 packaging/webkit/pgo.py uporaba build/pgo/profraw io.github.memelandfaner.SafeerBrowser.yml)" >> "$GITHUB_OUTPUT"
          echo "zacetek=flatpak-brskalnik-pgo-$K-" >> "$GITHUB_OUTPUT"
          echo "predpomnilnik=flatpak-brskalnik-pgo-$K-$PROFIL-$(python3 packaging/webkit/pgo.py okolje)-${{ hashFiles('io.github.memelandfaner.SafeerBrowser.yml', 'packaging/webkit/*.yml', 'packaging/webkit/pgo.py', 'packaging/libsoup/**', 'packaging/zypak/**') }}" >> "$GITHUB_OUTPUT"
      - name: Keep the PGO profile (artifact older than 60 days)
        # Artefakt profila potece po 90 dneh: star profil (isti kljuc) nalozimo znova, da se nespremenjen WebKit ne uci znova.
        if: needs.webkit-pgo-profil.outputs.osvezi == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: webkit-pgo-profraw-${{ needs.webkit-pgo-profil.outputs.kljuc }}
          path: build/pgo/profraw/*.profraw
          if-no-files-found: error
          retention-days: 90
      - name: Restore flatpak-builder cache (WebKitGTK with PGO)
        id: webkit-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .flatpak-builder/cache
            .flatpak-builder/downloads
          key: ${{ steps.pgo.outputs.predpomnilnik }}
          restore-keys: |
            ${{ steps.pgo.outputs.zacetek }}
      - run: python3 packaging/check_version.py
      - name: Safeer Browser Flatpak with PGO WebKitGTK
        env:
          SAFEER_FLATPAK_MANIFEST: ${{ steps.pgo.outputs.manifest }}
        run: |
          set -o pipefail
          bash packaging/build_flatpak.sh 2>&1 | tee "$RUNNER_TEMP/gradnja.log"
          # Kateri moduli so prisli iz predpomnilnika in koliko ga je (omejitev GitHub: 10 GB na repozitorij).
          echo "::notice::flatpak-builder: $(grep -iE 'cache (hit|miss)' "$RUNNER_TEMP/gradnja.log" | paste -sd '|') | predpomnilnik $(du -sh .flatpak-builder/cache .flatpak-builder/downloads | cut -f1 | paste -sd ' ')"
      - name: Save flatpak-builder cache (WebKitGTK with PGO)
        # Takoj po gradnji (tudi ce kasnejsi preizkus pade), da se WebKitGTK ne gradi znova ob vsakem pushu.
        if: always() && steps.webkit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .flatpak-builder/cache
            .flatpak-builder/downloads
          key: ${{ steps.pgo.outputs.predpomnilnik }}
      - name: Unprivileged user namespaces for the WebKit sandbox
        # Kot v poslu mint: spletni proces WebKita v Flatpaku tece v podpeskovniku (flatpak-spawn --sandbox).
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Safeer Browser Flatpak runs on our WebKitGTK, sandboxed
        # Namestimo prav datoteko, ki gre v izdajo. Brskalnik mora teci na nasem WebKitGTK 6.0 (/app), ne na tistem iz
        # runtime-a. Od 1.0.127 je brez izhoda iz peskovnika (brez org.freedesktop.Flatpak, doma, host-os, /app/host-bin):
        # smoke_brskalnik.py izrise stran, prenese datoteko, preveri pot portala za mailto: in Safeer DRM (nadomestni
        # program) zazene v peskovniku prek zypaka ter ga vstavi v okno. Preizkusne skripte so v delovni mapi (pod
        # domom), zato jih zazenemo z dodatnim dovoljenjem samo za branje te mape (--filesystem=...:ro).
        # Napake so vrstice ::error:: (celoten dnevnik posla iz tega okolja ni vedno dosegljiv).
        run: |
          # Ob napaki ukaz in zadnji izpis kot opozorilo posla (dnevniki posla v API niso vedno dosegljivi).
          exec > >(tee "$RUNNER_TEMP/smoke.log") 2>&1
          trap 'sleep 1; python3 -c "import sys; t = open(sys.argv[1], errors=\"replace\").read()[-6000:]; print(\"::error::\" + (sys.argv[2] + \"\\n\" + t).replace(\"%\", \"%25\").replace(\"\\r\", \"\").replace(\"\\n\", \"%0A\"))" "$RUNNER_TEMP/smoke.log" "$BASH_COMMAND"' ERR
          sudo apt-get install -y xvfb dbus x11-utils
          flatpak install --user --noninteractive --bundle dist/Safeer-Browser-*.flatpak
          APP=io.github.memelandfaner.SafeerBrowser
          xvfb-run -a dbus-run-session -- flatpak run $APP --version | tee /dev/stderr | grep -Fx "Safeer Browser $(cat packaging/VERSION)" \
            || { echo "::error::brskalnik --version ne vrne razlicice"; exit 1; }
          flatpak info --show-permissions $APP | tee dovoljenja.txt
          if grep -F 'org.freedesktop.Flatpak' dovoljenja.txt; then echo "::error::brskalnik ima org.freedesktop.Flatpak (izhod iz peskovnika)"; exit 1; fi
          if grep -E '^filesystems=.*(^|[=;])(home|host|host-os|host-etc)(:[a-z]+)?(;|$)' dovoljenja.txt; then echo "::error::brskalnik ima dostop do doma ali gostitelja"; exit 1; fi
          grep -E '^filesystems=.*xdg-download' dovoljenja.txt || { echo "::error::brskalnik nima xdg-download"; exit 1; }
          echo "OK: brez org.freedesktop.Flatpak, brez home/host"
          flatpak run --command=python3 $APP -c "import gi; gi.require_version('WebKit', '6.0'); from gi.repository import WebKit; v = (WebKit.get_major_version(), WebKit.get_minor_version(), WebKit.get_micro_version()); m = open('/proc/self/maps').read(); knj = sorted({l.split()[-1] for l in m.splitlines() if 'libwebkitgtk-6.0' in l}); print('GTK4 knjiznice:', knj, v); assert knj and all(k.startswith('/app/') for k in knj), 'WebKitGTK 6.0 ni iz /app'; print('WebKitGTK 6.0 iz /app', *v)" \
            || { echo "::error::WebKitGTK 6.0 ni iz /app"; exit 1; }
          # libsoup 3.8.0 iz /app (packaging/libsoup): runtime 50 ima 3.6.6 z znanimi ranljivostmi.
          flatpak run --command=python3 $APP -c "import gi; gi.require_version('Soup', '3.0'); gi.require_version('WebKit', '6.0'); from gi.repository import Soup, WebKit; v = (Soup.get_major_version(), Soup.get_minor_version(), Soup.get_micro_version()); m = open('/proc/self/maps').read(); knj = sorted({l.split()[-1] for l in m.splitlines() if 'libsoup-3.0' in l}); print('libsoup:', knj, v); assert knj and all(k.startswith('/app/') for k in knj) and v >= (3, 8, 0), 'libsoup ni 3.8 iz /app'" \
            || { echo "::error::libsoup ni 3.8 iz /app"; exit 1; }
          # WebKit je preveden s Clangom 22, ThinLTO in povezan z lld (zapis gradnje iz modula, .comment flatpak-builder
          # odstrani); velikost knjiznic za primerjavo z gradnjo GCC.
          WK="$(flatpak info --show-location $APP)/files/lib"
          ls -l "$WK"/libwebkitgtk-6.0.so.* "$WK"/libjavascriptcoregtk-6.0.so.*
          echo "::notice::$(stat -L -c '%n %s' "$WK"/libwebkitgtk-6.0.so.4 "$WK"/libjavascriptcoregtk-6.0.so.1 | paste -sd ' ')"
          G="$WK/../share/webkitgtk-safeer/gradnja.txt"
          cat "$G"; echo "::notice::$(paste -sd '|' "$G")"
          grep -q 'clang version 22\.' "$G"
          grep -q '^LTO_MODE:.*=thin$' "$G"
          grep -q '^build.ninja -fuse-ld=lld: [1-9]' "$G"
          # WebKit s profilom (PGO): moznost CMake, -fprofile-use v gradnji in profil s potmi iste gradnje (pgo.py MODUL_IME).
          grep -q '^USE_PGO_PROFILE:BOOL=ON$' "$G" || { echo "::error::brskalnik: WebKit ni preveden s PGO"; exit 1; }
          grep -q '^build.ninja -fprofile-use: [1-9]' "$G" || { echo "::error::brskalnik: v gradnji WebKita ni -fprofile-use"; exit 1; }
          P="$WK/../share/webkitgtk-safeer/profil.txt"
          cat "$P"; echo "::notice::$(paste -sd '|' "$P")"
          grep -Eq '^ *[0-9]+ /run/build/webkitgtk6-safeer-pgo$' "$P" && ! grep '/run/build/' "$P" | grep -v '/run/build/webkitgtk6-safeer-pgo$' \
            || { echo "::error::brskalnik: poti lokalnih funkcij v profilu niso poti gradnje WebKita"; exit 1; }
          flatpak run --command=sh $APP -c "test -x /app/libexec/webkitgtk-6.0/WebKitWebProcess && test -f /app/lib/safeer-browser/assets/safeer_drm/main.js && test ! -e /app/host-bin && test -x /app/bin/zypak-wrapper && test -x /app/bin/zypak-helper" \
            || { echo "::error::v paketu manjka WebKitWebProcess, main.js ali zypak, ali pa je ostal /app/host-bin"; exit 1; }
          # Safeer DRM v paketu (/app, samo za branje), pripet odtis, brez Widevine CDM, obvestila o licencah.
          flatpak run --filesystem="$PWD/packaging:ro" --command=python3 $APP "$PWD/packaging/safeer_drm_paket.py" preveri /app/lib/safeer-browser/safeer-drm \
            || { echo "::error::Safeer DRM v Flatpaku brskalnika ni popoln"; exit 1; }
          flatpak run --command=sh $APP -c "test -f /app/share/doc/safeer-browser/safeer-drm/OBVESTILO.txt" \
            || { echo "::error::v Flatpaku brskalnika ni obvestil o licencah Safeer DRM"; exit 1; }
          # Na ravni enot, v paketu: peskovnik zaznan, Safeer DRM gre na zypak-wrapper, portal (Gtk.UriLauncher,
          # Gtk.FileLauncher, OpenURI) je na voljo, privzeti brskalnik ne kliče gostitelja (navodila).
          flatpak run --command=python3 $APP -c "import sys; sys.path.insert(0, '/app/lib/safeer-browser'); import gi; gi.require_version('Gtk', '4.0'); from gi.repository import Gtk; from core import gostitelj, safeer_drm, default_browser; u = safeer_drm.ukaz_zagona(['/x/safeer-drm']); print('peskovnik', gostitelj.v_peskovniku(), 'DRM', u); assert gostitelj.v_peskovniku() and not gostitelj.sme_na_gostitelja(), 'ni peskovnika'; assert u == ['/app/bin/zypak-wrapper', '/x/safeer-drm'], u; assert hasattr(Gtk, 'UriLauncher') and hasattr(Gtk, 'FileLauncher'); ok, n = default_browser.set_default_browser('/app/lib/safeer-browser', 'sl'); print('privzeti:', ok, n); assert ok or n == [default_browser.navodila('sl')]" \
            || { echo "::error::preverjanje peskovnika na ravni enot ni uspelo"; exit 1; }
          xvfb-run -a dbus-run-session -- flatpak run --filesystem="$PWD/packaging:ro" --command=python3 $APP "$PWD/packaging/smoke_brskalnik.py" /app/lib/safeer-browser \
            || { echo "::error::smoke_brskalnik.py v Flatpaku ni uspel"; exit 1; }
      - name: AV1 decoder dav1ddec in the GNOME 50 runtime (report only)
        # Paketa .deb nosita dav1ddec sama (posel dav1d-deb); tu le porocilo, ali ga runtime Flatpaka ze ima.
        continue-on-error: true
        run: |
          APP=io.github.memelandfaner.SafeerBrowser
          flatpak run --command=gst-inspect-1.0 $APP dav1ddec > dav1d.txt 2>&1 && I=da || I="ne ($(tail -1 dav1d.txt))"
          head -20 dav1d.txt
          R="$(flatpak run --command=python3 $APP -c "import gi; gi.require_version('Gst', '1.0'); from gi.repository import Gst; Gst.init(None); n = [(x, Gst.ElementFactory.find(x)) for x in ('dav1ddec', 'av1dec', 'avdec_av1')]; print(' '.join('%s=%s' % (x, '%s(rang %d)' % (f.get_plugin().get_filename(), f.get_rank()) if f else 'NI') for x, f in n))" 2>&1 | tail -1)"
          echo "::notice::Flatpak $APP: gst-inspect-1.0 dav1ddec: $I | $R"
      - name: Real Safeer DRM (castLabs Electron) inside the browser sandbox
        # Safeer DRM iz paketa (/app), zagnan po poti Spleta (zypak-wrapper): knjiznice, nalaganje strani, podpeskovnik
        # procesov strani (seccomp), Widevine CDM, ki ga ECS sam namesti z Googla v uporabnikovo mapo, in EME. Glej
        # packaging/smoke_drm_peskovnik.py.
        run: |
          xvfb-run -a dbus-run-session -- flatpak run --filesystem="$PWD/packaging:ro" --command=python3 io.github.memelandfaner.SafeerBrowser "$PWD/packaging/smoke_drm_peskovnik.py" /app/lib/safeer-browser 2>&1 | tee drm.txt || true
          grep '^FAIL: ' drm.txt | while read -r v; do echo "::error::Safeer DRM: ${v#FAIL: }"; done || true
          # Vse diagnostike v eni opombi (GitHub pokaze najvec 10 opomb na korak; %0A = nova vrstica), nato kljucne.
          echo "::notice title=Safeer DRM diagnostika::$(grep -E '^(krog|zypak:|v peskovniku|Safeer DRM v paketu|uporabnikova mapa|EME|ZYPAK|Traceback|  File|[A-Za-z]+Error)' drm.txt | tail -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          grep -E '^(ldd|EME|krog 1: (procesi|Widevine))' drm.txt | head -8 | while read -r v; do echo "::notice::${v}"; done || true
          grep -qx PASS drm.txt
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-brskalnik
          path: dist/Safeer-Browser-*.flatpak
  scit-lab:
    # Scit spreminja sistemsko nastavitev DNS. Enotni testi ne vidijo, kako se systemd-resolved in NetworkManager
    # obnasata v resnici - in prav tam so bile napake do Safeer OS 0.4.42 (izklop je pustil racunalnik brez DNS).
    # Ta posel zato Scit pozene na pravih: dva vsebnika, »usmerjevalnik« in »racunalnik« (tools/scit_lab).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build the lab images
        run: bash tools/scit_lab/lab.sh zgradi
      - name: Shield against a real systemd-resolved and NetworkManager
        run: bash tools/scit_lab/lab.sh preizkus
  release:
    # Beta oznake (v1.0.128-beta.1) gredo v posel beta-izdaja (osnutek predizdaje), nikoli v stabilno izdajo.
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-beta.')
    needs: [brskalnik, safeer-os, qt-xcb, flatpak, flatpak-brskalnik, scit-lab, mint]
    runs-on: ubuntu-24.04
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      # Vrata izdaje (20. 10. 2026, »pravila namesto navodil«): brez zapisa neodvisnega pregleda drugega ponudnika
      # (docs/pregledi/<oznaka>.md) in z odprtimi kriticnimi/visokimi najdbami izdaja ne nastane.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Independent review by another vendor (tools/preveri_pregled.py)
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: python3 tools/preveri_pregled.py "$TAG" "$SHA"
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Both Flatpaks (WebKitGTK with PGO) are present
        # Zgradila in preverila (USE_PGO_PROFILE, -fprofile-use, profil) sta ju posla flatpak in flatpak-brskalnik; brez
        # katerega od njiju izdaja ne nastane.
        run: ls -l artifacts/flatpak/Safeer-OS-*-x86_64.flatpak artifacts/flatpak-brskalnik/Safeer-Browser-*-x86_64.flatpak
      - name: Every Linux .deb is present (WebKit built in)
        # Od 20. 10. 2026 je WebKit vgrajen v safeer-browser, safeer-os (namizno okolje) in safeer-os-app (aplikacija);
        # paketa safeer-webkit (artefakt posla webkit-deb) uporabniki ne prenesejo vec, zato ne gre v izdajo.
        run: ls -l artifacts/brskalnik/safeer-browser_*_amd64.deb artifacts/safeer-os/safeer-os_*_amd64.deb artifacts/safeer-os/safeer-os-app_*_amd64.deb
      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release
          # Vsak artefakt je v svoji mapi.
          find artifacts -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.flatpak' \) ! -name 'safeer-webkit_*' -exec mv -t release {} +
          (cd release && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          # A tag push gets a draft with the packages attached. A published release is final: its files
          # are the ones that were tested and whose checksums are in the update manifest, so a re-run of
          # this job (or any other trigger) must never replace them.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "Safeer Browser $TAG" --notes 'Linux packages. Complete the desktop acceptance checklist before publishing.'
          fi
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "Release $TAG is already published; its packages are not replaced."
            exit 0
          fi
          gh release upload "$TAG" release/* --clobber
  beta-izdaja:
    # Beta kanal (lastnik, 18. 10. 2026: »manjse in pogostejse izdaje za navdusence«, docs/BETA.md): oznaka vX.Y.Z-beta.N
    # dobi OSNUTEK PREDIZDAJE (draft + prerelease) z istimi paketi in po istih preizkusih kot stabilna. Nic se ne objavi
    # samo: objavo naredi lastnik. Predizdaje GitHub ne steje za »latest« (preizkus nadgradnje v poslu mint in povezave na
    # zadnjo izdajo ostanejo na stabilni), Safeer OS pa jo ponudi samo uporabnikom z vklopljenim Beta kanalom - in sele,
    # ko je beta seznam (razlicice-beta.json, tools/beta_seznam.py) podpisan in na safeer.si.
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-beta.')
    needs: [brskalnik, safeer-os, qt-xcb, flatpak, flatpak-brskalnik, scit-lab, mint]
    runs-on: ubuntu-24.04
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Beta tag shape (vX.Y.Z-beta.N)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]] || { echo "::error::beta oznaka mora biti vX.Y.Z-beta.N: $TAG"; exit 1; }
      # Vrata izdaje (20. 10. 2026, »pravila namesto navodil«): brez zapisa neodvisnega pregleda drugega ponudnika
      # (docs/pregledi/<oznaka>.md) in z odprtimi kriticnimi/visokimi najdbami izdaja ne nastane.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Independent review by another vendor (tools/preveri_pregled.py)
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: python3 tools/preveri_pregled.py "$TAG" "$SHA"
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Both Flatpaks (WebKitGTK with PGO) are present
        run: ls -l artifacts/flatpak/Safeer-OS-*-x86_64.flatpak artifacts/flatpak-brskalnik/Safeer-Browser-*-x86_64.flatpak
      - name: Every Linux .deb is present (WebKit built in)
        run: ls -l artifacts/brskalnik/safeer-browser_*_amd64.deb artifacts/safeer-os/safeer-os_*_amd64.deb artifacts/safeer-os/safeer-os-app_*_amd64.deb
      - name: Attach packages to the beta pre-release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.flatpak' \) ! -name 'safeer-webkit_*' -exec mv -t release {} +
          (cd release && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --prerelease --verify-tag --title "Safeer $TAG (beta)" \
              --notes 'Beta (pre-release) Linux packages for the Safeer beta channel. Not for general use. Complete the desktop acceptance checklist before publishing; then sign the beta list (docs/BETA.md).'
          fi
          # Beta paketi nikoli v izdajo, ki ni predizdaja (ta bi postala »latest« za vse uporabnike).
          if [ "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" != "true" ]; then
            echo "::error::izdaja $TAG ni predizdaja - beta paketov ne pripnemo"; exit 1
          fi
          # Objavljena izdaja je dokoncna: njene datoteke so preizkusene in v podpisanem beta seznamu.
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "Release $TAG is already published; its packages are not replaced."
            exit 0
          fi
          gh release upload "$TAG" release/* --clobber
