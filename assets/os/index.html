<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Safeer OS</title>
<link rel="stylesheet" href="os.css">
</head>
<body>
<div id="ozadje"></div>
<div id="aplikacija">
  <aside id="stranska">
    <div class="znamka">
      <img src="znak.svg" alt="">
      <div><b>Safeer OS</b><span data-t="podnaslov"></span></div>
      <button class="gumb-ikona skrci-vrstico" id="gumbVrstica" aria-expanded="true"><svg data-ikona="vrstica"></svg></button>
    </div>
    <nav id="meni">
      <button data-razdelek="domov" class="izbran"><svg data-ikona="domov"></svg><span data-t="domov"></span></button>
      <button data-razdelek="media"><svg data-ikona="glasba"></svg><span data-t="mediji"></span></button>
      <button data-razdelek="naprave"><svg data-ikona="povezava"></svg><span>Safeer Link</span></button>
      <button data-razdelek="sporocila"><svg data-ikona="sporocila"></svg><span data-t="sporocila"></span></button>
      <button data-razdelek="programi"><svg data-ikona="programi"></svg><span data-t="programi"></span></button>
      <button data-razdelek="datoteke"><svg data-ikona="mapa"></svg><span data-t="datoteke"></span></button>
      <button data-razdelek="splet"><svg data-ikona="splet"></svg><span data-t="splet"></span></button>
      <button data-razdelek="zapiski"><svg data-ikona="datoteka"></svg><span data-t="zapiski"></span></button>
      <button data-razdelek="nastavitve"><svg data-ikona="drsniki"></svg><span data-t="nastavitve"></span></button>
    </nav>
    <div class="stranska-dno">
      <div class="uporabnik">
        <div class="zacetnica" id="zacetnica">S</div>
        <div class="ime"><b id="imeUporabnika"></b><span id="imeRacunalnika"></span></div>
        <button class="gumb-ikona" id="gumbNapajanje" data-naslov="napajanje"><svg data-ikona="napajanje"></svg></button>
      </div>
      <div class="poganja"><span data-t="poganja"></span><b><svg data-ikona="povezava"></svg>Safeer Link</b></div>
    </div>
  </aside>

  <main id="glavno">
    <header id="vrh">
      <label class="iskanje">
        <svg data-ikona="isci"></svg>
        <input id="iskanje" type="text" autocomplete="off" spellcheck="false" data-ph="isci">
        <kbd data-t="tipkaj"></kbd>
      </label>
      <div class="presledek"></div>
      <button class="stanje" id="gumbStanje">
        <span id="stanjePovezava"><i class="pika siva"></i><span data-t="brezNaprav"></span></span>
        <span id="stanjeOmrezje"></span>
        <span id="stanjeZvok"></span>
        <span id="stanjeBaterija"></span>
      </button>
      <div class="ura"><b id="ura">--:--</b><span id="datum"></span></div>
    </header>

    <div id="vsebina">
      <!-- DOMOV -->
      <section class="razdelek viden" id="r-domov">
        <h1 id="pozdrav"></h1>
        <p data-t="pozdravPod"></p>
        <div class="velike">
          <button class="velika" id="kBrskalnik"><svg data-ikona="splet"></svg><div><b data-t="brskalnik"></b><span data-t="brskalnikPod"></span></div><svg class="puscica" data-ikona="desno"></svg></button>
          <button class="velika" data-pojdi="media"><svg data-ikona="video"></svg><div><b data-t="mediji"></b><span data-t="medijiPod"></span></div><svg class="puscica" data-ikona="desno"></svg></button>
          <button class="velika" data-pojdi="datoteke"><svg data-ikona="mapa"></svg><div><b data-t="datoteke"></b><span data-t="datotekePod"></span></div><svg class="puscica" data-ikona="desno"></svg></button>
          <button class="velika" data-pojdi="naprave"><svg data-ikona="naprave"></svg><div><b data-t="naprave"></b><span id="kNapravePod" data-t="napravePodNov"></span></div><svg class="puscica" data-ikona="desno"></svg></button>
        </div>
        <h2><span data-t="nedavnoUporabljeno"></span><button class="dodatno" data-pojdi="programi" data-t="vsiProgrami"></button></h2>
        <div class="vrsta-plosc" id="domaciProgrami"></div>
        <div id="blokOkna" hidden>
          <h2><span data-t="odprtoZdaj"></span></h2>
          <div class="okna" id="okna"></div>
        </div>
        <div class="plosce">
          <div class="plosca-dom">
            <button class="glava-plosce" data-pojdi="naprave"><b data-t="povezaneNaprave"></b><svg data-ikona="desno"></svg></button>
            <div class="vrstica-naprave"><svg data-ikona="naprave"></svg><div><b data-t="taRacunalnik"></b><span id="domNapravaStanje"><i class="pika siva"></i><span data-t="niPovezano"></span></span></div></div>
            <p class="drobno" id="domNapraveOpis" data-t="napraveVControl"></p>
            <button class="gumb" id="domControl"><svg data-ikona="qr"></svg><span id="domControlBesedilo" data-t="poveziNaprave"></span></button>
          </div>
          <div class="plosca-dom">
            <div class="glava-plosce"><b data-t="hitriDostop"></b></div>
            <div class="hitri" id="hitriDostop"></div>
          </div>
          <div class="plosca-dom">
            <button class="glava-plosce" data-pojdi="nastavitve"><b data-t="sistem"></b><svg data-ikona="desno"></svg></button>
            <div class="sistem-vrstica"><svg data-ikona="namizje"></svg><div><b id="sistemIme">Linux Mint</b><span id="sistemRacunalnik"></span></div></div>
            <dl class="sistem-podatki" id="sistemPodatki"></dl>
          </div>
        </div>
        <div id="blokNedavne" hidden>
          <h2><span data-t="nedavneDatoteke"></span><button class="dodatno" id="gumbNedavnePocistiDomov" data-t="pocistiSeznam"></button><button class="dodatno" data-pojdi="datoteke" data-t="vseDatoteke"></button></h2>
          <div class="vrstice" id="nedavneDomov"></div>
        </div>
      </section>

      <!-- SPOROCILA -->
      <section class="razdelek" id="r-sporocila">
        <div class="sporocila-glava">
          <div><h1 data-t="sporocila"></h1><p data-t="sporocilaOpis"></p></div>
          <div class="gumbi-glave"><button class="gumb" id="sporocilaPisi"><svg data-ikona="povezava"></svg><span data-t="pisiNapravi"></span></button>
          <button class="gumb glavni" id="sporocilaDodaj"><svg data-ikona="plus"></svg><span data-t="dodajKanal"></span></button></div>
        </div>
        <div class="filtri" id="sporocilaFiltri">
          <button class="izbran" data-kanal="" data-t="vsiKanali"></button>
          <button data-kanal-vrsta="email" data-t="eposta"></button>
          <button data-kanal-vrsta="chatwoot">Chatwoot</button>
          <button data-kanal-vrsta="safeer">Safeer Link</button>
        </div>
        <div class="kanali-seznam" id="sporocilaKanali"></div>
        <div class="sporocila-postavitev">
          <div class="pogovori-seznam" id="sporocilaSeznam"><p class="prazno" data-t="niPogovorov"></p></div>
          <div class="pogovor-okno">
            <div class="pogovor-naslov" id="sporocilaNaslov" data-t="izberiPogovor"></div>
            <div class="pogovor-vsebina" id="sporocilaVsebina"></div>
            <form class="sporocila-vnos" id="sporocilaVnos">
              <textarea id="sporocilaBesedilo" rows="2" data-ph="napisiSporocilo" disabled></textarea>
              <button class="gumb glavni" type="submit" disabled><svg data-ikona="poslji"></svg><span data-t="posljiSporocilo"></span></button>
            </form>
          </div>
        </div>
      </section>

      <!-- SAFEER MEDIA -->
      <section class="razdelek" id="r-media">
        <div class="media-glava">
          <div><span class="media-kicker">SAFEER OS / MEDIA</span><h1 data-t="mediji"></h1><p data-t="medijiOpis"></p></div>
          <div class="media-glava-dejanja">
            <button class="gumb glavni" id="medijiMapa"><svg data-ikona="mapa"></svg><span data-t="dodajMapoMedijev"></span></button>
            <button class="gumb" id="medijiLokalno"><svg data-ikona="datoteka"></svg><span data-t="dodajLokalno"></span></button>
            <button class="gumb" id="medijiTok"><svg data-ikona="radio"></svg><span data-t="dodajTok"></span></button>
            <button class="gumb" id="medijiDodaj"><svg data-ikona="plus"></svg><span data-t="dodajMedijskiVir"></span></button>
          </div>
        </div>
        <div class="media-orodna">
          <div class="media-kategorije" id="mediaKategorije" role="tablist" aria-label="Media"></div>
          <label class="razdelek-iskanje media-iskalnik"><svg data-ikona="isci"></svg><input id="mediaIskanje" type="search" autocomplete="off" data-ph="isciMedije"></label>
        </div>
        <div class="media-hero">
          <div class="media-hero-vsebina">
            <span class="media-kicker" data-t="mediaMojaZbirka"></span>
            <h2 id="mediaHeroNaslov" data-t="mediaHeroNaslov"></h2>
            <p id="mediaHeroOpis" data-t="mediaHeroOpis"></p>
            <button class="gumb glavni" id="mediaHeroDejanje"><svg data-ikona="plus"></svg><span data-t="dodajMapoMedijev"></span></button>
          </div>
          <div class="media-hero-grafika" aria-hidden="true"><span class="media-orbita a"></span><span class="media-orbita b"></span><span class="media-orbita c"></span><span class="media-znak">♫</span></div>
        </div>
        <div class="media-postavitev">
          <div class="media-glavni">
            <div class="media-naslov-vrstice"><div><span class="media-kicker" data-t="mediaLokalno"></span><h2 id="mediaNaslovZbirke" data-t="mediaTvojaZbirka"></h2></div><div class="media-knjiznica-dejanja"><span class="media-stevec" id="mediaStevec"></span><button class="media-osvezi" id="mediaOsvezi" type="button" data-naslov="mediaOsvezi" aria-label="Refresh library" disabled><svg data-ikona="ponovno"></svg></button></div></div>
            <div class="media-knjiznica" id="mediaMreza"></div>
            <div class="media-prazno" id="mediaPrazno" hidden>
              <div class="media-prazno-ikona"><svg data-ikona="glasba"></svg></div>
              <b id="mediaPraznoNaslov" data-t="mediaPraznoNaslov"></b><span id="mediaPraznoOpis" data-t="mediaPraznoOpis"></span>
              <button class="gumb" id="medijiDodajPrazno"><svg data-ikona="mapa"></svg><span data-t="dodajMapoMedijev"></span></button>
            </div>
            <button class="gumb media-vec" id="mediaVec" data-t="mediaNaloziVec" hidden></button>
            <div class="media-naslov-vrstice media-tokovi-glava" id="mediaTokoviGlava" hidden><div><span class="media-kicker" data-t="mediaShranjeniTokovi"></span><h2 data-t="mediaTvojePostaje"></h2></div></div>
            <div class="media-viri" id="mediaTokovi" hidden></div>
            <div class="media-naslov-vrstice media-vire-glava"><div><span class="media-kicker" data-t="mediaPovezaniViri"></span><h2 data-t="mediaTvojiViri"></h2></div></div>
            <div class="media-viri" id="mediaViri"></div>
            <div class="media-naslov-vrstice media-odkrij-glava"><div><span class="media-kicker" data-t="mediaSvet"></span><h2 data-t="mediaOdkrij"></h2></div></div>
            <div class="media-odkrij" id="mediaOdkrij"></div>
          </div>
          <aside class="media-desni">
            <div class="media-sedaj"><span class="media-kicker" data-t="mediaSedaj"></span><div class="media-sedaj-art" id="mediaSedajArt">♫</div><h3 id="mediaSedajNaslov" data-t="mediaNicesar"></h3><p id="mediaSedajPod" data-t="mediaSedajNamig"></p><button class="gumb" id="mediaOdpriOkno" data-t="mediaOdpriVideo" hidden></button></div>
            <div class="media-cakalna"><div class="media-cakalna-glava"><h3 data-t="mediaCakalna"></h3><span id="mediaCakalnaStevec"></span></div><div id="mediaVrsta" class="media-vrsta"></div></div>
          </aside>
        </div>
      </section>

      <!-- ZAPISKI: lokalni zapiski z @-omembami datotek, programov in drugih zapiskov. -->
      <section class="razdelek" id="r-zapiski">
        <h1 data-t="zapiski"></h1>
        <p data-t="zapiskiOpis"></p>
        <div class="zapiski-postavitev">
          <div class="zapiski-seznam">
            <button class="gumb" id="zapisekNov" data-t="zapisekNov"></button>
            <label class="media-iskanje"><svg data-ikona="isci"></svg><input id="zapiskiIskanje" type="search" data-ph="zapiskiIsci"></label>
            <div id="zapiskiVrstice"></div>
          </div>
          <div class="zapisek-urejevalnik" id="zapisekUrejevalnik" hidden>
            <div class="zapisek-glava">
              <input id="zapisekNaslov" type="text" maxlength="160" data-ph="zapisekNaslov">
              <button class="gumb" id="zapisekPogled" type="button" data-t="zapisekPogled"></button>
              <button class="gumb" id="zapisekPripni" type="button" data-t="zapisekPripni"></button>
              <button class="gumb" id="zapisekIzbrisi" type="button" data-t="zapisekIzbrisi"></button>
            </div>
            <textarea id="zapisekBesedilo" spellcheck="true" data-ph="zapisekPisi"></textarea>
            <div class="zapisek-prikaz" id="zapisekPrikaz" hidden></div>
            <div class="zapisek-omembe-okno" id="zapisekOmembeOkno" hidden></div>
            <div class="zapisek-noga">
              <div><h3 data-t="zapisekViri"></h3><div class="zapisek-cipi" id="zapisekViri"></div></div>
              <div><h3 data-t="zapisekPovratne"></h3><div class="zapisek-cipi" id="zapisekPovratne"></div></div>
              <span class="namig" id="zapisekStanje"></span>
            </div>
          </div>
        </div>
      </section>

      <!-- PROGRAMI -->
      <section class="razdelek" id="r-programi">
        <h1 data-t="programi"></h1>
        <p id="programiPod"></p>
        <label class="razdelek-iskanje"><svg data-ikona="isci"></svg><input id="programiIskanje" type="search" autocomplete="off" data-ph="isciPrograme"></label>
        <div class="filtri naprave-filtri" id="filtriNaprav" hidden></div>
        <div class="filtri" id="filtri"></div>
        <div class="mreza" id="vsiProgrami"></div>
      </section>

      <!-- DATOTEKE -->
      <section class="razdelek" id="r-datoteke">
        <h1 data-t="datoteke"></h1>
        <p data-t="datotekeOpis"></p>
        <label class="razdelek-iskanje"><svg data-ikona="isci"></svg><input id="datotekeIskanje" type="search" autocomplete="off" data-ph="isciDatoteke"></label>
        <div class="datoteke-postavitev">
          <div class="mape-seznam" id="mapeSeznam"></div>
          <div>
            <div class="drobtine" id="drobtine"></div>
            <div class="vrstice" id="vsebinaMape"></div>
          </div>
        </div>
      </section>

      <!-- NAPRAVE -->
      <section class="razdelek" id="r-naprave">
        <h1>Safeer Link</h1>
        <p data-t="napraveOpis"></p>
        <label class="razdelek-iskanje"><svg data-ikona="isci"></svg><input id="napraveIskanje" type="search" autocomplete="off" data-ph="isciNaprave"></label>
        <div class="panel">
          <h3><i class="pika siva" id="napravePika"></i><span id="napraveNaslov"></span></h3>
          <p id="napraveBesedilo"></p>
          <p class="namig" id="napraveNamig" hidden></p>
          <div class="gumbi-naprav">
            <button class="gumb glavni" id="gumbControl"><svg data-ikona="qr"></svg><span id="gumbControlBesedilo"></span></button>
            <button class="gumb" id="gumbOdjava" hidden><svg data-ikona="odjava"></svg><span id="gumbOdjavaBesedilo"></span></button>
          </div>
        </div>
        <div class="hitre zaupanje" id="blokZaupanje" hidden>
          <button class="stikalo" id="stikaloZaupaj" role="switch" aria-checked="false"><svg data-ikona="scit"></svg><div><span data-t="zaupajRacunalniku"></span><small id="zaupajPod"></small></div><i></i></button>
        </div>
        <div class="panel" id="blokSeznamNaprav" hidden>
          <h3><span data-t="seznamNaprav"></span></h3>
          <ul class="seznam-naprav" id="seznamNaprav"></ul>
          <p class="namig" id="seznamNapravNamig"></p>
        </div>
        <div class="zmoznosti">
          <div class="zmoznost"><svg data-ikona="poslji"></svg><span data-t="zmoznost1"></span></div>
          <div class="zmoznost"><svg data-ikona="zaslon"></svg><span data-t="zmoznost2"></span></div>
          <div class="zmoznost"><svg data-ikona="daljinec"></svg><span data-t="zmoznost3"></span></div>
          <div class="zmoznost"><svg data-ikona="programi"></svg><span data-t="zmoznost4"></span></div>
        </div>
      </section>

      <!-- OMREZJE (iz Nastavitev in iz vrstice stanja) -->
      <section class="razdelek" id="r-omrezje">
        <button class="gumb nazaj" id="gumbOmrezjeNazaj"><svg data-ikona="nazaj"></svg><span data-t="nastavitve"></span></button>
        <h1 data-t="o_omrezje"></h1>
        <p data-t="omrezjeOpis"></p>
        <h2 data-t="trenutnaPovezava"></h2>
        <div class="vrstice" id="omrezjeTrenutno"></div>
        <div class="hitre omrezje-stikala">
          <button class="stikalo" id="stikaloWifiOmrezje" role="switch" aria-checked="false"><svg data-ikona="wifi"></svg><div><span>Wi-Fi</span><small id="omrezjeStanje"></small></div><i></i></button>
        </div>
        <div id="blokWifi" hidden>
          <h2><span data-t="wifiOmrezja"></span><button class="dodatno" id="gumbOmrezjeOsvezi" data-t="osvezi"></button></h2>
          <div class="vrstice" id="omrezjaSeznam"></div>
        </div>
        <div id="blokShranjene" hidden>
          <h2 data-t="shranjenePovezave"></h2>
          <div class="vrstice" id="omrezjaShranjena"></div>
        </div>
        <button class="stikalo napredno" id="gumbOmrezjeNapredno" hidden><svg data-ikona="drsniki"></svg><div><span data-t="napredno"></span><small data-t="naprednoPod"></small></div></button>
      </section>

      <!-- ZVOK (iz Nastavitev, iz vrstice stanja in z desnim klikom na zvocnik v vrstici) -->
      <section class="razdelek" id="r-zvok">
        <button class="gumb nazaj" id="gumbZvokNazaj"><svg data-ikona="nazaj"></svg><span data-t="nastavitve"></span></button>
        <h1 data-t="m_sound"></h1>
        <p data-t="zvokOpis"></p>
        <h2 data-t="zvokIzhod"></h2>
        <div class="vrstice zvok-izbira" id="zvokIzhodi"></div>
        <div class="zvok-glasnost" id="zvokGlasnostIzhoda"></div>
        <div id="blokZvokLink">
          <h2><span data-t="zvokNaNapravi"></span></h2>
          <p class="drobno" data-t="zvokNaNapraviOpis"></p>
          <div class="vrstice zvok-izbira" id="zvokLink"></div>
          <div class="zvok-jbl" id="zvokJbl"></div>
        </div>
        <div id="blokZvokProgrami" hidden>
          <h2 data-t="zvokProgrami"></h2>
          <div class="vrstice" id="zvokProgrami"></div>
        </div>
        <div id="blokZvokVhod" hidden>
          <h2 data-t="zvokVhod"></h2>
          <div class="vrstice zvok-izbira" id="zvokVhodi"></div>
          <div class="zvok-glasnost" id="zvokGlasnostVhoda"></div>
        </div>
        <button class="stikalo napredno" id="gumbZvokNapredno" hidden><svg data-ikona="drsniki"></svg><div><span data-t="napredno"></span><small data-t="zvokNaprednoPod"></small></div></button>
      </section>

      <!-- SPLET: naslov ali iskanje se vedno odpre skozi Safeerjev vgrajeni pogled. -->
      <section class="razdelek" id="r-splet">
        <div class="splet-zacetek">
          <div class="splet-oznaka"><i class="pika"></i> SAFEER BROWSER</div>
          <h1 data-t="spletNaslov"></h1>
          <p data-t="spletOpis"></p>
          <form class="splet-iskalnik" id="spletIskalnik">
            <svg data-ikona="isci"></svg>
            <input id="spletVnos" type="text" autocomplete="off" spellcheck="false" data-ph="spletVnos">
            <button class="gumb glavni" type="submit" data-t="spletIsci"></button>
          </form>
          <div class="splet-hitro-glava"><h2 data-t="spletneAplikacije"></h2><span data-t="spletOdpre"></span></div>
          <div class="splet-hitro" id="spletneAplikacije"></div>
          <div class="splet-zasebnost"><svg data-ikona="scit"></svg><span><b data-t="spletZascita"></b><small data-t="spletZascitaOpis"></small></span></div>
        </div>
      </section>

      <!-- NASTAVITVE -->
      <section class="razdelek" id="r-nastavitve">
        <h1 data-t="nastavitve"></h1>
        <p data-t="nastavitveOpis"></p>
        <h2 data-t="hitreNastavitve"></h2>
        <div class="hitre" id="hitreNastavitve"></div>
        <h2 data-t="scit"></h2>
        <div class="hitre" id="blokScit"></div>
        <h2>Safeer OS</h2>
        <div class="hitre">
          <button class="stikalo" id="stikaloCelozaslonsko" role="switch" aria-checked="true"><svg data-ikona="celozaslonsko"></svg><div><span data-t="celozaslonsko"></span><small data-t="celozaslonskoPod"></small></div><i></i></button>
          <button class="stikalo" id="gumbNamizje"><svg data-ikona="namizje"></svg><div><span data-t="pokaziNamizje"></span><small data-t="pokaziNamizjePod"></small></div></button>
          <button class="stikalo" id="stikaloSamozagon" role="switch" aria-checked="false"><svg data-ikona="ponovno"></svg><div><span data-t="samozagon"></span><small data-t="samozagonPod"></small></div><i></i></button>
          <button class="stikalo" id="gumbNazajVMint"><svg data-ikona="odjava"></svg><div><span data-t="nazajVMint"></span><small data-t="nazajVMintPod"></small></div></button>
        </div>
        <div id="skupineNastavitev"></div>
        <p class="o-sistemu" id="oSistemu"></p>
      </section>
    </div>

    <div id="mediaPlayerBar" class="media-player-bar" hidden>
      <button class="media-player-art" id="mediaBarOdpri" type="button" aria-label="Open player">♫</button>
      <div class="media-player-meta"><b id="mediaBarNaslov"></b><span id="mediaBarVrsta"></span></div>
      <div class="media-player-komande">
        <button id="mediaBarPrejsnja" type="button" aria-label="Previous">⏮</button>
        <button id="mediaBarPremor" type="button" aria-label="Pause">Ⅱ</button>
        <button id="mediaBarNaslednja" type="button" aria-label="Next">⏭</button>
      </div>
      <span id="mediaBarCas" class="media-player-cas">0:00</span>
      <input id="mediaBarNapredek" type="range" min="0" max="1000" value="0" aria-label="Playback position">
      <span id="mediaBarTrajanje" class="media-player-cas">0:00</span>
      <button id="mediaBarUstavi" class="media-player-stop" type="button" aria-label="Stop">■</button>
    </div>

    <footer id="noga">
      <span><kbd data-t="tipkaKlik"></kbd><span data-t="odpri"></span></span>
      <span><kbd>Esc</kbd><span data-t="domov"></span></span>
      <span><kbd>F11</kbd><span data-t="celozaslonsko"></span></span>
      <span class="podpis" data-t="podpis"></span>
    </footer>
  </main>
</div>

<!-- Iskanje -->
<div class="sloj" id="slojIskanje"><div class="tancica"></div><div class="plosca zadetki" id="zadetki"></div></div>
<!-- Hitre nastavitve -->
<div class="sloj" id="slojHitro"><div class="tancica"></div><div class="plosca" id="hitro"></div></div>
<!-- Napajanje -->
<div class="sloj" id="slojNapajanje"><div class="tancica"></div><div class="plosca" id="napajanje"></div></div>
<!-- Dodaj spletno aplikacijo -->
<div class="sloj" id="slojDodaj"><div class="tancica"></div>
  <form class="plosca" id="obrazecDodaj">
    <h3 data-t="dodajSpletno"></h3>
    <input id="dodajIme" data-ph="imeAplikacije" maxlength="40">
    <input id="dodajNaslov" data-ph="naslovAplikacije" maxlength="300">
    <label class="dodaj-medijska-vrsta" id="dodajMedijskaVrstaPolje" hidden><span data-t="mediaVrstaVira"></span>
      <select id="dodajMedijskaVrsta">
        <option value="video" data-t="media_video"></option><option value="glasba" data-t="media_glasba"></option>
        <option value="filmi" data-t="media_filmi"></option><option value="serije" data-t="media_serije"></option>
        <option value="tv" data-t="media_tv"></option><option value="radio" data-t="media_radio"></option>
      </select>
    </label>
    <p class="drobno" data-t="dodajNamig"></p>
    <div class="gumbi"><button type="button" class="gumb" id="dodajPreklici" data-t="preklici"></button><button type="submit" class="gumb glavni" data-t="dodaj"></button></div>
  </form>
</div>
<!-- Uporabnikov neposredni TV ali radijski tok -->
<div class="sloj" id="slojMediaTok"><div class="tancica"></div>
  <form class="plosca media-tok-obrazec" id="obrazecMediaTok">
    <span class="media-kicker">SAFEER MEDIA</span>
    <h3 data-t="mediaDodajPostajo"></h3>
    <p class="drobno" data-t="mediaTokNamig"></p>
    <label><span data-t="mediaImePostaje"></span><input id="mediaTokIme" required maxlength="80" autocomplete="off" data-ph="mediaImePostaje"></label>
    <label><span data-t="mediaVrstaPostaje"></span><select id="mediaTokVrsta"><option value="tv" data-t="media_tv"></option><option value="radio" data-t="media_radio"></option></select></label>
    <label><span data-t="mediaNaslovToka"></span><input id="mediaTokUrl" type="url" required maxlength="2048" autocomplete="off" placeholder="https://example.org/live.m3u8"></label>
    <div class="gumbi"><button type="button" class="gumb" id="mediaTokPreklici" data-t="preklici"></button><button class="gumb glavni" type="submit" data-t="mediaShraniPredvajaj"></button></div>
  </form>
</div>
<!-- Kanal: ponovni vnos gesla ali odstranitev -->
<div class="sloj" id="slojKanalUredi"><div class="tancica"></div>
  <form class="plosca kanal-carovnik" id="obrazecKanalUredi">
    <h3 id="kanalUrediNaslov"></h3>
    <p class="drobno" id="kanalUrediOpis"></p>
    <input id="kanalUrediGeslo" type="password" autocomplete="current-password" data-ph="gesloAplikacije">
    <div class="gumbi"><button type="button" class="gumb" id="kanalOdstrani" data-t="odstraniKanal"></button><button type="button" class="gumb" id="kanalUrediPreklici" data-t="preklici"></button><button class="gumb glavni" type="submit" data-t="povezi"></button></div>
  </form>
</div>

<!-- Safeer Chat: izbira naprave v Linku -->
<div class="sloj" id="slojPisi"><div class="tancica"></div>
  <div class="plosca kanal-carovnik">
    <h3 data-t="pisiNapravi"></h3>
    <div class="pisi-naprave" id="pisiNaprave"></div>
    <div class="gumbi"><button type="button" class="gumb" id="pisiPreklici" data-t="preklici"></button></div>
  </div>
</div>

<!-- Dodaj komunikacijski kanal -->
<div class="sloj" id="slojKanal"><div class="tancica"></div>
  <form class="plosca kanal-carovnik" id="obrazecKanal">
    <h3 data-t="dodajKanal"></h3>
    <div class="filtri" id="kanalVrstaIzbira"><button type="button" class="izbran" data-vrsta="email" data-t="eposta"></button><button type="button" data-vrsta="chatwoot">Chatwoot</button></div>
    <input type="hidden" id="kanalVrsta" value="email">
    <div id="kanalEmail">
      <input id="kanalNaslov" type="email" autocomplete="username" data-ph="epostniNaslov">
      <div class="dva"><input id="kanalImap" placeholder="IMAP"><input id="kanalSmtp" placeholder="SMTP"></div>
      <input id="kanalGeslo" type="password" autocomplete="current-password" data-ph="gesloAplikacije">
      <p class="drobno" id="kanalNamig" hidden></p>
    </div>
    <div id="kanalChatwoot" hidden>
      <input id="kanalUrl" type="url" placeholder="https://chatwoot.example">
      <input id="kanalRacun" type="number" min="1" data-ph="stevilkaRacuna">
      <input id="kanalZeton" type="password" autocomplete="off" data-ph="apiZeton">
    </div>
    <p class="kanal-napaka" id="kanalNapaka" role="alert" hidden></p>
    <p class="drobno" data-t="skrivnostOpis"></p>
    <div class="gumbi"><button type="button" class="gumb" id="kanalPreklici" data-t="preklici"></button><button class="gumb glavni" type="submit" id="kanalPovezi" data-t="povezi"></button></div>
  </form>
</div>
<!-- Nazaj v Linux Mint -->
<div class="sloj" id="slojMint"><div class="tancica"></div>
  <div class="plosca">
    <h3 data-t="nazajVMint"></h3>
    <p class="drobno" data-t="nazajOpis"></p>
    <div class="gumbi">
      <button type="button" class="gumb" id="mintPreklici" data-t="preklici"></button>
      <button type="button" class="gumb" id="mintZaStalno" data-t="zaStalno"></button>
      <button type="button" class="gumb glavni" id="mintSamoTokrat" data-t="samoTokrat"></button>
    </div>
  </div>
</div>
<div id="obvestilo"></div>
<script src="besedila.js"></script>
<script src="iskanje.js"></script>
<script src="os.js"></script>
</body>
</html>
