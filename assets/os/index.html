<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file: data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Safeer OS</title>
<link rel="stylesheet" href="os.css">
<link rel="stylesheet" href="katalog.css">
</head>
<body>
<div id="ozadje"></div>
<div id="aplikacija">
  <aside id="stranska">
    <div class="znamka">
      <img src="znak.svg" alt="">
      <div><b>Safeer OS</b><span data-t="podnaslov"></span></div>
      <button class="gumb-ikona skrci-vrstico" id="gumbVrstica" aria-expanded="true"><svg data-ikona="vrstica"></svg></button>
    </div>
    <nav id="meni">
      <button data-razdelek="domov" class="izbran"><svg data-ikona="domov"></svg><span data-t="domov"></span></button>
      <button data-razdelek="media"><svg data-ikona="glasba"></svg><span data-t="mediji"></span></button>
      <button data-razdelek="naprave"><svg data-ikona="povezava"></svg><span>Safeer Link</span></button>
      <button data-razdelek="sporocila"><svg data-ikona="sporocila"></svg><span data-t="sporocila"></span></button>
      <button data-razdelek="programi"><svg data-ikona="programi"></svg><span data-t="programi"></span></button>
      <button data-razdelek="datoteke"><svg data-ikona="mapa"></svg><span data-t="datoteke"></span></button>
      <button data-razdelek="splet"><svg data-ikona="splet"></svg><span data-t="splet"></span></button>
      <button data-razdelek="zapiski"><svg data-ikona="datoteka"></svg><span data-t="zapiski"></span></button>
      <button data-razdelek="nastavitve"><svg data-ikona="drsniki"></svg><span data-t="nastavitve"></span></button>
    </nav>
    <div class="stranska-dno">
      <button class="skrij-vrstico" id="gumbSkrijVrstico"><svg data-ikona="vrstica"></svg><span data-t="vrsticaSkrij"></span></button>
      <div class="uporabnik">
        <div class="zacetnica" id="zacetnica">S</div>
        <div class="ime"><b id="imeUporabnika"></b><span id="imeRacunalnika"></span></div>
        <button class="gumb-ikona" id="gumbNapajanje" data-naslov="napajanje"><svg data-ikona="napajanje"></svg></button>
      </div>
      <div class="poganja"><span data-t="poganja"></span><b><svg data-ikona="povezava"></svg>Safeer Link</b></div>
    </div>
  </aside>

  <button class="rocaj-vrstice" id="rocajVrstice"></button>
  <main id="glavno">
    <header id="vrh">
      <label class="iskanje">
        <svg data-ikona="isci"></svg>
        <input id="iskanje" type="text" autocomplete="off" spellcheck="false" data-ph="isci">
        <kbd data-t="tipkaj"></kbd>
      </label>
      <div class="presledek"></div>
      <button class="stanje" id="gumbStanje">
        <span id="stanjePovezava"><i class="pika siva"></i><span data-t="brezNaprav"></span></span>
        <span id="stanjeOmrezje"></span>
        <span id="stanjeZvok"></span>
        <span id="stanjeBaterija"></span>
      </button>
      <div class="ura"><b id="ura">--:--</b><span id="datum"></span></div>
    </header>

    <div id="vsebina">
      <!-- DOMOV -->
      <section class="razdelek viden" id="r-domov">
        <h1 id="pozdrav"></h1>
        <p data-t="pozdravPod"></p>
        <div class="hitre" id="domPosodobitev" hidden>
          <button class="stikalo" id="domPosodobitevGumb"><svg data-ikona="ponovno"></svg><div><span id="domPosodobitevNaslov"></span><small data-t="posodobitevDomPod"></small></div></button>
        </div>
        <div class="velike">
          <button class="velika" id="kBrskalnik"><svg data-ikona="splet"></svg><div><b data-t="brskalnik"></b><span data-t="brskalnikPod"></span></div><svg class="puscica" data-ikona="desno"></svg></button>
          <button class="velika" data-pojdi="media"><svg data-ikona="video"></svg><div><b data-t="mediji"></b><span data-t="medijiPod"></span></div><svg class="puscica" data-ikona="desno"></svg></button>
          <button class="velika" data-pojdi="datoteke"><svg data-ikona="mapa"></svg><div><b data-t="datoteke"></b><span data-t="datotekePod"></span></div><svg class="puscica" data-ikona="desno"></svg></button>
          <button class="velika" data-pojdi="naprave"><svg data-ikona="naprave"></svg><div><b data-t="naprave"></b><span id="kNapravePod" data-t="napravePodNov"></span></div><svg class="puscica" data-ikona="desno"></svg></button>
        </div>
        <h2><span data-t="nedavnoUporabljeno"></span><button class="dodatno" data-pojdi="programi" data-t="vsiProgrami"></button></h2>
        <div class="vrsta-plosc" id="domaciProgrami"></div>
        <div id="blokOkna" hidden>
          <h2><span data-t="odprtoZdaj"></span></h2>
          <div class="okna" id="okna"></div>
        </div>
        <div class="plosce">
          <div class="plosca-dom">
            <button class="glava-plosce" data-pojdi="naprave"><b data-t="povezaneNaprave"></b><svg data-ikona="desno"></svg></button>
            <div class="vrstica-naprave"><svg data-ikona="naprave"></svg><div><b data-t="taRacunalnik"></b><span id="domNapravaStanje"><i class="pika siva"></i><span data-t="niPovezano"></span></span></div></div>
            <p class="drobno" id="domNapraveOpis" data-t="napraveVControl"></p>
            <button class="gumb" id="domControl"><svg data-ikona="qr"></svg><span id="domControlBesedilo" data-t="poveziNaprave"></span></button>
          </div>
          <div class="plosca-dom">
            <div class="glava-plosce"><b data-t="hitriDostop"></b></div>
            <div class="hitri" id="hitriDostop"></div>
          </div>
          <div class="plosca-dom">
            <button class="glava-plosce" data-pojdi="nastavitve"><b data-t="sistem"></b><svg data-ikona="desno"></svg></button>
            <div class="sistem-vrstica"><svg data-ikona="namizje"></svg><div><b id="sistemIme">Linux Mint</b><span id="sistemRacunalnik"></span></div></div>
            <dl class="sistem-podatki" id="sistemPodatki"></dl>
          </div>
        </div>
        <div id="blokNedavne" hidden>
          <h2><span data-t="nedavneDatoteke"></span><button class="dodatno" id="gumbNedavnePocistiDomov" data-t="pocistiSeznam"></button><button class="dodatno" data-pojdi="datoteke" data-t="vseDatoteke"></button></h2>
          <div class="vrstice" id="nedavneDomov"></div>
        </div>
      </section>

      <!-- SPOROCILA -->
      <section class="razdelek" id="r-sporocila">
        <div class="sporocila-glava">
          <div><h1 data-t="sporocila"></h1><p data-t="sporocilaOpis"></p></div>
          <div class="gumbi-glave"><button class="gumb glavni" id="sporocilaNovo"><svg data-ikona="sporocilo"></svg><span data-t="novoSporocilo"></span></button>
          <button class="gumb" id="sporocilaPisi"><svg data-ikona="povezava"></svg><span data-t="pisiNapravi"></span></button>
          <button class="gumb" id="sporocilaDodaj"><svg data-ikona="plus"></svg><span data-t="dodajKanal"></span></button></div>
        </div>
        <!-- Nabiralnik: mape in kanali | pogovori z iskanjem in filtri | pogovor + stranski pano z osebo -->
        <div class="nabiralnik">
          <aside class="nabiralnik-mape">
            <div class="mape" id="sporocilaMape">
              <button class="izbran" data-mapa="vse"><svg data-ikona="sporocila"></svg><span data-t="mapaPrejeto"></span><i id="stPrejeto" hidden></i></button>
              <button data-mapa="neprebrano"><svg data-ikona="sporocila"></svg><span data-t="mapaNeprebrano"></span><i id="stNeprebrano" hidden></i></button>
              <button data-mapa="poslano"><svg data-ikona="poslji"></svg><span data-t="mapaPoslano"></span></button>
              <button data-mapa="vsi"><svg data-ikona="arhiv"></svg><span data-t="mapaVsiPogovori"></span></button>
              <button data-mapa="osnutki"><svg data-ikona="uredi"></svg><span data-t="mapaOsnutki"></span><i id="stOsnutki" hidden></i></button>
            </div>
            <b class="nabiralnik-naslov" data-t="oznakeNaslov"></b>
            <div class="mape oznake-mape" id="sporocilaOznake"></div>
            <b class="nabiralnik-naslov" data-t="kanaliNaslov"></b>
            <div class="kanali-seznam" id="sporocilaKanali"></div>
          </aside>
          <div class="nabiralnik-seznam">
            <label class="ciljno-iskanje sporocila-iskanje"><svg data-ikona="isci"></svg><input id="sporocilaIskanje" type="search" autocomplete="off" data-ph="isciSporocila"></label>
            <div class="filtri" id="sporocilaFiltri">
              <button class="izbran" data-kanal-vrsta="" data-t="vsiKanali"></button>
              <button data-kanal-vrsta="email" data-t="eposta"></button>
              <button data-kanal-vrsta="klepet" data-t="filterKlepeti"></button>
            </div>
            <div class="pogovori-seznam" id="sporocilaSeznam"><p class="prazno" data-t="niPogovorov"></p></div>
          </div>
          <div class="pogovor-okno">
            <div class="pogovor-naslov"><div class="pogovor-naslov-besedilo"><b id="sporocilaNaslov" data-t="izberiPogovor"></b><small id="sporocilaPodnaslov"></small></div>
              <button class="gumb-ikona" id="sporocilaPano" type="button" hidden title=""><svg data-ikona="sporocilo"></svg></button></div>
            <div class="pogovor-telo">
              <div class="pogovor-vsebina" id="sporocilaVsebina"></div>
              <aside class="pogovor-pano" id="sporocilaPanoVsebina" hidden>
                <div class="pano-oseba"><span class="pano-avatar" id="panoAvatar"></span><b id="panoIme"></b><small id="panoPrivzeto"></small><small id="panoKanal"></small>
                  <div class="pano-gumbi"><button type="button" class="gumb" id="panoPreimenuj" data-t="panoPreimenuj"></button><button type="button" class="gumb" id="panoZdruzi" data-t="panoZdruzi"></button></div></div>
                <div class="pano-skupina"><b data-t="panoOznake"></b><div class="oznake-cipi" id="panoOznake"></div>
                  <form class="oznaka-vnos" id="panoOznakaObrazec"><input id="panoOznakaVnos" list="seznamOznak" maxlength="40" data-ph="panoNovaOznaka"><datalist id="seznamOznak"></datalist><button type="submit" class="gumb">+</button></form></div>
                <div class="pano-skupina"><b data-t="panoIskanje"></b>
                  <input id="panoIskanjeVnos" type="search" autocomplete="off" data-ph="panoIskanjePh"><div class="pano-zadetki" id="panoZadetki"></div></div>
                <div class="pano-skupina"><b data-t="panoIdentitete"></b><div id="panoIdentitete"></div></div>
                <div class="pano-skupina"><b data-t="panoPriponke"></b><div id="panoPriponke"><p class="drobno" data-t="panoNiPriponk"></p></div></div>
              </aside>
            </div>
            <form class="sporocila-vnos" id="sporocilaVnos">
              <textarea id="sporocilaBesedilo" rows="2" data-ph="napisiSporocilo" disabled></textarea>
              <button class="gumb glavni" type="submit" disabled><svg data-ikona="poslji"></svg><span data-t="posljiSporocilo"></span></button>
            </form>
          </div>
        </div>
      </section>

      <!-- SAFEER MEDIA -->
      <section class="razdelek" id="r-media">
        <div class="media-glava">
          <div><span class="media-kicker">SAFEER OS / MEDIA</span><h1 data-t="mediji"></h1><p data-t="medijiOpis"></p></div>
          <!-- Lastnik, 14. 10. 2026: en glavni gumb »Dodaj« z menijem vseh nacinov dodajanja; ob njem le dve kompaktni
               dejanji (nadaljevanje z druge naprave, nacin za kavc). Prej je bilo v glavi osem enakovrednih gumbov. -->
          <div class="media-glava-dejanja">
            <button class="gumb" id="medijiDisk" type="button" hidden><svg data-ikona="disk"></svg><span id="medijiDiskIme" data-t="predvajajDisk"></span></button>
            <button class="media-ikona-gumb" id="medijiPredaja" type="button" data-naslov="mediaPredaja"><svg data-ikona="naprave"></svg></button>
            <button class="media-ikona-gumb" id="medijiKavc" type="button" aria-pressed="false"><svg data-ikona="daljinec"></svg></button>
            <div class="media-dodaj">
              <button class="gumb glavni" id="medijiDodajMeniGumb" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="medijiDodajMeni"><svg data-ikona="plus"></svg><span data-t="mediaDodaj"></span></button>
              <div class="media-dodaj-meni" id="medijiDodajMeni" role="menu" hidden>
                <button role="menuitem" type="button" id="medijiMapa" tabindex="-1"><svg data-ikona="mapa"></svg><span><b data-t="dodajMapoMedijev"></b><small data-t="mediaDodajMapaOpis"></small></span></button>
                <button role="menuitem" type="button" id="medijiLokalno" tabindex="-1"><svg data-ikona="datoteka"></svg><span><b data-t="dodajLokalno"></b><small data-t="mediaDodajLokalnoOpis"></small></span></button>
                <button role="menuitem" type="button" id="medijiTok" tabindex="-1"><svg data-ikona="radio"></svg><span><b data-t="dodajTok"></b><small data-t="mediaDodajTokOpis"></small></span></button>
                <button role="menuitem" type="button" id="medijiDodaj" tabindex="-1"><svg data-ikona="splet"></svg><span><b data-t="dodajMedijskiVir"></b><small data-t="mediaDodajSpletOpis"></small></span></button>
                <button role="menuitem" type="button" id="medijiMagnet" tabindex="-1"><svg data-ikona="povezava"></svg><span><b data-t="magnet"></b><small data-t="mediaDodajMagnetOpis"></small></span></button>
                <button role="menuitem" type="button" id="medijiDodatki" tabindex="-1"><svg data-ikona="program"></svg><span><b data-t="katDodatki"></b><small data-t="mediaDodajDodatkiOpis"></small></span></button>
              </div>
            </div>
          </div>
        </div>
        <!-- Namizna postavitev (lastnik, 14. 10. 2026, skica Safeer Playerja): levo navpicna navigacija (Domov, vrste vsebin,
             pod »Viri« uporabnikovi pravi viri), desno vsebina z iskanjem na vrhu. Ozek prostor (Medijski center ozji od 980 px,
             v Safeer Playerju okno pod ~1100 px): navigacija se skrije, ostanejo vodoravni zavihki (#mediaKategorije). Odloca
             sirina Medijskega centra (@container), ne okna - enako v glavnem oknu s stransko vrstico in v Safeer Playerju. -->
        <div class="media-telo">
          <!-- Skrita leva navigacija (lastnik, 14. 10. 2026): tanek rocaj na levem robu jo pokaze spet (kot stranska vrstica). -->
          <button class="media-nav-rocaj" id="mediaNavRocaj" type="button" aria-controls="mediaNav"></button>
          <nav class="media-nav" id="mediaNav">
            <div class="media-nav-glava">
              <button class="gumb-ikona media-nav-skrci" id="mediaNavSkrci" type="button" aria-controls="mediaNav" aria-expanded="true"><svg data-ikona="vrstica"></svg></button>
            </div>
            <div class="media-nav-kategorije" id="mediaNavKategorije" role="tablist" aria-orientation="vertical"></div>
            <div class="media-nav-viri" id="mediaNavViri" hidden>
              <h2 class="media-nav-naslov" id="mediaNavViriNaslov" data-t="mediaViriNaslov"></h2>
              <div class="media-nav-seznam" id="mediaNavViriSeznam" role="list" aria-labelledby="mediaNavViriNaslov"></div>
            </div>
            <!-- Skrij, kar uporabnik ne potrebuje (lastnik, 14. 10. 2026): plosca s potrditvenimi polji za zavihke in vire. -->
            <button class="media-nav-prilagodi" id="mediaNavPrilagodi" type="button" aria-haspopup="dialog" aria-controls="slojPrilagodi"><svg data-ikona="drsniki"></svg><span data-t="mediaPrilagodiMeni"></span></button>
            <button class="media-nav-prilagodi media-nav-skrij" id="mediaNavSkrij" type="button" aria-controls="mediaNav"><svg data-ikona="x"></svg><span data-t="mediaNavSkrij"></span></button>
          </nav>
          <div class="media-vsebina">
        <div class="media-orodna">
          <div class="media-kategorije" id="mediaKategorije" role="tablist"></div>
          <label class="razdelek-iskanje media-iskalnik"><svg data-ikona="isci"></svg><input id="mediaIskanje" type="search" autocomplete="off" data-ph="isciMedije"></label>
        </div>
        <div class="media-postavitev">
          <div class="media-glavni">
            <!-- Domov: junak z eno pravo vsebino (prva iz »Nadaljuj«, sicer nazadnje dodana) - samo resnicni podatki vnosa. -->
            <section class="media-junak media-domov-del" id="mediaJunak" aria-labelledby="mediaJunakNaslov" hidden></section>
            <!-- Samodejni seznami (core/samodejni_seznami.py): na Domov in na vrhu Glasbe, samo seznami z dovolj skladbami. -->
            <section class="media-samodejni media-domov-del" id="mediaSamodejni" aria-labelledby="mediaSamodejniNaslov" hidden></section>
            <!-- Osebne police (lastnik, 14. 10. 2026): Nadaljuj, Nazadnje dodano, Najvec predvajano, Priljubljene - samo
                 tiste z vsebino in samo na zavihkih, kjer imajo smisel (core/os_police.py). Na Domov se vsa vrsta z
                 »Vse →« odpre v svojem zavihku. -->
            <div class="media-police media-domov-del" id="mediaPolice" hidden></div>
            <div class="media-naslov-vrstice"><div><span class="media-kicker" data-t="mediaLokalno"></span><h2 id="mediaNaslovZbirke" data-t="mediaTvojaZbirka"></h2></div><div class="media-knjiznica-dejanja"><span class="media-stevec" id="mediaStevec"></span><button class="media-osvezi" id="mediaNapraveGumb" type="button" data-naslov="mediaNaprave" aria-label="Devices"><svg data-ikona="naprave"></svg></button><button class="media-osvezi" id="mediaMapeGumb" type="button" data-naslov="mediaMape" aria-label="Folders"><svg data-ikona="mapa"></svg></button><button class="media-osvezi" id="mediaOsvezi" type="button" data-naslov="mediaOsvezi" aria-label="Refresh library" disabled><svg data-ikona="ponovno"></svg></button></div></div>
            <div class="media-knjiznica" id="mediaMreza"></div>
            <div class="media-prazno media-domov-del" id="mediaPrazno" hidden>
              <div class="media-prazno-ikona" id="mediaPraznoZnak"><svg data-ikona="glasba"></svg></div>
              <b id="mediaPraznoNaslov" data-t="mediaPraznoNaslov"></b><span id="mediaPraznoOpis" data-t="mediaPraznoOpis"></span>
              <button class="gumb glavni" id="medijiDodajPrazno" type="button"><svg data-ikona="mapa"></svg><span data-t="dodajMapoMedijev"></span></button>
            </div>
            <button class="gumb media-vec" id="mediaVec" data-t="mediaNaloziVec" hidden></button>
            <!-- KATALOG: filmi, serije, glasba, radio, TV v živo, seznami predvajanja in dodatki (isto jedro kot Windows). -->
            <div class="kat" id="katalog" hidden>
              <!-- Glava kataloga: naslov s stevilom vsebin, nato vse izbire na enem mestu - razvrstitev, jezik vsebine (edino
                   mesto za jezik) in viri. Dodajanje dodatkov in virov je v meniju »Dodaj« v glavi (lastnik, 14. 10. 2026). -->
              <div class="media-naslov-vrstice kat-glava">
                <div class="kat-naslov"><h2 id="katNaslov"></h2><span class="kat-povzetek" id="mediaPovzetek" aria-live="polite"></span></div>
                <div class="kat-orodja">
                  <label class="kat-razvrsti"><span data-t="katRazvrsti"></span><select id="mediaRazvrsti"></select></label>
                  <label class="kat-jezik" id="mediaJezikPolje" hidden><select id="mediaJezik"></select></label>
                  <div class="kat-filter-viri">
                    <button class="gumb" id="mediaViriFilterGumb" type="button" aria-expanded="false" aria-controls="mediaViriFilter"></button>
                    <div class="kat-viri-filter" id="mediaViriFilter" hidden>
                      <div class="kat-viri-filter-seznam" id="mediaViriFilterSeznam"></div>
                      <div class="kat-viri-filter-noga"><small data-t="katViriZacasno"></small><button class="gumb" id="mediaViriFilterPonastavi" type="button" data-t="katVklopiVse"></button></div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="kat-zanri" id="mediaZanri" role="group" hidden></div>
              <div class="kat-seznami" id="mediaSeznami" hidden></div>
              <!-- Glasba s tega racunalnika je del kataloga Glasba (lastnik, 11. 10. 2026), ne svoj razdelek nad njim. -->
              <div class="kat-lokalna-glasba" id="katLokalnaGlasba" hidden></div>
              <div class="kat-knjiznica" id="mediaKnjiznica" hidden></div>
              <div class="kat-katalog" id="katMreza"></div>
              <!-- Ob koncu mreze se sama nalozi naslednja stran (kot v predvajalnikih Plex in Spotify), brez gumbov za strani. -->
              <div class="kat-nalaganje" id="katNalaganje" hidden><span class="kat-vrtavka" aria-hidden="true"></span><span id="katNalaganjeBesedilo"></span><button class="gumb" id="katNalaganjeZnova" type="button" data-t="katPoskusiZnova" hidden></button></div>
              <div class="kat-prazno" id="katPrazno" hidden><p class="drobno" id="katPraznoBesedilo"></p><button class="gumb" id="katPraznoDejanje" type="button" hidden></button></div>
            </div>
            <div class="media-naslov-vrstice media-tokovi-glava" id="mediaTokoviGlava" hidden><div><span class="media-kicker" data-t="mediaShranjeniTokovi"></span><h2 data-t="mediaTvojePostaje"></h2></div></div>
            <div class="media-viri" id="mediaTokovi" hidden></div>
            <div class="media-naslov-vrstice media-vire-glava"><div><span class="media-kicker" data-t="mediaPovezaniViri"></span><h2 data-t="mediaTvojiViri"></h2></div></div>
            <div class="media-viri" id="mediaViri"></div>
            <div class="media-naslov-vrstice media-odkrij-glava"><div><span class="media-kicker" data-t="mediaSvet"></span><h2 data-t="mediaOdkrij"></h2></div></div>
            <div class="media-odkrij" id="mediaOdkrij"></div>
          </div>
        </div>
          </div>
        </div>
      </section>

      <!-- ZAPISKI: lokalni zapiski z @-omembami datotek, programov in drugih zapiskov. -->
      <section class="razdelek" id="r-zapiski">
        <h1 data-t="zapiski"></h1>
        <p data-t="zapiskiOpis"></p>

  <button class="galerija-gumb desno" id="galerijaNaprej" type="button" data-naslov="mediaNaslednjaSlika" aria-label="Next"><svg data-ikona="desno"></svg></button>
  <div class="galerija-orodja">
    <button class="gumb" id="galerijaOdpri" type="button"><span data-t="mediaOdpriVAplikaciji"></span></button>
    <button class="galerija-zapri" id="galerijaZapri" type="button" data-naslov="zapri" aria-label="Close"><svg data-ikona="x"></svg></button>
  </div>
</div>
<!-- Uporabnikov neposredni TV ali radijski tok -->
<div class="sloj" id="slojMediaTok"><div class="tancica"></div>
  <form class="plosca media-tok-obrazec" id="obrazecMediaTok">
    <span class="media-kicker">SAFEER MEDIA</span>
    <h3 data-t="mediaDodajPostajo"></h3>
    <p class="drobno" data-t="mediaTokNamig"></p>
    <label><span data-t="mediaImePostaje"></span><input id="mediaTokIme" required maxlength="80" autocomplete="off" data-ph="mediaImePostaje"></label>
    <label><span data-t="mediaVrstaPostaje"></span><select id="mediaTokVrsta"><option value="tv" data-t="media_tv"></option><option value="radio" data-t="media_radio"></option></select></label>
    <label><span data-t="mediaNaslovToka"></span><input id="mediaTokUrl" type="url" required maxlength="2048" autocomplete="off" placeholder="https://example.org/live.m3u8"></label>
    <div class="gumbi"><button type="button" class="gumb" id="mediaTokPreklici" data-t="preklici"></button><button class="gumb glavni" type="submit" data-t="mediaShraniPredvajaj"></button></div>
  </form>
</div>
<!-- Kanal: ponovni vnos gesla ali odstranitev -->
<div class="sloj" id="slojKanalUredi"><div class="tancica"></div>
  <form class="plosca kanal-carovnik" id="obrazecKanalUredi">
    <h3 id="kanalUrediNaslov"></h3>
    <p class="drobno" id="kanalUrediOpis"></p>
    <input id="kanalUrediGeslo" type="password" autocomplete="current-password" data-ph="gesloAplikacije">
    <div class="gumbi"><button type="button" class="gumb" id="kanalOdstrani" data-t="odstraniKanal"></button><button type="button" class="gumb" id="kanalUrediPreklici" data-t="preklici"></button><button class="gumb glavni" type="submit" data-t="povezi"></button></div>
  </form>
</div>

<!-- Novo e-sporocilo ali osnutek (lastnik, 14. 10. 2026: v Sporocilih je manjkalo) -->
<div class="sloj" id="slojNovo"><div class="tancica"></div>
  <form class="plosca kanal-carovnik novo-sporocilo" id="obrazecNovo">
    <h3 data-t="novoSporocilo"></h3>
    <label class="drobno"><span data-t="novoOd"></span><select id="novoOd"></select></label>
    <input id="novoZa" type="email" autocomplete="email" data-ph="novoZa" required>
    <input id="novoZadeva" type="text" autocomplete="off" data-ph="novoZadeva" maxlength="300">
    <textarea id="novoBesedilo" rows="14" data-ph="napisiSporocilo" required></textarea>
    <p class="drobno" id="novoNapaka" hidden></p>
    <div class="gumbi"><button type="button" class="gumb" id="novoOdstrani" data-t="odstraniOsnutek" hidden></button><button type="button" class="gumb" id="novoPreklici" data-t="preklici"></button><button type="button" class="gumb" id="novoOsnutek" data-t="shraniOsnutek"></button><button class="gumb glavni" type="submit" data-t="posljiSporocilo"></button></div>
  </form>
</div>

<!-- Safeer Chat: izbira naprave v Linku -->
<div class="sloj" id="slojPisi"><div class="tancica"></div>
  <div class="plosca kanal-carovnik">
    <h3 data-t="pisiNapravi"></h3>
    <div class="pisi-naprave" id="pisiNaprave"></div>
    <div class="gumbi"><button type="button" class="gumb" id="pisiPreklici" data-t="preklici"></button></div>
  </div>
</div>

<!-- Dodaj komunikacijski kanal -->
<div class="sloj" id="slojKanal"><div class="tancica"></div>
  <form class="plosca kanal-carovnik" id="obrazecKanal">
    <h3 data-t="dodajKanal"></h3>
    <div class="filtri" id="kanalVrstaIzbira"><button type="button" class="izbran" data-vrsta="email" data-t="eposta"></button><button type="button" data-vrsta="chatwoot">Chatwoot</button><button type="button" data-vrsta="aplikacije" data-t="kanalAplikacije"></button><button type="button" data-vrsta="api" data-t="kanalLastniApi"></button></div>
    <input type="hidden" id="kanalVrsta" value="email">
    <input type="hidden" id="kanalPonudnik" value="">
    <!-- E-posta, korak 1: ponudnik s seznama (streznike pozna Safeer) -->
    <div id="kanalPonudniki">
      <p class="drobno" data-t="kanalKjeImas"></p>
      <div class="ponudniki-mreza" id="kanalPonudnikiMreza"></div>
    </div>
    <!-- E-posta, korak 2: naslov + geslo + navodila -->
    <div id="kanalEmail" hidden>
      <button type="button" class="gumb kanal-nazaj" id="kanalZamenjaj" data-t="kanalDrugPonudnik"></button>
      <input id="kanalNaslov" type="email" autocomplete="username" data-ph="epostniNaslov">
      <input id="kanalGeslo" type="password" autocomplete="current-password" data-ph="gesloAplikacije">
      <button type="button" class="gumb" id="kanalNapredno" data-t="kanalNapredno"></button>
      <div class="dva" id="kanalStrezniki" hidden><input id="kanalImap" placeholder="IMAP"><input id="kanalSmtp" placeholder="SMTP"></div>
      <div class="kanal-navodila"><b data-t="kanalKajNarediti"></b><p id="kanalNavodila"></p>
        <button type="button" class="gumb glavni kanal-stran-gesla" id="kanalStranGesla" data-t="kanalStranGesla" hidden></button></div>
    </div>
    <div id="kanalChatwoot" hidden>
      <input id="kanalUrl" type="url" placeholder="https://chatwoot.example">
      <input id="kanalRacun" type="number" min="1" data-ph="stevilkaRacuna">
      <input id="kanalZeton" type="password" autocomplete="off" data-ph="apiZeton">
    </div>
    <!-- Lastni API: uporabnik ima zeton svoje aplikacije (Matrix / Telegram Bot) - odprti protokoli, brez licenc -->
    <div id="kanalApi" hidden>
      <p class="drobno" data-t="kanalLastniApiOpis"></p>
      <div class="filtri" id="kanalApiProtokol"><button type="button" class="izbran" data-protokol="matrix">Matrix</button><button type="button" data-protokol="telegram_bot">Telegram Bot</button></div>
      <input type="hidden" id="kanalProtokol" value="matrix">
      <input id="kanalApiStreznik" type="text" autocomplete="off" placeholder="https://matrix.org">
      <input id="kanalApiZeton" type="password" autocomplete="off" data-ph="apiZeton">
      <input id="kanalApiIme" type="text" maxlength="60" data-ph="kanalApiIme">
      <div class="kanal-navodila"><b data-t="kanalKajNarediti"></b><p id="kanalApiNavodila"></p></div>
    </div>
    <!-- Aplikacije: ponudniki brez IMAP/SMTP in klepeti - uradna spletna aplikacija ali uradna stran za prenos -->
    <div id="kanalAplikacijeSeznam" hidden>
      <p class="drobno" data-t="kanalAplikacijeOpis"></p>
      <div id="kanalAplikacijeMreza"></div>
    </div>
    <p class="kanal-napaka" id="kanalNapaka" role="alert" hidden></p>
    <p class="drobno" id="kanalSkrivnostOpis" data-t="skrivnostOpis"></p>
    <div class="gumbi"><button type="button" class="gumb" id="kanalPreklici" data-t="preklici"></button><button class="gumb glavni" type="submit" id="kanalPovezi" data-t="povezi"></button></div>
  </form>
</div>
<!-- Nazaj v Linux Mint -->
<div class="sloj" id="slojMint"><div class="tancica"></div>
  <div class="plosca">
    <h3 data-t="nazajVMint"></h3>
    <p class="drobno" data-t="nazajOpis"></p>
    <div class="gumbi">
      <button type="button" class="gumb" id="mintPreklici" data-t="preklici"></button>
      <button type="button" class="gumb" id="mintZaStalno" data-t="zaStalno"></button>
      <button type="button" class="gumb glavni" id="mintSamoTokrat" data-t="samoTokrat"></button>
    </div>
  </div>
</div>
<!-- Katalog Medijskega centra: podrobnosti filma ali serije, meni »na seznam«, dodatki in viri. -->
<div class="kat-podrobnosti" id="mediaPodrobnosti" hidden>
  <div class="kat-podrobnosti-glava">
    <button class="gumb" id="mediaPodrobnostiNazaj" type="button">← <span data-t="nazaj"></span></button>
    <button class="gumb-ikona" id="mediaPodrobnostiZapri" type="button" data-naslov="zapri"><svg data-ikona="x"></svg></button>
  </div>
  <div class="kat-podrobnosti-junak" id="mediaPodrobnostiJunak"></div>
  <section class="kat-kje-gledati" id="mediaWatchProviders" aria-live="polite"></section>
  <h3 id="mediaSezoneNaslov"></h3><div class="kat-sezone" id="mediaSezone"></div>
  <h3 id="mediaEpizodeNaslov"></h3><div class="kat-epizode" id="mediaEpizode"></div>
</div>
<div class="kat-seznam-meni" id="mediaSeznamMeni" hidden></div>
<!-- Meni kartice: desni klik, tipka Meni ali Shift+F10, na igralnem plosku Y (srcek, ogledano). -->
<div class="kat-meni-kartice" id="mediaKarticaMeni" role="menu" hidden></div>
<!-- Naslednja epizoda: po koncu epizode Safeer ponudi naslednjo in jo po odstevanju zacne sam (kot Jellyfin). -->
<div class="media-naslednja" id="naslEpPlosca" role="dialog" aria-labelledby="naslEpNaslov" aria-describedby="naslEpPod" hidden>
  <div class="media-naslednja-slika" id="naslEpSlika" aria-hidden="true"></div>
  <div class="media-naslednja-besedilo"><small data-t="naslednjaNaslov"></small><b id="naslEpNaslov"></b><span id="naslEpPod"></span><span class="media-naslednja-cas" id="naslEpCas"></span></div>
  <div class="media-naslednja-gumbi"><button class="gumb glavni" id="naslEpZdaj" type="button" data-t="naslednjaZdaj"></button><button class="gumb" id="naslEpNe" type="button" data-t="naslednjaNeZdaj"></button></div>
</div>
<!-- Oseba: preimenuj / zdruzi z drugo osebo -->
<div class="sloj" id="slojOseba"><div class="tancica"></div>
  <form class="plosca kanal-carovnik" id="obrazecOseba">
    <h3 id="osebaNaslov"></h3>
    <p class="drobno" id="osebaOpis"></p>
    <input id="osebaIme" type="text" maxlength="80" autocomplete="off">
    <select id="osebaIzbira" hidden></select>
    <div class="gumbi"><button type="button" class="gumb" id="osebaPreklici" data-t="preklici"></button><button class="gumb glavni" type="submit" id="osebaPotrdi" data-t="shrani"></button></div>
  </form>
</div>
<div class="spor-meni" id="sporocilaMeni" role="menu" hidden></div>
<div class="sloj" id="slojKatViri"><div class="tancica"></div>
  <div class="plosca kat-viri-plosca" role="dialog" aria-modal="true" aria-labelledby="katViriNaslov">
    <span class="media-kicker">SAFEER MEDIA</span>
    <h3 id="katViriNaslov" data-t="katDodatki"></h3>
    <p class="drobno" data-t="katDodatkiOpis"></p>
    <!-- Najhitrejsa pot do dodatkov Stremio (lastnik, 11. 10. 2026): imenik dodatkov, gumb Install doda dodatek sem;
         aplikacije Stremio ni treba namestiti. -->
    <div class="kat-stremio-pot">
      <button type="button" class="gumb glavni" id="katPoisciDodatke"><svg data-ikona="splet"></svg><span data-t="katPoisciDodatke"></span></button>
      <p class="drobno" data-t="katStremioBrezAplikacije"></p>
    </div>
    <form class="kat-dodaj-vir kat-dodaj-streznik" id="mediaDodajStreznik">
      <select id="mediaStreznikVrsta" aria-label="Vrsta">
        <option value="stremio" data-t="katVrstaStremio"></option>
        <option value="jellyfin">Jellyfin</option><option value="emby">Emby</option>
        <option value="plex">Plex</option><option value="navidrome">Navidrome</option>
        <option value="kodi" data-t="katVrstaKodi"></option><option value="tvheadend">TVHeadend</option>
        <option value="dlna">DLNA / UPnP</option><option value="funkwhale">Funkwhale</option><option value="azuracast">AzuraCast</option>
      </select>
      <input id="mediaStreznikUrl" type="text" maxlength="1024" autocomplete="off" required>
      <button class="gumb" type="button" id="katPrilepi" data-t="katPrilepi"></button>
      <input id="mediaStreznikIme" type="text" maxlength="80" data-ph="katImeNeobvezno" autocomplete="off">
      <input id="mediaStreznikUporabnik" type="text" maxlength="160" data-ph="katUporabnik" autocomplete="off" hidden>
      <input id="mediaStreznikSkrivnost" type="password" maxlength="4096" data-ph="katGeslo" autocomplete="off" hidden>
      <button class="gumb glavni" type="submit" data-t="katPovezi"></button>
    </form>
    <form class="kat-dodaj-vir" id="mediaDodajVir">
      <input id="mediaVirUrl" type="text" maxlength="1024" data-ph="katNaslovVira" autocomplete="off">
      <input id="mediaVirIme" type="text" maxlength="80" data-ph="katImeNeobvezno" autocomplete="off">
      <button class="gumb" type="submit" data-t="katVirDodaj"></button>
    </form>
    <p class="drobno kat-vir-sporocilo" id="katVirSporocilo" aria-live="polite"></p>
    <div class="kat-viri" id="katViri"></div>
    <div class="gumbi"><button type="button" class="gumb" id="mediaOdkrijDlna" data-t="katOdkrijDlna"></button><button type="button" class="gumb" id="katViriZapri" data-t="zapri"></button></div>
  </div>
</div>
<div id="obvestilo"></div>
<script src="besedila.js"></script>
<script src="izhod.js"></script>
<script src="iskanje.js"></script>
<script src="os.js"></script>
<script src="kavc.js"></script>
</body>
</html>
